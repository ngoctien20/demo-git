name: "TIEN404 V20 Store Authority — hosted UAT on tien404-restore-test"
# Owner-approved 2026-11-21 12:47 UTC for tien404-restore-test ONLY. Never touches staging.
# Uses only RESTORE_DB_PASSWORD. Logs print PASS/FAIL tags and hashes, never data or errors
# from the DB client (this repository is public).
on:
  push:
    branches: [claude/project-thread-r8380r]
    paths:
      - qa/v20-store-authority/hosted/**
      - .github/workflows/tien404-v20-store-hosted-restore-test.yml
permissions:
  contents: read
concurrency:
  group: supabase-backup
  cancel-in-progress: false
env:
  RESTORE_REF: cunxxzxaboazbszsfneo
  STAGING_REF: ifxlvrhyjhbzbrkdsida
  PRE_MIGRATION_FP: 5b63ac1cffbd84acedac327a2bbe73cd
  ORIGINAL_WRITER_MD5: b8fa7077197e3fdbb05ce0a0806ae6e1
jobs:
  hosted-uat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build restore-test connection (masked)
        env:
          RESTORE_DB_PASSWORD: ${{ secrets.RESTORE_DB_PASSWORD }}
        run: |
          [ -n "$RESTORE_DB_PASSWORD" ] || { echo "::error::missing RESTORE_DB_PASSWORD"; exit 1; }
          [ "$RESTORE_REF" != "$STAGING_REF" ] || exit 1
          echo "::add-mask::$RESTORE_DB_PASSWORD"
          url=$(python3 -c 'import os,urllib.parse as u;print("postgresql://postgres.%s:%s@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"%(os.environ["RESTORE_REF"],u.quote(os.environ["RESTORE_DB_PASSWORD"],safe="")))')
          echo "::add-mask::$url"
          echo "RESTORE_DB_URL=$url" >> "$GITHUB_ENV"
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Login + guard (restore-test marker must exist)
        run: |
          case "$RESTORE_DB_URL" in *"$STAGING_REF"*) echo "::error::STOP staging"; exit 1;; esac
          out=$(psql "$RESTORE_DB_URL" -X -At -c "select to_regclass('restore_test_guard.marker') is not null" 2>/dev/null) || { echo "::error::login failed"; exit 1; }
          [ "$out" = t ] || { echo "::error::guard marker missing"; exit 1; }
          echo "GUARD_OK"
      - name: Reset writer to original if a previous run left the store-aware one
        run: |
          w=$(psql "$RESTORE_DB_URL" -X -At -c "select md5(pg_get_functiondef('public.save_merchant_product(uuid,text,text,bigint,boolean,integer,timestamptz)'::regprocedure))" 2>/dev/null)
          if [ "$w" != "$ORIGINAL_WRITER_MD5" ]; then
            psql "$RESTORE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f qa/v20-store-authority/80_store_aware_writer_rollback.sql >/dev/null 2>&1 || { echo "::error::writer reset failed"; exit 1; }
            echo "WRITER_RESET_TO_ORIGINAL"
          fi
      - name: Apply expand migration if not yet applied (restore-test only)
        run: |
          fp=$(psql "$RESTORE_DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1)
          echo "CURRENT_FP=$fp"
          if [ "$fp" = "$PRE_MIGRATION_FP" ]; then
            psql "$RESTORE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f qa/v20-store-authority/10_store_authority_expand.sql > /dev/null 2>err.txt \
              || { grep -o 'T404_[A-Z_]*' err.txt | head -1; rm -f err.txt; echo "::error::migration failed (transaction rolled back)"; exit 1; }
            grep -o 'T404_V20_STORE_AUTHORITY_EXPAND_OK' err.txt || { rm -f err.txt; echo "::error::postcondition marker missing"; exit 1; }
            rm -f err.txt
            echo "MIGRATION_APPLIED_TO_RESTORE_TEST"
          else
            echo "Migration state already differs from pre-migration baseline; not re-applying"
          fi
      - name: Fingerprint after migration
        run: |
          fp=$(psql "$RESTORE_DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1)
          [ -n "$fp" ] || exit 1
          [ "$fp" != "$PRE_MIGRATION_FP" ] || { echo "::error::migration not applied"; exit 1; }
          echo "POST_MIGRATION_FP=$fp" | tee -a "$GITHUB_ENV"
      - name: Hosted GoTrue JWT UAT, original writer (creates and deletes its own synthetic users/rows)
        env:
          T404_V20_HOSTED_TARGET: cunxxzxaboazbszsfneo
          T404_RESTORE_PUBLISHABLE_KEY: sb_publishable_PD4GvhqTC9LZeR7Bzwep9A_50gH53AZ
          T404_V20_WRITER: v1
        run: node qa/v20-store-authority/hosted/hosted-restore-test-uat.mjs
      - name: Apply store-aware writer (step 2)
        run: |
          psql "$RESTORE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f qa/v20-store-authority/20_store_aware_writer.sql > /dev/null 2>err.txt \
            || { grep -o 'T404_[A-Z_]*' err.txt | head -1; rm -f err.txt; echo "::error::writer apply failed"; exit 1; }
          grep -o 'T404_V20_STORE_AWARE_WRITER_OK' err.txt; rm -f err.txt
      - name: Hosted GoTrue JWT UAT, store-aware writer
        env:
          T404_V20_HOSTED_TARGET: cunxxzxaboazbszsfneo
          T404_RESTORE_PUBLISHABLE_KEY: sb_publishable_PD4GvhqTC9LZeR7Bzwep9A_50gH53AZ
          T404_V20_WRITER: v2
        run: node qa/v20-store-authority/hosted/hosted-restore-test-uat.mjs
      - name: Rollback writer + expand on hosted, verify fingerprints, re-apply both
        run: |
          run(){ psql "$RESTORE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$1" > /dev/null 2>err.txt || { grep -o 'T404_[A-Z_]*' err.txt | head -1; rm -f err.txt; echo "::error::$1 failed"; exit 1; }; rm -f err.txt; }
          fp(){ psql "$RESTORE_DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1; }
          wmd5(){ psql "$RESTORE_DB_URL" -X -At -c "select md5(pg_get_functiondef('public.save_merchant_product(uuid,text,text,bigint,boolean,integer,timestamptz)'::regprocedure))" 2>/dev/null; }
          run qa/v20-store-authority/80_store_aware_writer_rollback.sql
          [ "$(wmd5)" = "$ORIGINAL_WRITER_MD5" ] && echo PASS_HOSTED_WRITER_ROLLBACK_BODY_EQUALS_ORIGINAL || { echo "::error::writer rollback mismatch"; FAIL=1; }
          run qa/v20-store-authority/90_store_authority_rollback.sql
          after_rb=$(fp); echo "ROLLBACK_FP=$after_rb"
          [ "$after_rb" = "$PRE_MIGRATION_FP" ] && echo PASS_HOSTED_ROLLBACK_FP_EQUALS_PRE_MIGRATION || { echo "::error::rollback fingerprint mismatch"; FAIL=1; }
          run qa/v20-store-authority/10_store_authority_expand.sql
          after_re=$(fp); echo "REAPPLY_FP=$after_re"
          [ "$after_re" = "$POST_MIGRATION_FP" ] && echo PASS_HOSTED_REAPPLY_FP_EQUALS_POST_MIGRATION || { echo "::error::reapply fingerprint mismatch"; FAIL=1; }
          run qa/v20-store-authority/20_store_aware_writer.sql
          echo "FINAL_STATE=expand+store-aware-writer"
          exit ${FAIL:-0}
      - name: Side effects
        if: always()
        run: echo "TARGET=restore-test STAGING_TOUCHED=0 N8N=0 PROVIDER_SENDS=0"

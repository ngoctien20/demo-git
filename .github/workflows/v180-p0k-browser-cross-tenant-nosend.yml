name: V18.0-P0K Browser Real JWT Cross-Tenant COUNT-ONLY QA Source
on:
  push:
    branches:
      - work/v180-p0c-exact-rpc-disposable-qa-20261118
    paths:
      - "qa/v180-p0k/**"
      - "docs/ai-handoff/T404_V180_P0K_REAL_BROWSER_CROSS_TENANT_COUNT_ONLY.md"
      - ".github/workflows/v180-p0k-browser-cross-tenant-nosend.yml"

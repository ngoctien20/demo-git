      - name: Syntax-only browser operator source (never invoke against production)
        run: node --check qa/v180-p0k/private-browser-cross-tenant-counts.js
      - name: Static six-surface no-send no-write negative QA
        run: node --test qa/v180-p0k/private-browser-cross-tenant-counts.test.mjs

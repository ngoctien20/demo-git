name: V11 immutable Cloudflare widget deployment verification
on:
  push:
    branches: [qa/v11-widget-deployment]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.58.2
      - run: npx playwright install chromium
      - run: npx playwright test -c qa/playwright.config.cjs qa/cloudflare-hosted-widget.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-widget-postdeploy
          path: qa-results/
          retention-days: 14

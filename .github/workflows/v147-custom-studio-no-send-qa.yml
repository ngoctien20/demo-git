name: TIEN404 V14.7 Custom Bot Studio Synthetic QA
on:
  push:
    branches:
      - work/v147-merchant-custom-studio-offline-20261116
    paths:
      - 'qa/v147-custom-studio/**'
      - 'docs/ai-handoff/V14_7_*'
      - '.github/workflows/v147-custom-studio-no-send-qa.yml'
  pull_request:
    paths:
      - 'qa/v147-custom-studio/**'
      - 'docs/ai-handoff/V14_7_*'
      - '.github/workflows/v147-custom-studio-no-send-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-security:
    name: 36 new studio + 16 V14.6 bridge + inherited source QA
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New contract QA and inherited tests
        run: |
          node --check qa/v147-custom-studio/studio-core.js
          node --check qa/v147-custom-studio/studio-ui.js
          node --test qa/v147-custom-studio/studio-core.test.cjs
          node --test qa/v14601/level2-offline-bridge.test.cjs
          node --test qa/messenger-sales-v1448/messenger-four-flow-offline.test.cjs
          node --test qa/channel-v143/channel-core.test.cjs
      - name: Strict no credential, no network and no hosted writes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('qa/v147-custom-studio')
          src='\n'.join((root/'studio-core.js').read_text().splitlines()+(root/'studio-ui.js').read_text().splitlines())
          assert 'HOSTED_WRITE_DISABLED' in src
          assert 'PUBLISH_REQUIRES_AUTHENTICATED_SERVER_GATE' in src
          assert "connect-src 'none'" in (root/'index.html').read_text()
          for token in ('fetch(', 'XMLHttpRequest', 'axios(', 'process.env', 'graph.facebook.com',
                        'service_role', 'localStorage', 'sessionStorage', 'eval(', 'new Function('):
            assert token not in src,token
          print('PASS no network, tokens, global publication or hosted writes in source')
          PY
  chromium-preview:
    name: Playwright 6 viewports + offline shop/channel isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA-only Playwright Chromium
        run: |
          npm install --no-save --prefix qa/v147-custom-studio playwright@1.56.1
          cd qa/v147-custom-studio && npx playwright install --with-deps chromium
      - name: Serve fixture only on loopback
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/t404-v147-http.log 2>&1 &
          sleep 2
      - name: Run mobile and desktop visual QA
        run: node qa/v147-custom-studio/browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v147-synthetic-studio-390px
          path: qa-artifacts-v147/
          if-no-files-found: ignore

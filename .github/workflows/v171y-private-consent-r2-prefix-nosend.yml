          assert q['expectedSyntheticOrderPlans']==4
          assert len(q['nodes'])==5
          assert {n['type'] for n in q['nodes']}=={'n8n-nodes-base.manualTrigger','n8n-nodes-base.code'}
          assert d['supabaseReadOnlyAsObserved']['sameTenantDistinctStoreOwnerPairs']==0

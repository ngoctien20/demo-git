      - name: 'V17.1U private evidence reference intake synthetic adversarial tests'
        run: |
          node -c qa/v171u-private-evidence/private-evidence-intake.cjs
          node --test qa/v171u-private-evidence/private-evidence-intake.test.cjs
      - name: 'V17.1U evidence source-only and real-hosted NO GO contract'
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          m=json.loads(Path('qa/v171u-private-evidence/real-acceptance-state.json').read_text())
          assert m['release']=='HOSTED_NO_GO' and m['sourceOnly'] is True
          assert m['noEvidenceUploaded'] is True and m['noRealJwtImported'] is True

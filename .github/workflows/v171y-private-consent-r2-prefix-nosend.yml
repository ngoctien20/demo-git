name: TIEN404 V17.1Y Protected Access Canary R2 Inventory and QA Auth Consent NO SEND
on:
  push:
    branches:
      - work/v171y-protected-canary-r2-prefix-qa-owner-consent-20261117
  pull_request:
    paths:
      - 'qa/v171y-private-consent/**'
      - 'qa/v171p-bot-security/**'
      - 'docs/ai-handoff/V17_1Y_*'
      - '.github/workflows/v171y-private-consent-r2-prefix-nosend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v171y-private-consent-regression:
    name: V17.1Y 40 signed consent and prefix cases + 1185 inherited source regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 'V17.1Y trusted R2 prefix inventory and signed protected QA consent tests'
        run: |
          node -c qa/v171y-private-consent/private-canary-consent-gate.cjs
          node --test qa/v171y-private-consent/private-canary-consent-gate.test.cjs
      - name: 'V17.1Y real consent cannot be implied by signed synthetic fixture'
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          m=json.loads(Path('qa/v171y-private-consent/real-acceptance-state.json').read_text())
          assert m['release']=='HOSTED_NO_GO' and m['sourceOnly'] is True
          assert m['newSourceTests']==40 and m['inheritedSourceTests']==1185
          assert m['liveReleaseApproved'] is False
          assert m['realReadOnlyEvidence']['r2ObjectsReturned']==0
          assert m['realReadOnlyEvidence']['r2HasMore'] is False
          assert m['realReadOnlyEvidence']['prefixEmptyAtReadTime'] is True
          assert m['realReadOnlyEvidence']['prefixRecheckBeforeAnyLifecycleWriteRequired'] is True
          assert m['realReadOnlyEvidence']['externalDeniedProtectedCanaryRun'] is False
          assert m['realReadOnlyEvidence']['externalAuthorizedOperatorCanaryRun'] is False
          assert m['realReadOnlyEvidence']['ownerPairSameTenantCount']==0
          assert m['realReadOnlyEvidence']['independentAuthSessionPairSameTenantCount']==0
          for v in m['realHumanConsent'].values(): assert v is False
          for k in ('actualCloudflareMutations','actualSupabaseAuthUsersCreated',
                    'actualTenantStoreMembershipChanges','actualR2ObjectWrites',
                    'actualCustomerMessages','actualProviderWebhooksSent'):
              assert m[k]==0,k
          assert m['proposedOnly']['publicRouteCreationApproved'] is False
          assert m['proposedOnly']['r2LifecycleChangeApproved'] is False
          assert m['proposedOnly']['realQaAccountProvisioningApproved'] is False
          source=Path('qa/v171y-private-consent/private-canary-consent-gate.cjs').read_text()
          for banned in (r'\bfetch\s*\(',r'\bprocess\.env\b',
                         r'\bchild_process\b',r'\bhttps?\.request\s*\(',r'\baxios\b'):
              assert not re.search(banned,source),banned
          assert 'PRIVATE_PROTECTED_CANARY_AND_QA_AUTH_CONSENT_REVIEW_ONLY' in source
          assert 'allowAuthProvisioning:false' in source
          assert 'allowProtectedCanaryExecution:false' in source
          assert 'allowR2Mutation:false' in source
          print('V171Y_REAL_PREFIX_EMPTY_READ_ONLY_SYNTHETIC_CONSENT_NO_GO_PASS')
          PY
      - name: 'V17.1X source-only external Access canary, scoped R2 lifecycle and Auth plan QA'
        run: |
          node -c qa/v171x-hosted-uat/hosted-uat-approval-plan.cjs
          node --test qa/v171x-hosted-uat/hosted-uat-approval-plan.test.cjs
      - name: 'V17.1X hosted gate and R2 deletion proposal stay NOT APPROVED'
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          m=json.loads(Path('qa/v171x-hosted-uat/real-acceptance-state.json').read_text())
          assert m['release']=='HOSTED_NO_GO' and m['sourceOnly'] is True
          assert m['newSourceTestCases']==53 and m['inheritedSourceTestCases']==1132
          assert m['productionReleaseApproved'] is False
          assert m['hostedPrivateCanaryApproved'] is False
          assert m['r2LifecycleChangeApproved'] is False
          assert m['qaOwnerIdentityProvisioningApproved'] is False
          for k,v in m['realHostedEvidence'].items():
              assert v is False,k
          for k in ('actualCloudflareWrites','actualR2Writes',
                    'actualAuthUsersProvisioned','actualTenantOrStoreWrites',
                    'actualN8nWrites','actualProviderSends','actualPaidActions'):
              assert m[k]==0,k
          assert m['proposedOnly']['proposedNewRuleInitiallyDisabled'] is True
          assert m['proposedOnly']['zeroOldObjectsUnderPrefixVerified'] is False
          assert m['verifiedReadOnly']['defaultAbortMultipartMaxAgeSeconds']==604800
          assert m['verifiedReadOnly']['lifecycleObjectExpirationRuleCount']==0
          src=Path('qa/v171x-hosted-uat/hosted-uat-approval-plan.cjs').read_text()
          for bad in (r'\bfetch\s*\(',r'\bprocess\.env\b',
                      r'\bchild_process\b',r'\bhttps?\.request\s*\(',r'\baxios\b'):
              assert not re.search(bad,src),bad
          assert 'PRIVATE_HOSTED_CANARY_AND_R2_APPROVAL_PLAN_ONLY' in src
          assert 'allowR2Put:false' in src
          assert 'allowAuthWrites:false' in src
          print('V171X_SOURCE_ONLY_R2_APPROVAL_NO_SEND_HOSTED_NO_GO_PASS')
          PY
      - name: 'V17.1W independent private Worker R2 and two Owner gate regression'
        run: |
          node -c qa/v171w-private-worker-security/private-worker-security-gate.cjs
          node --test qa/v171w-private-worker-security/private-worker-security-gate.test.cjs
      - name: 'V17.1W real hosted inventory is not an authorization receipt'
        run: |
          python - <<'PY'

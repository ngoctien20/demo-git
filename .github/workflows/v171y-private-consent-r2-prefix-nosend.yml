          assert m['readOnlyCloudflare']['r2ObjectDeletionRetentionAttested'] is False
          assert m['readOnlyCloudflare']['workerDurableReplayBindingAttested'] is False
          source=Path('qa/v171w-private-worker-security/private-worker-security-gate.cjs').read_text()
          for bad in (r'\bfetch\s*\(',r'\bprocess\.env\b',r'\bchild_process\b',

  v171y-disposable-pg17-rls:
    name: V17.1T disposable PG17 Store isolation rollback (not JWT)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_only_password
          POSTGRES_DB: t404_v171p_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d t404_v171p_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: 'Install disposable PostgreSQL client'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: 'Create synthetic authenticated ROLE only in throwaway CI container'
        env:
          PGPASSWORD: synthetic_ci_only_password
        run: psql -h localhost -U postgres -d t404_v171p_disposable -X -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN;"
      - name: 'Run saved Store A/B RLS and confirm rollback of temp table'
        env:
          PGPASSWORD: synthetic_ci_only_password
        run: |
          psql -h localhost -U postgres -d t404_v171p_disposable -X -v ON_ERROR_STOP=1 -f qa/v171n-bot-security/disposable_pg17_store_rls_rollback.sql
          test "$(psql -h localhost -U postgres -d t404_v171p_disposable -X -At -c "SELECT count(*) FROM pg_catalog.pg_class WHERE relname='t404_v171n_disposable_store_rls'")" = "0"
          echo 'V171P_DISPOSABLE_PG17_ROW_ISOLATION_ROLLBACK_PASS_NO_REAL_JWT'
  real-auth-page-oa-admission-no-go:
    name: V17.1Y Real Protected Access Canary R2 Lifecycle Owner Consent NO GO
    runs-on: ubuntu-24.04
    needs: [v171y-private-consent-regression,v171y-disposable-pg17-rls]
    timeout-minutes: 2
    steps:
      - name: 'Fail closed until independent Auth JWT, same-Tenant owners and Page OA signed canary'
        run: |
          echo "::error::V171Y_NO_GO_REAL_PRIVATE_ACCESS_R2_AUTH_CONSENT"
          exit 3

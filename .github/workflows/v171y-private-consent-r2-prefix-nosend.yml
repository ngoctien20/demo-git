      - name: 'V17.1T four-party cryptographic operator approval no-send regression'
        run: |
          node -c qa/v171t-private-uat/private-admission.cjs
          node --test qa/v171t-private-uat/private-admission.test.cjs
      - name: 'V17.1T validate real operator and owner proof remains NO-GO'
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          m=json.loads(Path('qa/v171t-private-uat/real-acceptance-state.json').read_text())
          assert m['release']=='HOSTED_NO_GO'
          assert m['testedSourceOnly'] is True
          assert m['productionReleaseApproved'] is False
          assert m['roleOrMembershipMutationApproved'] is False
          assert m['codeContainsRealCredentials'] is False
          for k,v in m['realHostedEvidence'].items():
              assert v is False,k
          assert m['actualMessagesSent']==0 and m['actualCommerceReads']==0
          assert m['actualAuthUsersCreated']==0 and m['actualOrdersWritten']==0

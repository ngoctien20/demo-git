          assert d['supabaseReadOnlyAsObserved']['realTwoOwnerJwtAttested'] is False
          assert d['providerAuthority']['realMetaSignedQaEventAttested'] is False
          assert d['providerAuthority']['realZaloSignedQaEventAttested'] is False
          for n in q['source']:

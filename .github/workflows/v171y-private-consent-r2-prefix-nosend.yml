      - name: 'V17.1P replay exact n8n inactive Store Auth reader guard and mutations'
        run: node --test qa/v171p-bot-security/v171p-n8n-reader.test.cjs
      - name: 'Inherited V17.1O exact Published V17.17 source and Unicode 57 cases'
        run: node --test qa/v171o-bot-security/v171o-source-regression.test.cjs
      - name: 'Inherited V17.1N guarded Core and signed-shaped replay 57 cases'
        run: node --test qa/v171n-bot-security/v171n-shadow.test.cjs
      - name: 'Inherited V17.1M same-Tenant simulated Store A/B 48 cases'
        run: node --test qa/v171m-bot-security/v171m-snapshot.test.cjs
      - name: 'Inherited V17.1L forged tenant/tool authority and PII-free audit 120 cases'
        run: |
          node --test qa/v171l-bot-security/zero-trust-bot-boundary.test.cjs
          node --test qa/v171l-bot-security/safe-audit-and-quota.test.cjs

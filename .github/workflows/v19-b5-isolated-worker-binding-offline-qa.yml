name: TIEN404 V19.0-B5 - Isolated Worker Binding D1 and Durable Inbox QA

on:
  push:
    branches:
      - qa/v19-b5-local-binding-outbox-protected-admission-20261118
    paths:
      - qa/v19-webhook/**
      - .github/workflows/v19-b5-isolated-worker-binding-offline-qa.yml
  pull_request:
    paths:
      - qa/v19-webhook/**
      - .github/workflows/v19-b5-isolated-worker-binding-offline-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b5-local-binding:
    name: workerd Miniflare D1 binding plus local SQLite + prior regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen deployed-worker source
        shell: bash
        run: |
          actual="$(git hash-object qa/v19-webhook/source-snapshot/v1723u-worker-deployed.mjs)"
          test "$actual" = "11affa7658b46ae7c411eed7877d7ccdce61bbad"
      - name: Check all B5 Worker source syntax
        run: |
          node --check qa/v19-webhook/b5/durable-inbox-contract.mjs
          node --check qa/v19-webhook/b5/protected-admission-qa.mjs
          node --check qa/v19-webhook/b5/tests/local-binding-worker.mjs
          node --check qa/v19-webhook/b5/tests/miniflare-d1-binding.test.mjs
      - name: Isolated Miniflare runtime dependency (only this QA job)
        run: |
          npm install --no-save --no-audit --no-fund --prefix qa/v19-webhook/b5/tests miniflare@3.20250718.3
          node -p "require('./qa/v19-webhook/b5/tests/node_modules/miniflare/package.json').version"
      - name: Test actual local Workers D1 binding through workerd
        run: node --test qa/v19-webhook/b5/tests/miniflare-d1-binding.test.mjs
      - name: Native SQLite atomic inbox / lease / retry / DLQ tests
        run: python3 qa/v19-webhook/b5/tests/inbox_sqlite_contract_test.py
      - name: Full B4 protected registry negative regression
        run: |
          node --test qa/v19-webhook/b4/tests/trusted-installation-gate.test.mjs
          python3 qa/v19-webhook/b4/tests/registry_sqlite_contract_test.py
      - name: Full B3 timeout/rate-limit/idempotency regression
        run: |
          node --test qa/v19-webhook/b3/tests/ingress-candidate.test.mjs
          python3 qa/v19-webhook/b3/tests/sqlite_semantics_test.py
      - name: Full B2 Worker snapshot and canonical Bot regression
        run: node --test qa/v19-webhook/tests/*.test.mjs
      - name: Assert no cloud deployment configuration or credentials
        run: |
          test ! -e qa/v19-webhook/b5/wrangler.toml
          test ! -e qa/v19-webhook/b5/wrangler.jsonc
          test ! -e qa/v19-webhook/b5/.env
          grep -q "status:423" qa/v19-webhook/b5/protected-admission-qa.mjs
          echo "B5 has no cloud credentials or hosted D1 binding, no webhook, no n8n/commerce sends."

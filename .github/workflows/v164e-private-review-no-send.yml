name: TIEN404 V16.4E Frozen Canary Private Reviewer Packet (NO SEND)
on:
  push:
    branches:
      - work/v164e-frozen-canary-private-review-evidence-nosend-20261116
  pull_request:
    paths:
      - 'qa/v164e-review/**'
      - 'docs/ai-handoff/V16_4E_*'
      - '.github/workflows/v164e-private-review-no-send.yml'
permissions:
  contents: read
jobs:
  freeze-review-offline:
    name: V16.4E 27 private-freeze checks + 445 inherited synthetic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-only freeze and QA reviewer checklist
        run: |
          python3 -m py_compile qa/v164e-review/freeze_private_canary.py
          python3 -m py_compile qa/v164e-review/test_freeze_private_canary.py
          python3 qa/v164e-review/test_freeze_private_canary.py
      - name: Inherited synthetic data privacy tests
        run: |
          python3 qa/v164b-privacy/test_private_sanitizer.py
      - name: Inherited V16.4D -> V16.1 offline Node tests
        run: |
          node --test qa/v164d-decision/v164d-decision.test.mjs
          node --test qa/v164c-canary/v164c-private-canary.test.mjs
          node --test qa/v164b-privacy/v164b-preflight.test.mjs
          node --test qa/v164-private-ab/v164-eval-readiness.test.mjs
          node --test qa/v164-private-ab/private-readiness.test.mjs
          node --test qa/v163-studios/v163-studios.test.mjs
          node --test qa/v162-capacity/capacity-core.test.mjs
          node --test qa/v16-hybrid/hybrid-core.test.mjs
      - name: No private corpus, model calls or credentials in public repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('qa/v164e-review')
          files=[root/'freeze_private_canary.py',root/'test_freeze_private_canary.py']
          assert all(x.exists() for x in files)
          assert not list(root.glob('*.csv'))
          assert not list(root.glob('V164E_PRIVATE_*.json'))
          for f in files:
            text=f.read_text()
            for forbidden in [r'\brequests\.(?:post|get)\s*\(',r'\burllib\.request\b',
                              r'\bfetch\s*\(',r'\bWebSocket\b',r'\bsubprocess\b',
                              r'(?i)sk-[A-Za-z0-9_-]{16,}']:
              assert not re.search(forbidden,text),(f,forbidden)
          assert 'provider_transfer_allowed' in files[0].read_text()
          assert 'NOT_REVIEWED' in files[0].read_text()
          print('PASS source-only private-review packet; no real QA dataset in CI')
          PY
  human-provider-authority:
    name: Two independent privacy reviewers + direct project entitlement + paid budget — NOT RUN
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'BLOCKED: no human acceptance, no project model entitlement, no paid canary consent'

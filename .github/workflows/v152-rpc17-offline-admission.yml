name: TIEN404 RPC17 — Offline Admission Hardening (NO SEND)
on:
  push:
    branches:
      - work/v152-rpc17-private-admission-hardening-source-20261117
  pull_request:
    paths:
      - 'qa/v152-rpc17/**'
      - 'qa/v152-rpc16/**'
      - 'docs/ai-handoff/T404_RPC17_*'
      - '.github/workflows/v152-rpc17-offline-admission.yml'
permissions:
  contents: read
jobs:
  offline-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RPC17 offline 26-case suite
        run: |
          node --check qa/v152-rpc17/private-admission.mjs
          node --test qa/v152-rpc17/private-admission.test.mjs
      - name: RPC16 through RPC13 inherited security regression (NO SEND)
        run: |
          node --test qa/v152-rpc16/inactive-worker.test.mjs
          node --test qa/v152-rpc15/private-r2-quarantine.test.mjs
          node --test qa/v152-rpc14/smoke.test.mjs
          node --test qa/v152-rpc13/secure-identity-and-uat.test.mjs
      - name: Deny hosted uploads and forbid public deployment in RPC17
        run: |
          node --input-type=module -e "import {hostedDecision} from './qa/v152-rpc17/private-admission.mjs'; const a=hostedDecision(); if(a.accepted||a.can_upload||a.can_open_access||a.can_send) process.exit(1)"
          grep -Eq '"workers_dev"[[:space:]]*:[[:space:]]*false' qa/v152-rpc16/wrangler.jsonc
          grep -Eq '"preview_urls"[[:space:]]*:[[:space:]]*false' qa/v152-rpc16/wrangler.jsonc

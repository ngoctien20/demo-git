name: "TIEN404 V19.8.4 Protected Catalog Reader Offline QA"

on:
  pull_request:
    paths:
      - "qa/channel-v1984/**"
      - ".github/workflows/tien404-v1984-catalog-reader-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-contract:
    name: "44 synthetic preview-format and no-send safety cases"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout no persisted GitHub token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute preview contract QA
        run: node qa/channel-v1984/catalog-preview-contract.test.mjs

  ephemeral-catalog-reader:
    name: "Postgres 17 / Store A B catalog RLS and price stock snapshot QA"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral_qa_only
          POSTGRES_DB: tien404_v1984_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tien404_v1984_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ephemeral_qa_only
      PGDATABASE: tien404_v1984_ephemeral
    steps:
      - name: Checkout no persisted token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Assert disposable local database
        run: |
          test "$PGHOST" = "localhost"
          test "$PGDATABASE" = "tien404_v1984_ephemeral"
          test ! -e qa/channel-v1984/hosted-migration.sql
      - name: Create prior Store A B RLS fixture
        run: psql -X -v ON_ERROR_STOP=1 -f qa/channel-v1983/ephemeral-postgres-schema.sql
      - name: Install Store scoped catalog snapshot fixture
        run: psql -X -v ON_ERROR_STOP=1 -f qa/channel-v1984/ephemeral-catalog-reader-schema.sql
      - name: Verify real PostgreSQL Store catalog allow deny freshness and integrity
        run: psql -X -v ON_ERROR_STOP=1 -f qa/channel-v1984/ephemeral-catalog-reader-acceptance.sql

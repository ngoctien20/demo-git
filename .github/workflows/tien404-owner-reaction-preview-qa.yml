name: TIEN404 V21.3 Owner Reaction Preview QA (draft only)
on:
  pull_request:
    paths:
      - 'apps/owner/**'
      - 'config-core/lib/reaction-profiles.mjs'
      - 'config-core/lib/social-reactions.mjs'
      - 'qa/reactions/owner-preview-browser.cjs'
      - '.github/workflows/tien404-owner-reaction-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse hosted credentials and tokens
        run: test -z "${SUPABASE_SERVICE_ROLE_KEY:-}${META_PAGE_ACCESS_TOKEN:-}${N8N_API_KEY:-}${SUPABASE_ACCESS_TOKEN:-}"
      - name: Typecheck and compile Owner App candidate WITHOUT publishing generated app/
        working-directory: apps/owner
        run: npm ci --no-audit --no-fund && npm run build
      - name: Prepare offline browser QA
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Browser acceptance desktop 1280 + mobile 390 (mocked Supabase / NO SEND)
        env:
          SHOTS_DIR: shots
        run: node qa/reactions/owner-preview-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v21-reaction-owner-preview-screens
          path: shots
          retention-days: 14

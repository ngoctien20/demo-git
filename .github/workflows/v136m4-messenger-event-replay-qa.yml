name: TIEN404 V13.6M.4 Messenger Event Isolation & Replay OFFLINE QA
on:
  push:
    branches:
      - work/v136m4-messenger-event-isolation-replay-offline-20261115
    paths:
      - "qa/messenger-rich-v136m/**"
      - "qa/messenger-rich-v136m1/**"
      - "qa/messenger-rich-v136m2/**"
      - "qa/messenger-rich-v136m3/**"
      - "qa/messenger-rich-v136m4/**"
      - "docs/ai-handoff/V13_6M4_*"
      - ".github/workflows/v136m4-messenger-event-replay-qa.yml"
  pull_request:
    paths:
      - "qa/messenger-rich-v136m/**"
      - "qa/messenger-rich-v136m1/**"
      - "qa/messenger-rich-v136m2/**"
      - "qa/messenger-rich-v136m3/**"
      - "qa/messenger-rich-v136m4/**"
      - "docs/ai-handoff/V13_6M4_*"
      - ".github/workflows/v136m4-messenger-event-replay-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  per-event-replay-qa:
    name: Multi-PSID and offline replay + inherited security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and all six synthetic suites
        run: |
          node --check qa/messenger-rich-v136m1/integration.cjs
          node --check qa/messenger-rich-v136m2/trusted-repository.cjs
          node --check qa/messenger-rich-v136m3/canonical-pipeline.cjs
          node --check qa/messenger-rich-v136m4/event-isolation.cjs
          node --test qa/messenger-rich-v136m/adapter.test.cjs qa/messenger-rich-v136m1/integration.test.cjs qa/messenger-rich-v136m2/trusted-repository.test.cjs qa/messenger-rich-v136m2/trusted-resolver.test.cjs qa/messenger-rich-v136m3/canonical-pipeline.test.cjs qa/messenger-rich-v136m4/event-isolation.test.cjs
      - name: Verify no transport, token, DB mutations and fail-closed SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          integration=Path("qa/messenger-rich-v136m1/integration.cjs").read_text()
          source=Path("qa/messenger-rich-v136m4/event-isolation.cjs").read_text()
          pipeline=Path("qa/messenger-rich-v136m3/canonical-pipeline.cjs").read_text()
          sql=Path("qa/messenger-rich-v136m4/PROPOSAL_ONLY_DURABLE_REPLAY_DO_NOT_RUN.sql").read_text()
          assert "verifyMetaRaw({rawBody,signature,appSecret});" in pipeline
          assert "portsFactory===undefined?ports:await portsFactory()" in integration
          assert "eventIsolation===true?{portsFactory:eventPortsFactory}:{ports}" in pipeline
          assert "durableReplayReady:false" in source
          assert "outboxWriteEnabled:false" in source
          assert "sendEnabled:false" in source
          assert "MODE_NOT_APPROVED" not in source
          assert sql.upper().find("RAISE EXCEPTION")>=0
          assert sql.upper().index("RAISE EXCEPTION") < sql.upper().index("ZERO CREATE")
          assert "DO NOT RUN" in str(Path("qa/messenger-rich-v136m4/PROPOSAL_ONLY_DURABLE_REPLAY_DO_NOT_RUN.sql")).upper()
          for path in [
           "qa/messenger-rich-v136m3/canonical-pipeline.cjs",
           "qa/messenger-rich-v136m4/event-isolation.cjs"
          ]:
           txt=Path(path).read_text()
           for banned in ["fetch(", "axios(", "process.env", "graph.facebook.com",
                          "PAGE_ACCESS_TOKEN", "httpRequest(", "INSERT INTO", "DELETE FROM"]:
            assert banned not in txt,(path,banned)
          print("PASS offline no send, no writes, per-event HMAC gate, proposal-only SQL")
          PY

name: V18.6.3–10 Store Authority and Full n8n Static RPC Scan NO LIVE
on:
  push:
    paths:
      - 'qa/store-authority-v1863/**'
      - 'qa/store-authority-v1864/**'
      - 'qa/store-authority-v1865/**'
      - 'qa/store-authority-v1866/**'
      - 'qa/store-authority-v1867/**'
      - 'qa/store-authority-v1868/**'
      - 'qa/store-authority-v1869/**'
      - 'qa/store-authority-v18610/**'
      - '.github/workflows/v1863-store-authority-disposable-pg17.yml'
  pull_request:
    paths:
      - 'qa/store-authority-v1863/**'
      - 'qa/store-authority-v1864/**'
      - 'qa/store-authority-v1865/**'
      - 'qa/store-authority-v1866/**'
      - 'qa/store-authority-v1867/**'
      - 'qa/store-authority-v1868/**'
      - 'qa/store-authority-v1869/**'
      - 'qa/store-authority-v18610/**'
      - '.github/workflows/v1863-store-authority-disposable-pg17.yml'
permissions:
  contents: read
jobs:
  qa-pg17-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: v1863-disposable-only
          POSTGRES_DB: tien404_v1863_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      V1863_DISPOSABLE_POSTGRES: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: tien404_v1863_qa
      PGPASSWORD: v1863-disposable-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install psql PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Assert strictly synthetic fixture
        run: |
          test "$PGDATABASE" = 'tien404_v1863_qa'
          test "$V1863_DISPOSABLE_POSTGRES" = 'true'
          ! grep -R -E 'ifxlvrhyjhbzbrkdsida|ngoctien20.app.n8n.cloud|developers.facebook.com' qa/store-authority-v1863/pg17-fixture.sql
      - name: Execute disposable PostgreSQL RLS tests (V18.6.3)
        run: node --test qa/store-authority-v1863/pg17-rls.test.cjs
      - name: Execute synthetic read-only Owner A/B admission tests (V18.6.4)
        run: node --test qa/store-authority-v1864/readonly-admission.test.cjs
      - name: Verify hard fail-closed safety flag contract
        run: |
          node -e "const f=require('./qa/store-authority-v1864/readonly-admission.cjs').FLAGS; if(f.metaLiveApi!==false||f.providerSend!==false||f.orderWrite!==false||f.allowPrivateOrderRead!==false) process.exit(1)"
      - name: Execute synthetic protected UAT contract tests (V18.6.5)
        run: node --test qa/store-authority-v1865/protected-uat-gate.test.cjs qa/store-authority-v1865/dependency-inventory.test.cjs
      - name: Assert V18.6.5 no-live proof flags
        run: |
          node -e "const f=require('./qa/store-authority-v1865/protected-uat-gate.cjs').FLAGS; if(f.qaMode!=='SYNTHETIC_QA'||f.liveAuth!==false||f.liveMeta!==false||f.customerDataRead!==false||f.privateOrderRead!==false||f.orderWrite!==false||f.providerSend!==false||f.databaseWrite!==false) process.exit(1)"
      - name: Execute V18.6.6 evidence reconciliation and irreversible NO-GO gate
        run: |
          node --test qa/store-authority-v1866/readiness-gate.test.cjs
          node qa/store-authority-v1866/readiness-gate.cjs
          node -e "const x=require('./qa/store-authority-v1866/readiness-gate.cjs').evaluateBundled(); if(x.productionReady || x.realUatApproved || x.metaOAuthApproved || x.authorizesMigration || x.status!=='BLOCKED') process.exit(1)"
      - name: V18.6.7 Legacy Writer evidence integrity (NO HOST)
        run: |
          node --test qa/store-authority-v1867/writer-path-inventory.test.cjs
          node -e "const x=require('./qa/store-authority-v1867/writer-path-inventory.json');if(x.completeness!=='PARTIAL'||x.provesNoOtherWriters!==false||x.design.stagingDbMigration!=='NOT_AUTHORIZED'||Object.values(x.safety).some(v=>v!==false))process.exit(1)"
      - name: V18.6.8 read-only metadata and irreversible migration NO-GO gate
        run: |
          node --test qa/store-authority-v1868/preflight-gate.test.cjs
          node -e "const x=require('./qa/store-authority-v1868/preflight-gate.cjs').evaluateBundled();if(x.status!=='BLOCKED'||x.deployApproved||x.databaseMutationApproved||x.privilegedRpcChangeApproved||x.realOwnerABApproved||x.productionReady)process.exit(1)"
      - name: V18.6.9 Active Zalo RPC caller graph + release NO-GO (NO HOST)
        run: |
          node --test qa/store-authority-v1869/revocation-admission.test.cjs
          node qa/store-authority-v1869/revocation-admission.cjs
          node -e "const x=require('./qa/store-authority-v1869/revocation-admission.cjs').assessBundled();if(x.status!=='NO_GO'||x.activeRpcRevocationAllowed||x.storeSchemaMigrationAllowed||x.publishN8nAllowed||x.productionReady)process.exit(1)"
      - name: V18.6.10 Complete current n8n static RPC audit and backup NO-GO
        run: |
          node --test qa/store-authority-v18610/decision-gate.test.cjs
          node qa/store-authority-v18610/decision-gate.cjs
          node -e "const x=require('./qa/store-authority-v18610/decision-gate.cjs').assessBundled();if(x.status!=='NO_GO'||x.n8nCurrentListStaticCoverage!==171||x.revokeZaloRpcAnonExecuteAllowed||x.applySupabaseMigrationAllowed||x.rewirePublishedMessengerAllowed||x.realOwnerAbUatApproved||x.productionReady)process.exit(1)"

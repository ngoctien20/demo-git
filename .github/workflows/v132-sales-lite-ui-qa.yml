name: TIEN404 SALES LITE V1.2 studio portal QA
on:
  push:
    branches:
      - work/v132-sales-lite-ui-staging
    paths:
      - "qa/sales-lite/v131/**"
      - "qa/sales-lite/v132/**"
      - ".github/workflows/v132-sales-lite-ui-qa.yml"
  pull_request:
    paths:
      - "qa/sales-lite/v132/**"
      - ".github/workflows/v132-sales-lite-ui-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sales-lite-no-send-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and registry contracts
        run: |
          node --check qa/sales-lite/v132/studio/app.js
          node --check qa/sales-lite/v132/account/app.js
          node --check qa/sales-lite/v132/v132-ui.test.cjs
          node -e "let r=require('./qa/sales-lite/v131/menu-registry.json');if(r.menu_version!=='1.1.0'||r.send_enabled||r.order_write_enabled||r.subscription_write_enabled)process.exit(1)"
      - name: V13.2 source and security QA
        run: node --test qa/sales-lite/v132/v132-ui.test.cjs
      - name: V13.1 menu regression QA
        run: node --test qa/sales-lite/v131/*.test.cjs

name: TIEN404 SALES LITE V1.2 studio portal QA
on:
  push:
    branches:
      - work/v132-sales-lite-ui-staging
    paths:
      - "qa/sales-lite/v131/**"
      - "qa/sales-lite/v132/**"
      - ".github/workflows/v132-sales-lite-ui-qa.yml"
  pull_request:
    paths:
      - "qa/sales-lite/v132/**"
      - ".github/workflows/v132-sales-lite-ui-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sales-lite-no-send-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and registry contracts
        run: |
          node --check qa/sales-lite/v132/studio/app.js
          node --check qa/sales-lite/v132/account/app.js
          node --check qa/sales-lite/v132/v132-ui.test.cjs
          node -e "let r=require('./qa/sales-lite/v131/menu-registry.json');if(r.menu_version!=='1.1.0'||r.send_enabled||r.order_write_enabled||r.subscription_write_enabled)process.exit(1)"
      - name: V13.2 source and security QA
        run: node --test qa/sales-lite/v132/v132-ui.test.cjs
      - name: V13.1 menu regression QA
        run: node --test qa/sales-lite/v131/*.test.cjs
  v132-browser-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Playwright in ephemeral runner
        run: |
          cd qa/sales-lite/v132
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser QA across five responsive sizes
        run: |
          python -m http.server 8080 > /tmp/tien404-v132-http.log 2>&1 &
          sleep 2
          node qa/sales-lite/v132/v132-browser-qa.cjs
      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v132-browser-evidence
          path: qa-artifacts/
          if-no-files-found: ignore


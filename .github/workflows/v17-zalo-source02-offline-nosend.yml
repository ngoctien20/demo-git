name: V17.ZALO-SOURCE-02 OA PKCE Store Admission - OFFLINE NO SEND
on:
  pull_request:
    paths:
      - "qa/zalo-oa-source-admission/**"
      - "docs/ai-handoff/V17_ZALO_SOURCE_02_CHECKPOINT.md"
      - ".github/workflows/v17-zalo-source02-offline-nosend.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check node runtime
        run: node --version
      - name: Syntax checks
        run: |
          node --check qa/zalo-oa-source-admission/oa-oauth-offline.mjs
          node --check qa/zalo-oa-source-admission/oa-oauth-offline.test.mjs
          node --check qa/zalo-oa-source-admission/oa-admission.mjs
          node --check qa/zalo-oa-source-admission/oa-admission.test.mjs
      - name: Parent signed OA webhook + new OAuth/Store offline tests
        run: |
          node --test qa/zalo-oa-source-admission/oa-admission.test.mjs qa/zalo-oa-source-admission/oa-oauth-offline.test.mjs
      - name: Reject network, token exchange and outbound side effects in source
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const paths = ['oa-admission.mjs', 'oa-oauth-offline.mjs'];
          for (const p of paths) {
            const src = readFileSync('qa/zalo-oa-source-admission/'+p,'utf8');
            for (const rex of [/\bfetch\s*\(/, /\baxios\s*\(/, /\bhttps?\.request\s*\(/,
              /\b(sendMessage|createOrder|executeCommand|exchangeToken|refreshToken)\s*\(/]) {
              if (rex.test(src)) throw Error('Network/order/token side effect forbidden in '+p+' '+rex);
            }
          }
          const code = readFileSync('qa/zalo-oa-source-admission/oa-oauth-offline.mjs','utf8');
          if (!code.includes('noSend: true') || !code.includes('noWrite: true') ||
              !code.includes('canActivate: false')) throw Error('Fail-closed invariant missing');
          NODE

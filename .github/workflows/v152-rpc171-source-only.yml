name: TIEN404 RPC17.1 — Atomic Replay and Scanner Receipt (NO HOSTED WRITES)
on:
  push:
    branches:
      - work/v152-rpc171-durable-replay-scanner-admission-nohost-20261117
  pull_request:
    paths:
      - 'qa/v152-rpc171/**'
      - 'qa/v152-rpc17/**'
      - 'qa/v152-rpc16/**'
      - 'docs/ai-handoff/T404_RPC171_*'
      - '.github/workflows/v152-rpc171-source-only.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RPC17.1 source and negative replay/scanner tests
        run: |
          node --check qa/v152-rpc171/atomic-admission.mjs
          node --test qa/v152-rpc171/atomic-admission.test.mjs
      - name: Inherited RPC17 RPC16 RPC15 RPC14 RPC13 regressions
        run: |
          node --test qa/v152-rpc17/private-admission.test.mjs
          node --test qa/v152-rpc16/inactive-worker.test.mjs
          node --test qa/v152-rpc15/private-r2-quarantine.test.mjs
          node --test qa/v152-rpc14/smoke.test.mjs
          node --test qa/v152-rpc13/secure-identity-and-uat.test.mjs
      - name: Fail closed against any hosted admission
        run: |
          node --input-type=module -e "import {hostedAdmission} from './qa/v152-rpc171/atomic-admission.mjs'; const r=hostedAdmission(); if(r.accepted||r.can_upload||r.can_send||r.can_open_access)process.exit(1)"
          grep -Eq '"workers_dev"[[:space:]]*:[[:space:]]*false' qa/v152-rpc16/wrangler.jsonc
          grep -Eq '"preview_urls"[[:space:]]*:[[:space:]]*false' qa/v152-rpc16/wrangler.jsonc

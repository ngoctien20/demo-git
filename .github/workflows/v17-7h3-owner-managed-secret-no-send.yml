name: V17.7H.3 Bot Owner Cross-Checkpoint × Private Vault Mock UAT NO SEND

on:
  pull_request:
    paths:
      - "qa/v17-7a-oa-independent/**"
      - "docs/ai-handoff/V17_7H3_OWNER_MANAGED_SECRET_INDEPENDENT_ADMISSION_CHECKPOINT.md"
      - ".github/workflows/v17-7h3-owner-managed-secret-no-send.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parallel-owner-evidence-managed-secret-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check inherited V17.7A-H.3
        shell: bash
        run: |
          set -euo pipefail
          for module in qa/v17-7a-oa-independent/*.mjs; do node --check "$module"; done
      - name: Full QA of inherited channels, Store authority, owner and one-event
        shell: bash
        run: |
          set -euo pipefail
          node --test qa/v17-7a-oa-independent/*.test.mjs
      - name: Reconciled owner UI/Mock provenance and private-vault hard NO-GO
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {
            reconcileParallelH2Evidence,canonicalParallelH2Evidence,
            independentOneEventDecision
          } from './qa/v17-7a-oa-independent/v17-7h3-independent-one-event-decision.mjs';
          import {
            describeActualManagedSecretUatPrerequisites,
            recognizedOwnerUiEvidenceSha
          } from './qa/v17-7a-oa-independent/v17-7h3-managed-secret-readback-offline.mjs';
          const root='qa/v17-7a-oa-independent/';
          const source=[
            'v17-7h3-managed-secret-readback-offline.mjs',
            'v17-7h3-independent-one-event-decision.mjs'
          ].map(f=>readFileSync(root+f,'utf8'));
          for(const text of source)for(const bad of [
            /\bfetch\s*\(/,
            /\baxios\s*\./,
            /\bhttps?\s*\.\s*request\s*\(/,
            /\bprocess\s*\.\s*env\b/,
            /\b(sendMessage|setWebhook|deleteWebhook|getUpdates|createOrder|writeOrder|writeStock|deployWorker)\s*\(/
          ])if(bad.test(text))throw Error('Forbidden hosted, provider or Commerce effect');
          const e=JSON.parse(readFileSync(root+'v17-7h3-reconciled-owner-uat-evidence.json','utf8'));
          assert.equal(e.contract,'TIEN404_V17_7H3_PARALLEL_H2_OWNER_MANAGED_SECRET_NO_SEND_DECISION');
          assert.equal(e.baseline.primary_parent_pr,364);
          assert.equal(e.baseline.parallel_owner_image_pr,360);
          assert.equal(e.baseline.parallel_prs_not_merged,true);
          assert.equal(e.screenshot_owner_ui.sha256,recognizedOwnerUiEvidenceSha);
          assert.equal(e.screenshot_owner_ui.image_attests_live_provider_session,false);
          assert.equal(e.screenshot_owner_ui.image_proves_separate_disposable_qa_bot,false);
          assert.equal(e.private_bot_getme.real_managed_secret_vault_connected,false);
          assert.equal(e.private_bot_getme.real_creator_owner_admin_verified,false);
          assert.equal(e.private_bot_getme.actual_bot_token_read,false);
          assert.equal(e.private_bot_getme.real_getMe_called,false);
          assert.equal(e.private_bot_getme.real_getWebhookInfo_called,false);
          assert.equal(e.private_bot_getme.actual_provider_api_calls,0);
          assert.equal(e.private_bot_getme.setWebhook_called,false);
          assert.equal(e.private_bot_getme.sendMessage_called,false);
          assert.equal(e.cloudflare.deployments,0);
          assert.equal(e.cloudflare.workers_dev_enabled,false);
          assert.equal(e.cloudflare.previews_enabled,false);
          assert.equal(e.cloudflare.binding_count,0);
          assert.equal(e.cloudflare.public_route_enabled,false);
          assert.equal(e.cloudflare.worker_modified_this_phase,false);
          assert.equal(e.n8n.independent_manual_qa_inactive,true);
          assert.equal(e.n8n.existing_published_workflow_changed,false);
          assert.equal(e.supabase.qa_same_tenant_store_ab_count,0);
          assert.equal(e.supabase.real_same_tenant_ab_jwt_rls_accepted,false);
          assert.equal(e.one_event_external.real_owner_consent_verified,false);
          assert.equal(e.one_event_external.real_inbound_native_event_received,false);
          assert.equal(e.one_event_external.provider_messages_sent,0);
          assert.equal(e.one_event_external.orders_written,0);
          assert.equal(e.one_event_external.stock_updates,0);
          assert.equal(e.one_event_external.webhook_repointed,false);
          assert.equal(e.one_event_external.public_callback_created,false);
          assert.equal(e.change_scope.cloudflare_mutations,0);
          assert.equal(e.change_scope.n8n_mutations,0);
          assert.equal(e.change_scope.supabase_mutations,0);
          assert.equal(e.change_scope.provider_network_calls,0);
          assert.equal(e.change_scope.real_secrets_read,0);
          assert.equal(e.decision,'REAL_GETME_AND_ONE_EVENT_EXTERNAL_UAT_NO_GO');
          const reconciliation=reconcileParallelH2Evidence(canonicalParallelH2Evidence);
          assert.equal(reconciliation.status,'PRIVATE_EVIDENCE_INTAKE_READY_REAL_UAT_NO_GO');
          assert.equal(reconciliation.realOwnerIndependentlyVerified,false);
          const outcome=independentOneEventDecision({owner:true,realGetMe:true,approved:true});
          assert.equal(outcome.status,'REAL_ONE_EVENT_NO_GO');
          assert.equal(outcome.allowPublicProviderCallback,false);
          assert.equal(outcome.allowSendProviderMessage,false);
          const runner=describeActualManagedSecretUatPrerequisites();
          assert.equal(runner.status,'REAL_GETME_PRIVATE_UAT_NOT_AUTHORIZED');
          assert.equal(runner.realGetMeCalled,false);
          assert.equal(runner.canSetWebhook,false);
          console.log('V17.7H.3: Parallel H2 reconciled / managed secret MOCK only / Real owner+getMe+one-event NO-GO');
          NODE

name: TIEN404 V15.2 CAP.1 Offline Capacity Contract (NO SEND)
on:
  pull_request:
    paths:
      - 'qa/v152-cap1/**'
      - '.github/workflows/v152-cap1-offline-contract-nosend.yml'
      - 'docs/ai-handoff/V15_2_CAP1_*'
  push:
    branches:
      - work/v152-cap1-latency-qa-nosend-20261116
permissions:
  contents: read
jobs:
  cap1-no-send-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated synthetic security and delivery-semantic QA
        run: |
          node --check qa/v152-cap1/capacity-contract.cjs
          node --test qa/v152-cap1/capacity-contract.test.cjs
      - name: Fail if external/paid client or secret is added to CAP.1 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src='\n'.join(p.read_text() for p in Path('qa/v152-cap1').glob('*.cjs'))
          forbidden=['fetch(', 'axios(', 'createClient(', 'process.env.', 'service_role', 'X-Bot-Api-Secret-Token']
          assert all(x not in src for x in forbidden),'Unexpected external/credential path in CAP.1'
          print('PASS: CAP.1 source-only synthetic contract')
          PY

name: "TIEN404 V19.8.5 Protected Catalog Commerce Compatibility QA"

on:
  pull_request:
    paths:
      - "qa/channel-v1985/**"
      - ".github/workflows/tien404-v1985-catalog-compat-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-offline:
    name: "66 synthetic adapter / legacy fail-closed compatibility cases"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute V19.8.5 compatibility contract
        run: node qa/channel-v1985/protected-catalog-compat.test.mjs
      - name: Confirm QA-only no hosted migrations
        run: |
          test -f qa/channel-v1985/README.md
          test ! -e qa/channel-v1985/hosted-migration.sql
          test ! -e qa/channel-v1985/provider-send.mjs

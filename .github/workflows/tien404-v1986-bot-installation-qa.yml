name: "TIEN404 V19.8.6 Zalo Bot Installation Authority Offline QA"

on:
  pull_request:
    paths:
      - "qa/channel-v1986/**"
      - ".github/workflows/tien404-v1986-bot-installation-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-admission:
    name: "82 synthetic admission and owner-consent tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synthetic Bot Store admission assertions
        run: node qa/channel-v1986/installation-authority.test.mjs

  ephemeral-private-registry:
    name: "Postgres 17 / private bot registry / revoke / owner FK"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral_qa_only
          POSTGRES_DB: tien404_v1986_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tien404_v1986_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ephemeral_qa_only
      PGDATABASE: tien404_v1986_ephemeral
    steps:
      - name: Checkout no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Prohibit hosted connections
        run: |
          test "$PGHOST" = "localhost"
          test "$PGDATABASE" = "tien404_v1986_ephemeral"
          test ! -e qa/channel-v1986/hosted-migration.sql
      - name: Create isolated same-tenant Store A B
        run: psql -X -v ON_ERROR_STOP=1 -f qa/channel-v1983/ephemeral-postgres-schema.sql
      - name: Create private Bot installation and consent registry
        run: psql -X -v ON_ERROR_STOP=1 -f qa/channel-v1986/ephemeral-installation-schema.sql
      - name: PostgreSQL private registry owner and revocation UAT
        run: psql -X -v ON_ERROR_STOP=1 -f qa/channel-v1986/ephemeral-installation-acceptance.sql

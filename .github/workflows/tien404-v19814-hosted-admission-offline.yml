name: "TIEN404 V19.8.14 Trusted Installation Hosted Admission Contract"
on:
  pull_request:
    paths:
      - "qa/channel-v19814/**"
      - ".github/workflows/tien404-v19814-hosted-admission-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard tests, no provider or hosted calls
        run: node --test qa/channel-v19814/hosted-admission.test.mjs
      - name: Assert no credential-based execution
        run: |
          test -z "${ZALO_BOT_TOKEN:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test ! -e qa/channel-v19814/.env
          echo "HOSTED_ADMISSION=NO_GO PROVIDER_SEND=0 ORDER_WRITE=0"

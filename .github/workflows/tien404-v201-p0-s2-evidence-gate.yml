name: TIEN404 V20.1 P0 S2 Evidence Gate Offline
on:
  pull_request:
    paths:
      - "qa/v201-p0-s2/**"
      - ".github/workflows/tien404-v201-p0-s2-evidence-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reject hosted/provider environment secrets
        run: |
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${ZALO_BOT_TOKEN:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${RENDER_API_KEY:-}"
      - name: Synthetic evidence-only gate QA
        run: node --test qa/v201-p0-s2/evidence-review.test.mjs

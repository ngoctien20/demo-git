name: TIEN404 V20.1 P0 S1 QR Admission Offline Contract
on:
  pull_request:
    paths:
      - 'qa/v201-p0-s1/**'
      - '.github/workflows/tien404-v201-p0-s1-qr-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-no-send-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No live provider, hosted database, or secret bindings
        run: |
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${ZALO_BOT_TOKEN:-}"
      - name: Run isolated QR admission contract suite
        run: node --test qa/v201-p0-s1/qr-admission-offline.test.mjs

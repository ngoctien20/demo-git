name: TIEN404 SALES LITE V1.3 secure integration no-send QA
on:
  push:
    branches:
      - work/v133-sales-lite-secure-integration-staging
    paths:
      - "qa/sales-lite/v131/**"
      - "qa/sales-lite/v132/**"
      - "qa/sales-lite/v133/**"
      - ".github/workflows/v133-sales-lite-secure-qa.yml"
  pull_request:
    paths:
      - "qa/sales-lite/v133/**"
      - ".github/workflows/v133-sales-lite-secure-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v133-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check qa/sales-lite/v133/merchant-readonly.cjs
          node --check qa/sales-lite/v133/menu-drafts.cjs
          node --check qa/sales-lite/v133/menu-core-bridge.cjs
          node --check qa/sales-lite/v133/rich-text.cjs
      - name: V13.3 contracts + negative tests
        run: node --test qa/sales-lite/v133/*.test.cjs
      - name: V13.2 UI source regression
        run: node --test qa/sales-lite/v132/v132-ui.test.cjs
      - name: V13.1 menu and business regression
        run: node --test qa/sales-lite/v131/*.test.cjs

  v133-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Chromium Playwright (ephemeral)
        run: |
          cd qa/sales-lite/v133
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Browser UI read-only and draft QA
        run: |
          python -m http.server 8080 > /tmp/tien404-v133-http.log 2>&1 &
          sleep 2
          node qa/sales-lite/v133/v133-browser-qa.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v133-browser-screenshots
          path: qa-artifacts-v133/
          if-no-files-found: ignore

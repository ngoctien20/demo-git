name: "TIEN404 V19.8.15 Local Registry PostgreSQL JWT Catalog UAT"
on:
  pull_request:
    paths:
      - "qa/channel-v19815/**"
      - ".github/workflows/tien404-v19815-local-registry-uat.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-real-jwt-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      SUPABASE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: "3.2.0"
      - name: Reject hosted credentials and project links
        run: |
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${T404_UAT_PROJECT_REF:-}"
          test ! -e qa/channel-v1989/supabase/.temp/project-ref
      - name: Init detached disposable Supabase with PostgreSQL 17
        working-directory: qa/channel-v1989
        run: |
          supabase init
          sed -i -E 's/^enable_confirmations = true/enable_confirmations = false/' supabase/config.toml
          sed -i -E 's/^major_version = [0-9]+/major_version = 17/' supabase/config.toml
          test ! -f supabase/.temp/project-ref
      - name: Start local Auth, PostgREST and PostgreSQL
        working-directory: qa/channel-v1989
        run: |
          if ! supabase start --exclude studio,realtime,storage,functions,mail,analytics,pooler > /tmp/t404_v19815_start.log 2>&1; then
            echo 'LOCAL_STACK_START_FAILED_NO_HOSTED_FALLBACK'
            exit 1
          fi
      - name: Install PostgreSQL CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply only synthetic fixtures in dependency order
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "54322"
          PGUSER: "postgres"
          PGPASSWORD: "postgres"
          PGDATABASE: "postgres"
        run: |
          test "$PGHOST" = "127.0.0.1" && test "$PGPORT" = "54322"
          psql -X -v ON_ERROR_STOP=1 -q -f qa/channel-v1989/docker-uat-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -q -f qa/channel-v19810/local-installation-authority.sql
          psql -X -v ON_ERROR_STOP=1 -q -f qa/channel-v19812/local-one-time-owner-challenge.sql
          psql -X -v ON_ERROR_STOP=1 -q -f qa/channel-v19815/local-private-registry.sql
          echo 'ISOLATED_SYNTHETIC_SCHEMA_READY'
      - name: Real local GoTrue JWT + private registry + protected catalog RLS UAT
        working-directory: qa/channel-v1989
        env:
          T404_V19815_DOCKER_ONLY: "TRUE_EPHEMERAL"
        run: node ../channel-v19815/local-real-owner-registry-uat.mjs
      - name: Ensure no hosted migration or real provider activity
        if: always()
        run: |
          test ! -e qa/channel-v19815/.env
          test ! -e qa/channel-v19815/hosted-migration.sql
          echo 'REAL_ZALO_ATTESTATION=NOT_RUN PROVIDER_SEND=0 ORDER_WRITE=0 HOSTED_ADMISSION=NO_GO'
      - name: Dispose ephemeral stack
        if: always()
        working-directory: qa/channel-v1989
        run: supabase stop --no-backup >/dev/null 2>&1 || true

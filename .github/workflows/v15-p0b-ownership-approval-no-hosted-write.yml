name: TIEN404 V15 P0-B Private Ownership & Migration Approval Gate (NO HOSTED WRITE)

on:
  push:
    branches:
      - work/v15-sales-lite-p0b-owner-evidence-migration-approval-nosend-20261116
  pull_request:
    paths:
      - 'qa/v15-sales-lite-p0b/**'
      - 'docs/ai-handoff/V15_P0B_*'
      - '.github/workflows/v15-p0b-ownership-approval-no-hosted-write.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-evidence-source-gate:
    name: Private Ownership Evidence Index & Read-Only SQL Safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of evidence gate
        run: |
          node --check qa/v15-sales-lite-p0b/ownership-evidence-gate.cjs
          node --check qa/v15-sales-lite-p0b/ownership-evidence-gate.test.cjs
      - name: 16 evidence policy negative tests plus preflight static tests
        run: node --test qa/v15-sales-lite-p0b/*.test.cjs
      - name: Verify no hosted changes or real communication code
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/v15-sales-lite-p0b/ownership-evidence-gate.cjs').read_text()
          for s in ('fetch(', 'new OpenAI(', 'axios(', 'process.env.', 'sendMessage(', 'supabase.', 'INSERT INTO', 'UPDATE public.', 'DELETE FROM', 'ZALO_BOT_TOKEN'):
              assert s not in p, s
          assert 'can_apply_migration:false' in p
          assert 'can_send_provider:false' in p
          assert 'approved_migration:false' in p
          print('PASS: P0-B is evidence-index-only, not a release token')
          PY
      - name: Retain P0-A no-release and Commerce preview negative regression
        run: |
          node --test qa/v15-sales-lite-pilot/pilot-release-gate.test.cjs
          node --test qa/v15-sales-lite-p0/commerce-preview-bridge.test.cjs
          node --test qa/v1509-hosted-store/store-security-contract.test.cjs qa/v1509-hosted-store/sql-review-contract.test.cjs

  disposable-pg17-regression:
    name: Recheck earlier Synthetic Store A/B/C Isolation on Disposable PG17
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qa_synthetic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Replay inherited synthetic cross-store and atomic Order Outbox QA
        env:
          PGPASSWORD: synthetic_ci_only_not_a_secret
        run: |
          psql -h 127.0.0.1 -U postgres -d qa_synthetic -X -v ON_ERROR_STOP=1 -f qa/v15-sales-lite-p0/pg17-store-rls-isolation.sql
      - name: Confirm disposable-only and no Supabase project ref in SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('qa/v15-sales-lite-p0/pg17-store-rls-isolation.sql').read_text()
          assert 'CREATE SCHEMA qa_p0' in s
          assert 'ifxlvrhyjhbzbrkdsida' not in s
          assert 'PASS_DISPOSABLE_POSTGRES17_RLS_ISOLATION_NOT_HOSTED' in s
          print('PASS synthetic PG17 fixtures only; no hosted changes')
          PY

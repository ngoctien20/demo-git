name: TIEN404 V23 web + owner App QA
on:
  pull_request:
    paths: ['site-src/**', 'assets/site*', '*.html', 'apps/owner/**', 'app/**', 'db/v23-web/**', 'qa/v23-web/**', 'scripts/**', 'tests/**', '_redirects', '.github/workflows/v23-web-qa.yml']
  push:
    branches: [claude/project-thread-4ko028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Owner App typecheck + build (must match committed app/)
        working-directory: apps/owner
        run: npm ci --no-audit --no-fund && npm run build && git diff --stat --exit-code -- ../../app
      - name: Public site in sync, static QA, navigation, contract
        run: |
          node scripts/build-site.mjs && git diff --exit-code -- '*.html' sitemap.xml
          python3 qa_static.py
          node scripts/check-site-navigation.mjs
          python3 -m unittest discover -s tests -p 'test_v23_*.py' -v
      - name: Browser QA (desktop 1280 + mobile 390, mocked Supabase)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          mkdir -p shots
          node qa/v23-web/screens.cjs shots index.html solutions.html pricing.html demo.html contact.html about.html faq.html terms.html privacy.html refund.html 404.html
          node qa/v23-web/app-ui.cjs shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: v23-screens, path: shots, retention-days: 14 }
  db-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Offline UAT of db/v23-web on disposable PG17 (no hosted access)
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: bash qa/v23-web/offline-pg-uat.sh

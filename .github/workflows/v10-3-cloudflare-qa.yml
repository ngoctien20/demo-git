name: TIEN404 V10.3 safe Cloudflare preview and widget QA
on:
  push:
    branches:
      - feature/v10.3-cloudflare-widget-qa-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and source guardrails
        run: |
          node --check assets/ai-consultant.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('assets/ai-consultant.js').read_text()
          css=Path('assets/live-chat.css').read_text()
          headers=Path('_headers').read_text()
          assert 'tien404-chat-panel' in js and 'aria-busy' in js
          assert 'V10.3 — TIEN404 design-system pass' in css
          assert 'X-Robots-Tag: noindex, nofollow' in headers
          assert 'n8n.cloud/webhook/' in js
          assert 'service_role' not in js.lower()
          print('V10.3 syntax/SEO/transport guardrails PASS')
          PY
      - name: Install Chromium QA
        run: |
          npm install --no-save @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local staging replica
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tien404-v103.log 2>&1 &
          sleep 2
      - name: Run V10.3 local and remote parity QA
        run: npx playwright test -c qa/playwright.config.cjs qa/v10-3-cloudflare.spec.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-3-cloudflare-widget-qa
          path: |
            qa-results/
            test-results/
          if-no-files-found: warn
          retention-days: 14

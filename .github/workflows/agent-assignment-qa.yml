name: Tenant agent assignment isolation
on:
  pull_request:
    paths: ['ops/data-platform/candidates/tenant_agent_configs.sql', 'ops/data-platform/qa/tenant_agents.sql', '.github/workflows/agent-assignment-qa.yml']
  push:
    branches: ['work/v9-tenant-agent-preview']
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tien404_qa
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 4s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: tien404_qa
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap disposable database and run tenant policy tests
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub',true),'')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          SQL
          psql -v ON_ERROR_STOP=1 -f ops/data-platform/schema.staging.sql
          psql -1 -v ON_ERROR_STOP=1 -f ops/data-platform/candidates/tenant_agent_configs.sql
          psql -v ON_ERROR_STOP=1 -f ops/data-platform/qa/tenant_agents.sql

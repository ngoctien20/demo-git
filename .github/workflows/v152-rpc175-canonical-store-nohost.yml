name: TIEN404 RPC17.5 — Canonical Store Authority Contract (NO HOST)
on:
  push:
    branches:
      - work/v152-rpc175-canonical-store-authority-nohost-20261117
  pull_request:
    paths:
      - 'qa/v152-rpc175/**'
      - 'docs/ai-handoff/T404_RPC175_*'
      - '.github/workflows/v152-rpc175-canonical-store-nohost.yml'
permissions:
  contents: read
jobs:
  canonical-store-no-send:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical Store authority source-only regression
        run: |
          node --check qa/v152-rpc175/canonical-store-authority.mjs
          node --test qa/v152-rpc175/canonical-store-authority.test.mjs
      - name: Inherited RPC17.4–RPC13 security regressions
        run: |
          node --test qa/v152-rpc174/real-store-ab-readiness.test.mjs
          node --test qa/v152-rpc173/operator-authority.test.mjs
          node --test qa/v152-rpc173/hosted-change-gate.test.mjs
          node --test qa/v152-rpc172/scanner-bridge.test.mjs
          node --test qa/v152-rpc172/independent-hosted-gate.test.mjs
          node --test qa/v152-rpc171/atomic-admission.test.mjs
          node --test qa/v152-rpc17/private-admission.test.mjs
          node --test qa/v152-rpc16/inactive-worker.test.mjs
          node --test qa/v152-rpc15/private-r2-quarantine.test.mjs
          node --test qa/v152-rpc14/smoke.test.mjs
          node --test qa/v152-rpc13/secure-identity-and-uat.test.mjs
      - name: Hard NO HOST and no DDL execution
        run: |
          node --input-type=module -e "import {publicAdmission} from './qa/v152-rpc175/canonical-store-authority.mjs'; const x=publicAdmission();if(x.eligible||x.can_read||x.can_write||x.can_upload||x.can_send||x.can_deploy)process.exit(1)"
          grep -Eq '"workers_dev"[[:space:]]*:[[:space:]]*false' qa/v152-rpc16/wrangler.jsonc
          grep -Eq '"preview_urls"[[:space:]]*:[[:space:]]*false' qa/v152-rpc16/wrangler.jsonc

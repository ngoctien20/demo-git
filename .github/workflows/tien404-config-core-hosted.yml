name: "TIEN404 Config Core v1 — apply restore-test, then backup + apply staging"
# Owner-approved 2026-11-22 06:58 UTC ("Được nếu phù hợp hãy làm tiếp", thread Phase 0–1).
# restore-test: apply 10 -> hosted UAT (rolled back) -> rollback 90 (fingerprint = pre) -> re-apply 10.
# staging (only if restore-test passed): guard -> encrypted backup artifact -> apply 10 -> hosted UAT
# (rolled back) -> on any failure automatic rollback 90 with fingerprint check.
# Purely additive: new tables/functions only; no existing object is altered. No n8n, no provider sends.
# Logs print tags and hashes only (this repository is public).
on:
  push:
    branches: [claude/project-thread-xv1r63]
    paths:
      - .github/workflows/tien404-config-core-hosted.yml
permissions:
  contents: read
concurrency:
  group: supabase-backup
  cancel-in-progress: false
env:
  RESTORE_REF: cunxxzxaboazbszsfneo
  STAGING_REF: ifxlvrhyjhbzbrkdsida
jobs:
  restore-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build restore-test connection (masked)
        env:
          RESTORE_DB_PASSWORD: ${{ secrets.RESTORE_DB_PASSWORD }}
        run: |
          [ -n "$RESTORE_DB_PASSWORD" ] || { echo "::error::missing RESTORE_DB_PASSWORD"; exit 1; }
          echo "::add-mask::$RESTORE_DB_PASSWORD"
          url=$(python3 -c 'import os,urllib.parse as u;print("postgresql://postgres.%s:%s@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"%(os.environ["RESTORE_REF"],u.quote(os.environ["RESTORE_DB_PASSWORD"],safe="")))')
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Guard (restore-test marker, config core not yet applied)
        run: |
          [ "$(psql "$DB_URL" -X -At -c "select to_regclass('restore_test_guard.marker') is not null" 2>/dev/null)" = t ] || { echo "::error::not restore-test"; exit 1; }
          st=$(psql "$DB_URL" -X -At -c "select (to_regclass('public.assistants') is null)::text" 2>/dev/null)
          echo "NOT_APPLIED=$st"; echo "NOT_APPLIED=$st" >> "$GITHUB_ENV"
      - name: Fingerprint before
        run: |
          fp=$(psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1)
          [ -n "$fp" ] || exit 1; echo "PRE_FP=$fp" | tee -a "$GITHUB_ENV"
          [ "$NOT_APPLIED" = true ] || echo "(already applied: PRE_FP is the post state)"
      - name: Apply 10
        if: env.NOT_APPLIED == 'true'
        run: |
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f db/config-core/10_config_core.sql > out.txt 2>&1 \
            || { grep -o 'T404_[A-Z0-9_]*' out.txt | head -1; rm -f out.txt; echo "::error::apply failed (rolled back)"; exit 1; }
          grep -o 'T404_CC_CONFIG_CORE_OK' out.txt || { rm -f out.txt; exit 1; }; rm -f out.txt
          fp=$(psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1)
          echo "POST_FP=$fp" | tee -a "$GITHUB_ENV"
      - name: Hosted UAT (all rows rolled back)
        run: |
          psql "$DB_URL" -X -q -f qa/config-core/hosted/hosted-uat.sql > out.txt 2>&1 || true
          r=$(grep -o 'T404_CC_HOSTED_[A-Z_]*\( pass=[0-9]* fail=\[[A-Z0-9_ ]*\]\)\?' out.txt | head -1); rm -f out.txt
          echo "$r"; [ "$r" = "T404_CC_HOSTED_UAT pass=21 fail=[]" ] || { echo "::error::hosted UAT failed"; exit 1; }
      - name: Rollback 90 -> fingerprint must equal pre -> re-apply 10
        if: env.NOT_APPLIED == 'true'
        run: |
          run(){ psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$1" > out.txt 2>&1 || { grep -o 'T404_[A-Z0-9_]*' out.txt | head -1; rm -f out.txt; echo "::error::$1 failed"; exit 1; }; grep -o "$2" out.txt; rm -f out.txt; }
          fp(){ psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1; }
          run db/config-core/90_config_core_rollback.sql T404_CC_ROLLBACK_OK
          [ "$(fp)" = "$PRE_FP" ] && echo PASS_HOSTED_ROLLBACK_FP_EQUALS_PRE || { echo "::error::rollback fp mismatch"; exit 1; }
          n=$(psql "$DB_URL" -X -At -c "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='app_private' and p.proname like 't404_cfg%'" 2>/dev/null)
          [ "$n" = 0 ] && echo PASS_HOSTED_ROLLBACK_NO_PRIVATE_FUNCS || { echo "::error::leftover funcs"; exit 1; }
          run db/config-core/10_config_core.sql T404_CC_CONFIG_CORE_OK
          [ "$(fp)" = "$POST_FP" ] && echo PASS_HOSTED_REAPPLY_FP_EQUALS_POST || { echo "::error::reapply fp mismatch"; exit 1; }
      - name: Side effects
        if: always()
        run: echo "TARGET=restore-test FINAL=config-core-applied STAGING_TOUCHED=0 N8N=0 PROVIDER_SENDS=0"

  staging:
    needs: restore-test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build staging connection (masked)
        env:
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$STAGING_DB_PASSWORD" ] || { echo "::error::missing STAGING_DB_PASSWORD"; exit 1; }
          [ "${#BACKUP_PASSPHRASE}" -ge 20 ] || { echo "::error::missing BACKUP_PASSPHRASE"; exit 1; }
          echo "::add-mask::$STAGING_DB_PASSWORD"
          url=$(python3 -c 'import os,urllib.parse as u;print("postgresql://postgres.%s:%s@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"%(os.environ["STAGING_REF"],u.quote(os.environ["STAGING_DB_PASSWORD"],safe="")))')
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Login + guard (staging, config core not yet applied)
        run: |
          psql "$DB_URL" -X -At -c 'select 1' > /dev/null 2>&1 || { echo "::error::login failed"; exit 1; }
          [ "$(psql "$DB_URL" -X -At -c "select to_regclass('restore_test_guard.marker') is null" 2>/dev/null)" = t ] || { echo "::error::this is not staging"; exit 1; }
          st=$(psql "$DB_URL" -X -At -c "select (to_regclass('public.assistants') is null)::text" 2>/dev/null)
          echo "NOT_APPLIED=$st"; echo "NOT_APPLIED=$st" >> "$GITHUB_ENV"
          fp=$(psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1)
          echo "PRE_FP=$fp" | tee -a "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        if: env.NOT_APPLIED == 'true'
        with:
          version: latest
      - name: Backup staging immediately before apply (encrypted)
        if: env.NOT_APPLIED == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          mkdir -p backup
          supabase db dump --db-url "$DB_URL" -f backup/roles.sql --role-only > /dev/null 2>&1 || { echo "::error::roles dump failed"; exit 1; }
          supabase db dump --db-url "$DB_URL" -f backup/schema.sql > /dev/null 2>&1 || { echo "::error::schema dump failed"; exit 1; }
          supabase db dump --db-url "$DB_URL" -f backup/data.sql --use-copy --data-only > /dev/null 2>&1 || { echo "::error::data dump failed"; exit 1; }
          for f in backup/*.sql; do echo "$(basename $f) $(wc -c < $f) bytes"; done
          [ "$(wc -c < backup/schema.sql)" -gt 10000 ] || { echo "::error::schema dump too small"; exit 1; }
          stamp=$(date -u +%Y-%m-%dT%H%MZ); echo "STAMP=$stamp" >> "$GITHUB_ENV"
          tar -czf - backup | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            -o "tien404-staging-pre-config-core-$stamp.tar.gz.gpg" 3<<<"$BACKUP_PASSPHRASE"
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 -d "tien404-staging-pre-config-core-$stamp.tar.gz.gpg" 3<<<"$BACKUP_PASSPHRASE" 2>/dev/null | tar -tzf - > /dev/null || { echo "::error::backup does not decrypt"; exit 1; }
          sha256sum "tien404-staging-pre-config-core-$stamp.tar.gz.gpg" | tee "tien404-staging-pre-config-core-$stamp.sha256"
          rm -rf backup
          echo "BACKUP_OK"
      - uses: actions/upload-artifact@v4
        if: env.NOT_APPLIED == 'true'
        with:
          name: tien404-staging-pre-config-core-${{ env.STAMP }}
          path: |
            tien404-staging-pre-config-core-*.tar.gz.gpg
            tien404-staging-pre-config-core-*.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Apply 10
        if: env.NOT_APPLIED == 'true'
        run: |
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f db/config-core/10_config_core.sql > out.txt 2>&1 \
            || { grep -o 'T404_[A-Z0-9_]*' out.txt | head -1; rm -f out.txt; echo "::error::apply failed (rolled back)"; exit 1; }
          grep -o 'T404_CC_CONFIG_CORE_OK' out.txt || { rm -f out.txt; exit 1; }; rm -f out.txt
          echo "APPLIED=1" >> "$GITHUB_ENV"
          fp=$(psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1)
          echo "POST_FP=$fp"
      - name: Hosted UAT (all rows rolled back)
        run: |
          psql "$DB_URL" -X -q -f qa/config-core/hosted/hosted-uat.sql > out.txt 2>&1 || true
          r=$(grep -o 'T404_CC_HOSTED_[A-Z_]*\( pass=[0-9]* fail=\[[A-Z0-9_ ]*\]\)\?' out.txt | head -1); rm -f out.txt
          echo "$r"; [ "$r" = "T404_CC_HOSTED_UAT pass=21 fail=[]" ] || { echo "::error::hosted UAT failed"; exit 1; }
          n=$(psql "$DB_URL" -X -At -c "select (select count(*) from public.assistants)||':'||(select count(*) from public.channel_connections)" 2>/dev/null)
          [ "$n" = "0:0" ] && echo PASS_NO_UAT_ROWS_LEFT || { echo "::error::rows left $n"; exit 1; }
      - name: Automatic rollback on failure (90, fingerprint check)
        if: failure() && env.APPLIED == '1'
        run: |
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f db/config-core/90_config_core_rollback.sql > /dev/null 2>&1 || { echo "::error::rollback failed, restore from backup artifact"; exit 1; }
          fp=$(psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1)
          [ "$fp" = "$PRE_FP" ] && echo "ROLLED_BACK_TO_PRE" || echo "::error::rollback fingerprint mismatch, restore from backup artifact"
      - name: Side effects
        if: always()
        run: echo "TARGET=staging APPLIED=${APPLIED:-0} N8N=0 PROVIDER_SENDS=0 AUTH_USERS_LEFT=0"

name: TIEN404 independent full-browser QA
on:
  push:
    branches: [qa/tien404-full-audit-20261109]
    paths:
      - 'qa/**'
      - '.github/workflows/full-browser-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA tools
        run: |
          npm install --no-save @playwright/test@1.58.2 @axe-core/playwright@4.11.0
          npx playwright install --with-deps chromium
      - name: Start local GitHub Pages replica
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tien404-http.log 2>&1 &
          sleep 2
      - name: Run independent desktop, mobile, workflow and accessibility audit
        run: npx playwright test -c qa/playwright.config.cjs
      - name: Locate browser report files
        if: always()
        run: find . -maxdepth 5 -type f \( -name 'results.json' -o -name 'index.html' \) | grep -E '(qa-results|test-results)' | head -n 30 || true
      - name: Upload full HTML and JSON QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TIEN404-browser-audit-evidence
          path: |
            qa-results/
            qa/qa-results/
            test-results/
            qa/test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

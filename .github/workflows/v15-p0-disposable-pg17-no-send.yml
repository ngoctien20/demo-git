name: TIEN404 V15 Sales Lite P0 Disposable PG17 Store RLS QA (NO SEND)

on:
  push:
    branches:
      - work/v15-sales-lite-p0-store-ownership-commerce-nosend-20261116
  pull_request:
    paths:
      - 'qa/v15-sales-lite-p0/**'
      - 'docs/ai-handoff/V15_P0_*'
      - '.github/workflows/v15-p0-disposable-pg17-no-send.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg17-isolation:
    name: PostgreSQL17 four-row ownership and per-Store RLS (DISPOSABLE ONLY)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qa_p0_synthetic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_p0_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Execute disposable PG17 same-Tenant and cross-Tenant RLS QA
        env:
          PGPASSWORD: synthetic_ci_only_not_a_secret
        run: |
          psql -h 127.0.0.1 -U postgres -d qa_p0_synthetic -X -v ON_ERROR_STOP=1 \
            -f qa/v15-sales-lite-p0/pg17-store-rls-isolation.sql
      - name: No hosted configuration or unsafe writes in test artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/v15-sales-lite-p0/pg17-store-rls-isolation.sql').read_text()
          assert "CREATE SCHEMA qa_p0;" in p
          assert 'CREATE SCHEMA auth;' in p
          assert 'PASS_DISPOSABLE_POSTGRES17_RLS_ISOLATION_NOT_HOSTED' in p
          assert 'ifxlvrhyjhbzbrkdsida' not in p
          assert 'service_role' not in p
          print('PASS: isolated PG17 fixture, no Supabase-hosted connection')
          PY
  pilot-contract:
    name: V15 Pilot Feature and Manual Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test qa/v15-sales-lite-pilot/pilot-release-gate.test.cjs
      - name: Signed QA Commerce read/quote/order request preview
        run: node --test qa/v15-sales-lite-p0/commerce-preview-bridge.test.cjs
      - name: Commerce bridge has no provider/hosted writer dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/v15-sales-lite-p0/commerce-preview-bridge.cjs').read_text()
          for marker in ('fetch(', 'axios(', 'new OpenAI(', 'process.env', 'INSERT INTO', 'supabase.from(', 'sendMessage('):
              assert marker not in p, marker
          assert 'isAcceptedSyntheticContext' in p
          assert 'authorizeQaBusinessTool' in p
          print('PASS synthetic Commerce integration seam: no external send/write')
          PY
      - run: node --test qa/v1509-hosted-store/store-security-contract.test.cjs qa/v1509-hosted-store/sql-review-contract.test.cjs

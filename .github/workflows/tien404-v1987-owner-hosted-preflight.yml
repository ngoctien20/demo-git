name: "TIEN404 V19.8.7 Real Owner Hosted UAT Preflight — NO GO"

on:
  pull_request:
    paths:
      - "qa/channel-v1987/**"
      - ".github/workflows/tien404-v1987-owner-hosted-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-no-go-check:
    name: "Read-only evidence / NO-GO expected / never tests real JWT"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run fail-closed hosted admission metadata QA
        run: node qa/channel-v1987/hosted-uat-admission-gate.test.mjs
      - name: Verify redacted read-only evidence is not a hosted approval
        shell: bash
        run: |
          test -f qa/channel-v1987/READONLY_PREFLIGHT_EVIDENCE_20261119.json
          test ! -e qa/channel-v1987/hosted-migration.sql
          node --input-type=module -e "import fs from 'node:fs'; const e=JSON.parse(fs.readFileSync('qa/channel-v1987/READONLY_PREFLIGHT_EVIDENCE_20261119.json')); if(e.liveUserJwtVerified!==false || e.containsSecrets!==false || e.containsPII!==false || e.storeAuthority.sameTenantTwoStoreFixturePresent!==false || e.storeAuthority.storeScopedRlsHostedVerified!==false) process.exit(1); console.log('NO_LIVE_JWT_OR_HOSTED_STORE_GRANT');"

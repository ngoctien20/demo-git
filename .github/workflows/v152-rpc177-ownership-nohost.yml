name: TIEN404 RPC17.7 — Independent Merchant Proof × Private Real Auth A/B NO-GO
on:
  push:
    branches:
      - work/v152-rpc177-private-owner-proof-auth-uat-nohost-20261117
  pull_request:
    paths:
      - 'qa/v152-rpc177/**'
      - 'docs/ai-handoff/T404_RPC177_*'
      - '.github/workflows/v152-rpc177-ownership-nohost.yml'
permissions:
  contents: read
jobs:
  rpc177-independent-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent owner/security/finance proof and real Auth A/B negative QA
        run: |
          node --check qa/v152-rpc177/private-ownership-proof.mjs
          node --check qa/v152-rpc177/real-auth-ab-uat-gate.mjs
          node --test qa/v152-rpc177/private-ownership-proof.test.mjs
          node --test qa/v152-rpc177/real-auth-ab-uat-gate.test.mjs
      - name: Inherited RPC17.6 through RPC13 source regressions
        run: |
          node --test qa/v152-rpc176/private-auth-admission.test.mjs
          node --test qa/v152-rpc175/canonical-store-authority.test.mjs
          node --test qa/v152-rpc174/real-store-ab-readiness.test.mjs
          node --test qa/v152-rpc173/operator-authority.test.mjs
          node --test qa/v152-rpc173/hosted-change-gate.test.mjs
          node --test qa/v152-rpc172/scanner-bridge.test.mjs
          node --test qa/v152-rpc172/independent-hosted-gate.test.mjs
          node --test qa/v152-rpc171/atomic-admission.test.mjs
          node --test qa/v152-rpc17/private-admission.test.mjs
          node --test qa/v152-rpc16/inactive-worker.test.mjs
          node --test qa/v152-rpc15/private-r2-quarantine.test.mjs
          node --test qa/v152-rpc14/smoke.test.mjs
          node --test qa/v152-rpc13/secure-identity-and-uat.test.mjs
      - name: Preserve public endpoint deny and absent migration rights
        run: |
          node --input-type=module -e "import {realHostedDecision} from './qa/v152-rpc177/private-ownership-proof.mjs';import {realSupabaseMigrationDecision} from './qa/v152-rpc177/real-auth-ab-uat-gate.mjs';const a=realHostedDecision(),b=realSupabaseMigrationDecision();if(a.accepted||a.can_migrate||a.can_upload||a.can_send||b.can_migrate||b.can_send)process.exit(1)"
          grep -Eq '"workers_dev"[[:space:]]*:[[:space:]]*false' qa/v152-rpc16/wrangler.jsonc
          grep -Eq '"preview_urls"[[:space:]]*:[[:space:]]*false' qa/v152-rpc16/wrangler.jsonc

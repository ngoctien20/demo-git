name: "TIEN404 V19.8.18 Migrated Store RLS Real Local Auth JWT UAT"
on:
  pull_request:
    paths:
      - "qa/channel-v19818/**"
      - ".github/workflows/tien404-v19818-migrated-store-jwt-rls.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-real-auth-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      SUPABASE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: "3.2.0"
      - name: Refuse hosted credentials and linked project
        run: |
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${T404_UAT_PROJECT_REF:-}"
          test -z "${ZALO_BOT_TOKEN:-}"
          test ! -e qa/channel-v19818/.env
          test ! -e qa/channel-v1989/supabase/.temp/project-ref
      - name: Initialize disconnected local Auth DB stack PG17
        working-directory: qa/channel-v1989
        run: |
          supabase init
          sed -i -E 's/^enable_confirmations = true/enable_confirmations = false/' supabase/config.toml
          sed -i -E 's/^major_version = [0-9]+/major_version = 17/' supabase/config.toml
          test ! -f supabase/.temp/project-ref
      - name: Start local Supabase Auth/PostgREST/PostgreSQL
        working-directory: qa/channel-v1989
        run: |
          if ! supabase start --exclude studio,realtime,storage,functions,mail,analytics,pooler > /tmp/t404_v19818_local_start.log 2>&1; then
            echo 'DISPOSABLE_SUPABASE_START_FAILED_NO_HOSTED_FALLBACK'
            exit 1
          fi
      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Execute V19.8.17 migrated schema and V19.8.18 RLS in local PG17 ONLY
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "54322"
          PGUSER: "postgres"
          PGPASSWORD: "postgres"
          PGDATABASE: "postgres"
        run: |
          test "$PGHOST" = "127.0.0.1" && test "$PGPORT" = "54322"
          test "$(psql -X -Atqc "select current_setting('server_version_num')::integer >= 170000")" = "t"
          psql -X -v ON_ERROR_STOP=1 -q -f qa/channel-v19817/disposable-pg17-store-migration-drill.sql
          psql -X -v ON_ERROR_STOP=1 -q -f qa/channel-v19818/local-migrated-store-rls.sql
          echo 'PG17_MIGRATION_AND_RLS_APPLIED_TO_DISPOSABLE_ONLY'
      - name: Real local Auth-issued JWT Owner A/B UAT on migrated six tables
        working-directory: qa/channel-v1989
        env:
          T404_V19818_LOCAL_ONLY: "DISPOSABLE_PG17_GOTRUE"
        run: node ../channel-v19818/local-migrated-jwt-rls-uat.mjs
      - name: Validate no migration or provider side effects
        if: always()
        run: |
          test ! -e qa/channel-v19818/hosted-migration.sql
          test ! -e qa/channel-v19818/.env
          echo 'HOSTED_MIGRATIONS=0 LIVE_WRITER_EDITS=0 PROVIDER_SEND=0 PROD_ORDER_WRITES=0'
      - name: Dispose local Supabase stack
        if: always()
        working-directory: qa/channel-v1989
        run: supabase stop --no-backup >/dev/null 2>&1 || true

name: TIEN404 Zalo Hub (OFFLINE, NO SEND)
on:
  pull_request:
    paths:
      - 'gateway/zalo-hub/**'
      - '.github/workflows/zalo-hub-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check gateway/zalo-hub/src/worker.mjs
          node --check gateway/zalo-hub/src/crypto.mjs
          node --check gateway/zalo-hub/src/zalo-api.mjs
          node --check gateway/zalo-hub/src/store.mjs
          node --check gateway/zalo-hub/src/lite-commerce.mjs
          node --check gateway/zalo-hub/src/lite-intent.mjs
          node --check gateway/zalo-hub/qa/runtime-check.mjs
          node --check gateway/zalo-hub/tools/run-hosted-qa.mjs
          node --check gateway/zalo-hub/pilot/worker.mjs
          node --check gateway/zalo-hub/pilot/router.mjs
          node --check gateway/zalo-hub/tools/connect-qa.mjs
          node --check gateway/zalo-hub/tools/rotate-qa.mjs
      - name: Offline tests (fake Zalo, real migration SQL via node:sqlite)
        run: node --test gateway/zalo-hub/test/*.test.mjs
      - name: No real wrangler.toml committed
        run: test ! -f gateway/zalo-hub/wrangler.toml

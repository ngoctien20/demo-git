name: "TIEN404 V19.8.19 Cross-Platform Backup Owner Admission Offline Gate"
on:
  pull_request:
    paths:
      - "qa/channel-v19819/**"
      - ".github/workflows/tien404-v19819-evidence-nohost.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test evidence shape and deterministic deny guards
        run: node --test qa/channel-v19819/hosted-evidence-preflight.test.mjs
      - name: Verify hosted gate remains NO_GO and no live credentials are provided
        env:
          T404_V19819_MODE: "OFFLINE_AUDIT_ONLY"
        run: |
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${ZALO_BOT_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${RENDER_API_KEY:-}"
          test ! -e qa/channel-v19819/.env
          test ! -e qa/channel-v19819/hosted-migration.sql
          node --input-type=module -e "
            import {readFileSync} from 'node:fs';
            import {assessAdmissionEvidence} from './qa/channel-v19819/hosted-evidence-preflight.mjs';
            const x=JSON.parse(readFileSync('./qa/channel-v19819/READONLY_EVIDENCE_STATUS_20261121.json','utf8'));
            const result=assessAdmissionEvidence(x);
            if(x.decision!=='NO_GO' || result.decision!=='NO_GO'
              || result.canApplyHostedMigration || result.canReadRealCatalog
              || result.canSendProviderMessage || result.canWriteRealOrders)process.exit(1);
            console.log('V19819_HOSTED_NO_GO VERIFIED_OPERATOR_ATTESTATION=NOT_RUN BACKUP_RESTORE=NOT_RUN');
          "
          echo "HOSTED_WRITES=0 MIGRATIONS=0 CREDENTIAL_CHANGES=0 PROVIDER_SEND=0"

name: "TIEN404 V19.8.9 Local Supabase Auth + Signed JWT + Store RLS UAT"

on:
  pull_request:
    paths:
      - "qa/channel-v1989/**"
      - "qa/channel-v19810/**"
      - "qa/channel-v19811/**"
      - "qa/channel-v19812/**"
      - ".github/workflows/tien404-v1989-local-supabase-auth-rls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-auth-jwt-rls:
    name: "REAL local Auth JWT / PostgREST / RLS / 2 Store same tenant"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      T404_LOCAL_EPHEMERAL: RUN_DOCKER_ONLY
      SUPABASE_ENV: test
    steps:
      - name: Checkout source with no persisted token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Supabase CLI 3.2.0
        uses: supabase/setup-cli@v1
        with:
          version: "3.2.0"
      - name: Confirm no hosted Supabase credentials / links
        shell: bash
        run: |
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${T404_UAT_PROJECT_REF:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test ! -e qa/channel-v1989/supabase/.temp/project-ref
          test ! -e qa/channel-v1989/.env
          supabase --version
      - name: Initialize disconnected, local-only Supabase project
        shell: bash
        working-directory: qa/channel-v1989
        run: |
          supabase init
          sed -i -E 's/^enable_confirmations = true/enable_confirmations = false/' supabase/config.toml
          sed -i -E 's/^major_version = [0-9]+/major_version = 17/' supabase/config.toml
          test -f supabase/config.toml
          test ! -f supabase/.temp/project-ref
      - name: Start ephemeral Auth PostgREST Postgres via Docker
        shell: bash
        working-directory: qa/channel-v1989
        run: |
          if ! supabase start --exclude studio,realtime,storage,functions,mail,analytics,pooler              > /tmp/t404_v1989_supabase_start.log 2>&1; then
            echo 'V1989_LOCAL_STACK_START_FAILED_NO_HOSTED_FALLBACK'
            exit 1
          fi
          echo 'V1989_LOCAL_AUTH_POSTGREST_DB_STARTED'
      - name: Install local psql client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply only synthetic local QA schema
        shell: bash
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "54322"
          PGUSER: "postgres"
          PGPASSWORD: "postgres"
          PGDATABASE: "postgres"
        run: |
          test "$PGHOST" = "127.0.0.1"
          test "$PGPORT" = "54322"
          test "$PGDATABASE" = "postgres"
          psql -X -v ON_ERROR_STOP=1 -q -f qa/channel-v1989/local-auth-rls-fixture.sql
          echo 'V1989_ONLY_SYNTHETIC_LOCAL_FIXTURE_APPLIED'
      - name: Validate real Supabase Auth sessions and Store-scoped PostgREST
        shell: bash
        working-directory: qa/channel-v1989
        run: node local-supabase-real-jwt-rls.mjs
      - name: Verify expanded six-table Store fixture safety
        shell: bash
        run: node qa/channel-v1989/local-real-auth-uat.test.mjs
      - name: Exercise six Commerce tables with fresh real GoTrue JWTs
        shell: bash
        env:
          T404_V1989_DOCKER_ONLY: "YES_LOCAL_CI"
        working-directory: qa/channel-v1989
        run: node local-real-auth-uat.mjs
      - name: V19.8.10 pure mock-provider signature and catalog contract QA
        shell: bash
        run: node qa/channel-v19810/mock-ingress-catalog-policy.test.mjs
      - name: V19.8.10 local private Bot registry consent and idempotent inbox schema
        shell: bash
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "54322"
          PGUSER: "postgres"
          PGPASSWORD: "postgres"
          PGDATABASE: "postgres"
        run: |
          test "$PGHOST" = "127.0.0.1"
          test "$PGPORT" = "54322"
          psql -X -v ON_ERROR_STOP=1 -q -f qa/channel-v19810/local-installation-authority.sql
          echo "V19810_LOCAL_PRIVATE_INSTALLATION_REGISTRY_APPLIED"
      - name: V19.8.10 signed synthetic provider -> installation owner -> JWT catalog integration
        shell: bash
        env:
          T404_V19810_LOCAL_ONLY: "DOCKER_SYNTHETIC_NO_SEND"
        working-directory: qa/channel-v1989
        run: node ../channel-v19810/local-installation-catalog-uat.mjs
      - name: V19.8.11 local Owner JWT consent fixture with no hosted grants
        shell: bash
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "54322"
          PGUSER: "postgres"
          PGPASSWORD: "postgres"
          PGDATABASE: "postgres"
        run: |
          test "$PGHOST" = "127.0.0.1"
          test "$PGPORT" = "54322"
          psql -X -v ON_ERROR_STOP=1 -q -f qa/channel-v19811/local-owner-consent-rls.sql
          echo "V19811_LOCAL_CONSENT_RLS_FIXTURE_APPLIED"
      - name: V19.8.11 local Owner signed JWT approves or revokes Bot Store consent
        shell: bash
        env:
          T404_V19811_DOCKER_ONLY: "OWNER_CONSENT_JWT_NO_SEND"
        working-directory: qa/channel-v1989
        run: node ../channel-v19811/local-merchant-consent-jwt-uat.mjs
      - name: V19.8.12 local server-issued one-time Owner consent challenge schema
        shell: bash
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "54322"
          PGUSER: "postgres"
          PGPASSWORD: "postgres"
          PGDATABASE: "postgres"
        run: |
          test "$PGHOST" = "127.0.0.1"
          test "$PGPORT" = "54322"
          psql -X -v ON_ERROR_STOP=1 -q -f qa/channel-v19812/local-one-time-owner-challenge.sql
          echo "V19812_LOCAL_CHALLENGE_RPC_FIXTURE_APPLIED"
      - name: V19.8.12 real local Owner JWT one-time consent and revocation acceptance
        shell: bash
        env:
          T404_V19812_LOCAL_ONLY: "ONE_TIME_CHALLENGE_NO_SEND"
        working-directory: qa/channel-v1989
        run: node ../channel-v19812/local-one-time-owner-challenge-uat.mjs
      - name: Dispose only this local CI stack
        if: always()
        shell: bash
        working-directory: qa/channel-v1989
        run: supabase stop --no-backup >/dev/null 2>&1 || true

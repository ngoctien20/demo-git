name: TIEN404 V17.1K-S1 Hostile Merchant Media Security Source NO SEND
on:
  push:
    branches:
      - work/v171k-secure-untrusted-media-quarantine-review-20261117
  pull_request:
    paths:
      - 'qa/v171k-security/**'
      - 'docs/ai-handoff/V17_1K_S1_*'
      - '.github/workflows/v171k-s1-hostile-media-security-nosend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-offline:
    name: V17.1K-S1 re-encode untrusted image and zero trust review with inherited regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'Install QA-only pinned Pillow decoder (not production)'
        run: |
          python -m pip install --disable-pip-version-check --no-deps 'Pillow==12.3.0'
          python -c "from PIL import features; assert features.check('jpg') and features.check('webp')"
      - name: 'Actual PNG JPEG WebP re-encoding, EXIF and decompression risk tests'
        run: python -m unittest discover -s qa/v171k-security -p 'test_*.py' -v
      - name: 'Malicious URLs, fake merchant and separate staff review tests'
        run: node --test qa/v171k-security/zero-trust-media-review.test.cjs
      - name: 'Inherited V17.1K 45 staff one-shot source security fixtures'
        run: node --test qa/v171k-commerce/v171k.test.cjs
      - name: 'Inherited V17.1J 76 photo and Messenger Zalo shadow fixtures'
        run: |
          node --test qa/v171j-commerce/merchant-evidence-pilot.test.cjs
          node --test qa/v171j-commerce/no-send-channel-uat.test.cjs
      - name: 'Inherited V17.1I 82 secure website and budget fixtures'
        run: python -m unittest discover -s qa/v171i-commerce -p 'test_*.py' -v
      - name: 'Inherited V17.1H 40 encoded raster fixtures'
        run: python -m unittest discover -s qa/v171h-commerce -p 'test_*.py' -v
      - name: 'Inherited V17.1G 40 simulated DNS TLS fixtures'
        run: node --test qa/v171g-commerce/pinned-dns-media-gateway.test.cjs
      - name: 'Inherited V17.1F 32 image registry fixtures'
        run: node --test qa/v171f-commerce/shop-media-source-registry.test.cjs
      - name: 'Inherited V17.1E 28 corpus receipt fixtures'
        run: node --test qa/v171e-commerce/v171e-contract.test.cjs
      - name: 'Inherited V17.1D 52 PNG cross channel fixtures'
        run: |
          node --test qa/v171d-commerce/png-media-intake.test.cjs
          node --test qa/v171d-commerce/two-step-link-readonly.test.cjs
          node --test qa/v171d-commerce/cross-channel-image-order-uat.test.cjs
      - name: 'Static guard blocks network/model/hosted writes in S1'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=[Path('qa/v171k-security/image_quarantine_reencode.py').read_text(),
               Path('qa/v171k-security/zero-trust-media-review.cjs').read_text()]
          for s in src:
            for bad in (r'\brequests\b',r'\burllib\b',r'\bsocket\b',r'\bsubprocess\b',
               r'\bchild_process\b',r'\bprocess\.env\b',r'\bfetch\s*\(',
               r'\bhttps?\.request\s*\(',r'\baxios\b',r'\bservice_role\b'):
              assert not re.search(bad,s,re.I),bad
          for required in ('sanitizedBytesForPrivateWorkerOnly',
              'safeToServePublicly','readyForModelVision','MAX_PIXELS'):
              assert required in src[0],required
          for required in ('linkClickable:false','networkRequests:0',
            'REVIEW_SEPARATE_MFA_STAFF_AUTH_REQUIRED',
            'independentMalwareScanVerifiedByModule:false'):
              assert required in src[1],required
          print('V171K_S1_SOURCE_NO_FETCH_NO_SEND PASS')
          PY
  production-blocked:
    name: V17.1K-S1 HOSTED P0 FILE UPLOAD SECURITY NO GO
    needs: [security-offline]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 'Deny hosted intake until independent sandbox, scanner, RLS and security QA'
        run: |
          echo "::error::V171K_S1_HOSTED_P0_NO_GO_NEEDS_SANDBOX_SCANNER_STAFF_AUTH_STORE_RLS"
          exit 3

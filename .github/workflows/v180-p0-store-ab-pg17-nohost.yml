name: TIEN404 V18.0 P0 — Same-Tenant Store A/B PG17 Negative QA (NO HOST)
on:
  push:
    branches:
      - work/v180-p0-store-ab-jwt-sim-pg17-nohost-20261118
  pull_request:
    paths:
      - 'qa/v180-p0-store-ab/**'
      - '.github/workflows/v180-p0-store-ab-pg17-nohost.yml'
      - 'docs/ai-handoff/T404_V180_P0_STORE_AB_JWT_SIMULATED_PG17_NOHOST.md'
permissions:
  contents: read
jobs:
  disposable-pg17-store-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: v180_only_synthetic_disposable_ci
          POSTGRES_DB: v180_store_ab_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v180_store_ab_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: v180_store_ab_disposable
      PGUSER: postgres
      PGPASSWORD: v180_only_synthetic_disposable_ci
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      ZALO_BOT_TOKEN: ''
      META_PAGE_ACCESS_TOKEN: ''
      OPENAI_API_KEY: ''
    steps:
      - name: Checkout source, no persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Node 22 for inherited fail-closed preflight
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Refuse any hosted credentials and staging migration
        shell: bash
        run: |
          set -euo pipefail
          test -z "$SUPABASE_URL"
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "$ZALO_BOT_TOKEN"
          test -z "$META_PAGE_ACCESS_TOKEN"
          test -z "$OPENAI_API_KEY"
          test -f qa/v152-rpc178a/sql/private-schema-candidate.sql
          test -f qa/v180-p0-store-ab/pg17-jwt-simulated-fixture.DO_NOT_APPLY.sql
          test -f qa/v180-p0-store-ab/pg17-store-ab-negative-tests.DO_NOT_APPLY.sql
          ! grep -Eiq 'create[[:space:]]+extension[[:space:]]+dblink|http_post|net\.http_post|pg_net' qa/v180-p0-store-ab/*.sql
      - name: Install roles only inside temporary PostgreSQL 17 service
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;'
          psql -X -v ON_ERROR_STOP=1 -c 'SHOW server_version'
      - name: Re-assert inherited RPC17.8A zero-grant candidate in disposable PG17
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f qa/v152-rpc178a/sql/private-schema-candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f qa/v152-rpc178a/sql/disposable-private-schema-assertions.sql
      - name: Apply STRICTLY DISPOSABLE simulated Store A/B RLS fixture
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f qa/v180-p0-store-ab/pg17-jwt-simulated-fixture.DO_NOT_APPLY.sql
      - name: Execute same-Tenant A/B, foreign-key, stale-owner and fail-close matrix
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f qa/v180-p0-store-ab/pg17-store-ab-negative-tests.DO_NOT_APPLY.sql 2>&1 | tee /tmp/v180-p0-nohost-pg17.log
          grep -q 'RPC178C ALL SYNTHETIC PG17 NEGATIVE TESTS PASSED' /tmp/v180-p0-nohost-pg17.log
      - name: Inherited RPC17.8A/B owner and migration release gates
        shell: bash
        run: |
          set -euo pipefail
          node --test qa/v152-rpc178a/migration-admission.test.mjs qa/v152-rpc178b/immutable-preflight.test.mjs
      - name: Explicit release NO-GO
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import {liveNoSendDecision} from './qa/v152-rpc178b/immutable-preflight.mjs'; const r=liveNoSendDecision(); if(r.can_apply_migration||r.real_auth_ab_uat_accepted||r.can_send||r.can_open_access)process.exit(1)"
          echo 'PASS: DISP PG17 role claim RLS only. REAL HOSTED STORE/JWT/PRODUCTION NO-GO.'

name: TIEN404 Supabase staging login security QA
on:
  push:
    branches: [work/supabase-auth-staging-v1, work/v12-2-merchant-portal]
    paths:
      - 'tests/auth_browser_smoke.py'
      - 'login.html'
      - 'account.html'
      - 'assets/owner-*.mjs'
      - 'assets/auth*.js'
      - 'assets/auth-helpers.mjs'
      - 'assets/auth-runtime.mjs'
      - 'assets/auth-bootstrap.js'
      - 'assets/auth.css'
      - 'merchant-portal.html'
      - 'register-staging.html'
      - 'assets/merchant-portal*'
      - 'assets/register-staging.js'
      - 'tests/merchant-portal*'
      - 'scripts/check-supabase-auth-staging.mjs'
      - 'tests/auth-helpers.test.mjs'
      - 'tests/auth-runtime.test.mjs'
      - 'tests/auth-recovery-guard.test.mjs'
      - 'tests/auth-preview-build.test.mjs'
      - 'scripts/build-auth-preview.mjs'
      - 'merchant-portal.html'
      - 'register-staging.html'
      - 'assets/merchant-portal*'
      - 'assets/register-staging.js'
      - 'tests/merchant-portal*'
      - '.github/workflows/auth-staging-qa.yml'
  pull_request:
    paths:
      - 'tests/auth_browser_smoke.py'
      - 'login.html'
      - 'account.html'
      - 'assets/owner-*.mjs'
      - 'assets/auth*.js'
      - 'assets/auth.css'
      - 'scripts/check-supabase-auth-staging.mjs'
      - '.github/workflows/auth-staging-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-auth-static-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check assets/auth-config.js
          node --check assets/auth-client.js
          node --check assets/auth-login.js
          node --check assets/auth-account.js
          node --check assets/auth-helpers.mjs
          node --check assets/auth-runtime.mjs
          node --check assets/auth-bootstrap.js
          node --check assets/merchant-portal.js
          node --check assets/merchant-portal-policy.mjs
          node --check assets/register-staging.js
      - name: Auth + no-secret + no-demo-bypass checks
        run: node scripts/check-supabase-auth-staging.mjs
      - name: Isolated security and tenancy helper tests
        run: node --test tests/auth-helpers.test.mjs tests/auth-runtime.test.mjs tests/auth-recovery-guard.test.mjs tests/merchant-portal-v12-2.test.mjs
      - name: Build minimal Render preview
        run: node scripts/build-auth-preview.mjs
      - name: Verify public preview artifact security
        run: node --test tests/auth-preview-build.test.mjs tests/merchant-portal-v12-2.test.mjs
      - name: Clarify no hosted Auth test was performed
        run: echo "Static only, no sign in, no account created, no customer data or Supabase write."
      - name: Auth staging Chromium — canonical Customer or preserved legacy QA
        run: |
          if grep -q 'content="0;url=merchant-portal.html"' account.html; then
            echo "V13.5R.1 canonical Customer route detected; no legacy CRM browser flow."
            npm install --no-save --no-package-lock playwright@1.65.1
            npx playwright install --with-deps chromium
            python -m http.server 8080 >/tmp/tien404-auth-qa.log 2>&1 &
            sleep 2
            node tests/account-canonical-entry-browser.cjs
            node tests/customer-account-browser.cjs
          else
            echo "Legacy Account route detected; preserving historical Auth/CRM browser QA."
            python -m pip install playwright==1.58.0
            python -m playwright install chromium
            python tests/auth_browser_smoke.py
            python tests/merchant-portal-browser-smoke.py
          fi

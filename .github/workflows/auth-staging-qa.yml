name: TIEN404 Supabase staging login security QA
on:
  push:
    branches: [work/supabase-auth-staging-v1]
    paths:
      - 'tests/auth_browser_smoke.py'
      - 'login.html'
      - 'account.html'
      - 'assets/auth*.js'
      - 'assets/auth-helpers.mjs'
      - 'assets/auth-runtime.mjs'
      - 'assets/auth-bootstrap.js'
      - 'assets/auth.css'
      - 'scripts/check-supabase-auth-staging.mjs'
      - 'tests/auth-helpers.test.mjs'
      - 'tests/auth-runtime.test.mjs'
      - 'tests/auth-recovery-guard.test.mjs'
      - 'tests/auth-preview-build.test.mjs'
      - 'scripts/build-auth-preview.mjs'
      - '.github/workflows/auth-staging-qa.yml'
  pull_request:
    paths:
      - 'tests/auth_browser_smoke.py'
      - 'login.html'
      - 'account.html'
      - 'assets/auth*.js'
      - 'assets/auth.css'
      - 'scripts/check-supabase-auth-staging.mjs'
      - '.github/workflows/auth-staging-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-auth-static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check assets/auth-config.js
          node --check assets/auth-client.js
          node --check assets/auth-login.js
          node --check assets/auth-account.js
          node --check assets/auth-helpers.mjs
          node --check assets/auth-runtime.mjs
          node --check assets/auth-bootstrap.js
      - name: Auth + no-secret + no-demo-bypass checks
        run: node scripts/check-supabase-auth-staging.mjs
      - name: Isolated security and tenancy helper tests
        run: node --test tests/auth-helpers.test.mjs tests/auth-runtime.test.mjs tests/auth-recovery-guard.test.mjs
      - name: Build minimal Render preview
        run: node scripts/build-auth-preview.mjs
      - name: Verify public preview artifact security
        run: node --test tests/auth-preview-build.test.mjs
      - name: Clarify no hosted Auth test was performed
        run: echo "Static only, no sign in, no account created, no customer data or Supabase write."
      - name: Chromium auth staging smoke with isolated transport
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python tests/auth_browser_smoke.py

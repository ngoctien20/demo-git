name: TIEN404 website navigation regression
on:
  push:
    branches: [gh-pages]
    paths:
      - '*.html'
      - 'scripts/check-site-navigation.mjs'
      - '.github/workflows/site-nav-regression.yml'
  pull_request:
    paths:
      - '*.html'
      - 'scripts/check-site-navigation.mjs'
      - '.github/workflows/site-nav-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nav-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate simplified navigation across public pages
        run: node scripts/check-site-navigation.mjs

name: TIEN404 V17.21H.2 Private DO Hosted Preflight NO DEPLOY
on:
  pull_request:
    paths:
      - 'qa/v1721h2-hosted-private/**'
      - '.github/workflows/v1721h2-hosted-private-preflight.yml'
permissions:
  contents: read
jobs:
  private-no-url-gates:
    name: No routes, no public preview, isolated SQL class, zero credential IO
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ten fail-closed public-routing and migration checks
        run: |
          node --check qa/v1721h2-hosted-private/preflight.test.mjs
          node --test qa/v1721h2-hosted-private/preflight.test.mjs
      - name: Ensure Cloudflare deployment commands are NOT present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/v1721h2-hosted-private-preflight.yml').read_text()
          config=Path('qa/v1721h2-hosted-private/wrangler.hosted.NO_DEPLOY.jsonc').read_text()
          assert 'cloudflare.request(' not in workflow
          assert 'migrations' in config and '"new_sqlite_classes"' in config
          assert '"workers_dev": false' in config and '"preview_urls": false' in config
          assert '"routes": []' in config
          assert not any(k in workflow for k in ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','wrangler deploy'])
          print('PRIVATE PREDEPLOY STATIC PASS: no credentials, no cloud deployment')
          PY
  workerd-bundle-validation-only:
    name: Wrangler dry-run bundle only, no Cloudflare account request
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA tooling only
        working-directory: qa/v1721-zalo-durable
        run: yarn install --non-interactive --no-lockfile
      - name: Build preview of isolated Durable Object script without uploading
        working-directory: qa/v1721-zalo-durable
        run: yarn wrangler deploy --dry-run --config ../v1721h2-hosted-private/wrangler.hosted.NO_DEPLOY.jsonc --outdir /tmp/t404-v1721h2-bundle
      - name: Verify dry run produced bundle with V2 DO class
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/t404-v1721h2-bundle')
          assert p.is_dir() and any(p.iterdir()),'dry-run output missing'
          bodies='\n'.join(x.read_text(errors='ignore') for x in p.rglob('*') if x.is_file() and x.stat().st_size<4_000_000)
          assert 'ZaloBotReplayBucketV2' in bodies,'versioned class not bundled'
          print('BUNDLE PASS, NO REAL WORKER/ROUTE/DO CREATED')
          PY
  cloudflare-upload-and-hosted-uat:
    name: Hosted script upload / SQL migration / provider UAT — REQUIRE APPROVAL
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Intentionally blocked until billing authorization and private no-public-URL invocation proven'

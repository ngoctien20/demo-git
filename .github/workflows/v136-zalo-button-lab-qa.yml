name: TIEN404 V13.6 Zalo Button Capability Lab (NO SEND)
on:
  push:
    branches:
      - work/v136-zalo-button-capability-lab-staging
  pull_request:
    paths:
      - "qa/zalo-control-text/**"
      - ".github/workflows/v136-zalo-button-lab-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  button-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source integrity and negative authorization QA
        run: |
          node --check qa/zalo-control-text/button-capability.cjs
          node --check qa/zalo-control-text/button-capability.test.cjs
          node --check qa/zalo-control-text/button-lab/app.js
          node --test qa/zalo-control-text/button-capability.test.cjs
          node --test qa/zalo-control-text/zalo-payloads.test.cjs
          node --test qa/zalo-control-text/worker-qa-richtext-route.test.mjs
          node --test qa/sales-lite/v131/*.test.cjs
  button-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium Playwright only inside ephemeral runner
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Interactive preview and no-write QA at 5 viewport widths
        run: |
          python -m http.server 8080 > /tmp/tien404-v136-http.log 2>&1 &
          sleep 2
          node qa/zalo-control-text/button-lab-browser-qa.cjs
      - name: Screenshots of mocked preview (NO Zalo account data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v136-zalo-button-lab-mock-screenshots
          path: qa-artifacts-zalo-buttons/
          if-no-files-found: ignore

name: TIEN404 CBOT-MSG-CANARY-02 Native Page Proof × No-Write Cutover (NO SEND)

on:
  push:
    branches:
      - work/cbot-msg-canary02-native-ownership-single-responder-gate-nosend-20261116
  pull_request:
    paths:
      - 'qa/cbot-messenger-canary02/**'
      - 'docs/ai-handoff/CBOT_MSG_CANARY02_*'
      - '.github/workflows/cbot-msg-canary02-native-owner-cutover-nosend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-owner-and-single-responder:
    name: Real Metadata × Native Page Owner NO-GO × Single Responder Safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax and exact observed JSON
        run: |
          node --check qa/cbot-messenger-canary02/native-owner-cutover-gate.mjs
          node --check qa/cbot-messenger-canary02/native-owner-cutover-gate.test.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('qa/cbot-messenger-canary02/actual-readonly-baseline-20261116.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('qa/cbot-messenger-canary02/single-responder-cutover-source-design.json','utf8'))"
      - name: Native Meta ownership private gate and graph negative suite
        run: node --test qa/cbot-messenger-canary02/native-owner-cutover-gate.test.mjs
      - name: Real Meta screenshot callback path ↔ existing n8n GET/POST ↔ No-Writer insertion guard
        run: node --test qa/cbot-messenger-canary02/callback-route-draft-audit.test.mjs
      - name: Actual Meta App Administrator screenshot and manual n8n #4180 owner QA receipt
        run: node --test qa/cbot-messenger-canary02/owner-app-admin-canary-qa-4180.test.mjs
      - name: Regression real LIVE01, actual n8n 4177, Studio A/B and crosschannel
        run: |
          node --test qa/cbot-messenger-canary/isolated-canary-guard.test.mjs
          node --test qa/cbot-messenger-canary/n8n-manual-qa-evidence.test.mjs
          node --test qa/cbot-messenger-live-uat/live01-observed-execution.test.mjs
          node --test qa/cbot-messenger-live-uat/messenger-custom-preflight.test.mjs
          node --test qa/v167-merchant/merchant-registry.test.mjs
          node --test qa/cbot-uat02/crosschannel-core.test.mjs
      - name: Static proof no Meta/Supabase API, secret, customer data, SEND or migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          src=Path('qa/cbot-messenger-canary02/native-owner-cutover-gate.mjs').read_text()
          executable=re.sub(r'/\*[\s\S]*?\*/','',src)
          for forbidden in ('fetch(', 'axios(', 'http.request(', 'https.request(',
            'process.env.', 'child_process', 'newCredential(', 'apply_migration(',
            'sendMessage(', 'pg_dump ', 'writeFileSync(', 'service_role'):
            assert forbidden not in executable,forbidden
          evidence=json.loads(Path('qa/cbot-messenger-canary02/actual-readonly-baseline-20261116.json').read_text())
          design=json.loads(Path('qa/cbot-messenger-canary02/single-responder-cutover-source-design.json').read_text())
          for key in ('page_id','psid','access_token','secret_ref','sender_id',
            'recipient_id','customer_name','phone','email','raw_body','meta_message_id'):
            assert key not in evidence,key
          assert evidence['real_native_page_admin']=='NOT_OBSERVED'
          assert evidence['actual_published_patch_applied'] is False
          assert design['canary_enabled'] is False
          assert design['message_ingress_count']==1 and design['send_node_count']==1
          for required in ('can_change_published:false','can_send_provider:false',
            'can_write_orders:false','provider_messages_sent:0','orders_written:0'):
            assert required in src,required
          print('PASS native Page private proof gate / no source-hosted write or provider send')
          PY

                    'actualCloudflareWrites','actualN8nChanges',
                    'actualProviderMessages','actualCostsApprovedUsd'):
              assert m[k]==0,k
          source=Path('qa/v172a-store-auth/real-jwt-no-send-contract.cjs').read_text()
          for banned in (r'\bfetch\s*\(',r'\bprocess\.env\b',
                         r'\bchild_process\b',r'\bhttps?\.request\s*\(',r'\baxios\b'):
              assert not re.search(banned,source),banned
          candidate=Path('qa/v172a-store-auth/migration-candidate.NOT-APPLIED.sql').read_text()
          assert candidate.strip().endswith('ROLLBACK;')
          assert 'security_invoker = true' in candidate
          assert 'GRANT SELECT ON public.tien404_v172a_qa_catalog TO authenticated' in candidate
          assert 'CREATE POLICY qa_catalog_same_store_owner_read' in candidate
          assert 'FORCE ROW LEVEL SECURITY' in candidate
          assert not re.search(r'(?im)^\s*DROP\s+',candidate)
          assert not re.search(r'(?im)^\s*COMMIT\s*;',candidate)
          assert not re.search(r'(?im)^\s*ALTER TABLE\s+(?:public|tien404_r1_qa)\.',candidate)
          print('V172A_APPROVAL_ONLY_VIEW_SECURITY_INVOKER_REAL_JWT_HOSTED_NO_GO_PASS')
          PY

name: TIEN404 V17.2B Authorized QA Store Provisioning and Real JWT Private Admission NO SEND
on:
  push:
    branches:
      - work/v172b-private-authorized-store-provisioning-real-jwt-gate-20261118
  pull_request:
    paths:
      - 'qa/v172b-private-provisioning/**'
      - 'qa/v171p-bot-security/**'
      - 'docs/ai-handoff/V17_2B_*'
      - '.github/workflows/v172b-private-authorized-store-real-jwt-nosend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v172b-private-admission-regression:
    name: V17.2B 40 private provisioning admission cases + 1290 inherited source regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 'V17.2B independent MFA-reviewed private authorization and no-user-creation gate'
        run: |
          node -c qa/v172b-private-provisioning/provisioning-admission.cjs
          node --test qa/v172b-private-provisioning/provisioning-admission.test.cjs
      - name: 'V17.2B verified staging has no real owner JWT readiness / no deploy'
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          m=json.loads(Path('qa/v172b-private-provisioning/real-admission-state.json').read_text())
          assert m['release']=='HOSTED_NO_GO' and m['sourceOnly'] is True
          assert m['newSyntheticTests']==40 and m['inheritedSourceTests']==1290
          assert m['allowProductionRelease'] is False
          assert m['auditedReadOnlyStaging']['projectStatus']=='ACTIVE_HEALTHY'
          assert m['auditedReadOnlyStaging']['proposedV172aSchemaPresent'] is False
          assert m['auditedReadOnlyStaging']['proposedPublicV172aViewPresent'] is False
          assert m['auditedReadOnlyStaging']['qualifiedSameTenantTwoActiveQaUsers']==0
          assert m['auditedReadOnlyStaging']['qualifiedSameTenantDistinctStoreOwners']==0
          assert m['auditedReadOnlyStaging']['existingPaidDevelopmentBranches']==0
          assert all(v is False for v in m['consentState'].values())
          assert all(v is False for v in m['realHostedAcceptance'].values())
          for k in ('actualSupabaseWrites','actualAuthUserCreations',
                    'actualMigrationApplies','actualSupabaseDevelopmentBranches',
                    'actualProviderMessagesSent','actualN8nWrites','actualCloudflareWrites',
                    'actualNewSpendApprovedUsd'): assert m[k]==0,k
          src=Path('qa/v172b-private-provisioning/provisioning-admission.cjs').read_text()
          for banned in (r'\bfetch\s*\(',r'\bprocess\.env\b',
                         r'\bchild_process\b',r'\bhttps?\.request\s*\(',r'\baxios\b'):
              assert not re.search(banned,src),banned
          assert 'DISPOSABLE_QA_AUTH_PROVISIONING_APPROVAL_PREVIEW_ONLY' in src
          for forbidden in ('allowAuthUserCreation:false','allowApplyMigration:false',
                            'allowLiveJwtUat:false','allowBillingChanges:false'):
              assert forbidden in src,forbidden
          print('V172B_PRIVATE_APPROVAL_PREVIEW_ONLY_NEVER_PROVISION_AUTH_OR_SEND_PASS')
          PY
      - name: 'V17.2A private JWT no-send contract adversarial unit suite'
        run: |
          node -c qa/v172a-store-auth/real-jwt-no-send-contract.cjs
          node --test qa/v172a-store-auth/real-jwt-no-send-contract.test.cjs
      - name: 'V17.2A migration candidate and TRUE hosted UAT NO-GO'
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          m=json.loads(Path('qa/v172a-store-auth/real-acceptance-state.json').read_text())
          assert m['release']=='HOSTED_NO_GO' and m['sourceOnly'] is True
          assert m['newContractTests']==35 and m['inheritedSourceTests']==1255
          assert m['productionReleaseApproved'] is False
          for k,v in m['independentApprovals'].items(): assert v is False,k
          for k,v in m['realHostedEvidence'].items(): assert v is False,k
          for k in ('actualSupabaseAuthUsersCreated','actualSupabaseDbWrites',

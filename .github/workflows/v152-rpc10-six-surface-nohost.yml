name: TIEN404 RPC10 Six-Surface Store NO-GO (OFFLINE ONLY)
on:
  pull_request:
    paths:
      - 'qa/v152-rpc10/**'
      - 'docs/ai-handoff/T404_RPC10_*'
      - '.github/workflows/v152-rpc10-six-surface-nohost.yml'
  push:
    branches:
      - work/v152-adv6c-rpc10-six-surface-store-gate-nosend-20261117
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rpc10-offline-gate:
    name: Node gates G0.1/G0.2/G0.3 + HOSTED NO-GO (no DB)
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and 47 negative/unit tests
        run: |
          node --check qa/v152-rpc10/store-gate.cjs
          node --test qa/v152-rpc10/store-gate.test.cjs
      - name: RPC10 G0.1 alias canonical authority structural preflight
        run: |
          node --check qa/v152-rpc10/alias-bridge-preflight.cjs
          node --test qa/v152-rpc10/alias-bridge-preflight.test.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('qa/v152-rpc10/alias-bridge-preflight.cjs').read_text()
          for pattern in [r'\bfetch\s*\(', r'\bhttps?\.request\s*\(',
                          r'\bchild_process\b', r'\bcreateClient\s*\(',
                          r'\bprocess\.env\b']:
              assert not re.search(pattern,s),pattern
          for flag in ('canRelease:false','canResolveRealStore:false','actualOwnerProofAuthenticated:false'):
              assert flag in s,flag
          print('RPC10 G0.1 source-only, no hosted authorization')
          PY
      - name: RPC10 G0.2 source provenance coverage (aggregate only)
        run: |
          node --check qa/v152-rpc10/g02-provenance-readiness.cjs
          node --test qa/v152-rpc10/g02-provenance-readiness.test.cjs
          node - <<'NODE'
          const base=require('./qa/v152-rpc10/g02-hosted-provenance-sanitized.json');
          const gate=require('./qa/v152-rpc10/g02-provenance-readiness.cjs');
          const r=gate.inspect(base,'2026-11-17T02:05:00Z');
          if(r.status!=='HOSTED_ORIGINAL_STORE_OWNER_NO_GO'||r.canAssignStore||
             r.canBackfill||r.canMigrate||r.canRelease||r.actualJwtTested)
            throw Error('RPC10_G02_UNSAFE_OWNER_INFERENCE');
          console.log(JSON.stringify({status:r.status,blockers:r.blockers.length,canMigrate:r.canMigrate}));
          NODE
          python3 - <<'PY'
          from pathlib import Path
          import re
          sql=Path('qa/v152-rpc10/g02-provenance-hosted-READ_ONLY.sql').read_text()
          no_comments='\n'.join(line for line in sql.splitlines() if not line.lstrip().startswith('--'))
          assert re.search(r'BEGIN\s+TRANSACTION\s+READ\s+ONLY\s*;',no_comments,re.I)
          assert re.search(r'COMMIT\s*;\s*$',no_comments,re.I)
          print('RPC10 G0.2 PASS: SQL read-only transaction boundary')
          PY
      - name: RPC10 immutable HOSTED NO-GO baseline gate
        run: |
          node - <<'NODE'
          const base=require('./qa/v152-rpc10/hosted-baseline-sanitized.json');
          const gate=require('./qa/v152-rpc10/store-gate.cjs');
          const r=gate.inspect(base);
          if(r.status!=='HOSTED_NO_GO'||r.canMigrate||r.canBackfill||r.canReplaceRls||r.canRelease)
            throw Error('RPC10_UNSAFE_RELEASE');
          if(r.blockers.length<40)throw Error('RPC10_BASELINE_COVERAGE_REGRESSION');
          console.log(JSON.stringify({status:r.status,blockers:r.blockers.length,canMigrate:r.canMigrate}));
          NODE
      - name: Static ban on any hosted I/O or migration executor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('qa/v152-rpc10/store-gate.cjs').read_text()
          for pattern in [r'\bfetch\s*\(',r'\bchild_process\b',r'\bprocess\.env\b',
                          r'\bhttps?\.request\s*\(',r'\bexec\s*\(',r'\bcreateClient\s*\(']:
            assert not re.search(pattern,p),pattern
          assert 'canMigrate:false' in p and 'canReplaceRls:false' in p
          assert "STRUCTURAL_SELF_REPORT_REQUIRES_EXTERNAL_ATTESTATION" in p
          print('PASS: offline-only and immutable HOSTED NO-GO')
          PY

  rpc10-disposable-pg17:
    name: PG17 disposable six-surface RLS/FK rollback and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    container:
      image: postgres:17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rpc10_ephemeral_synthetic_only
          POSTGRES_DB: t404_rpc8_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d t404_rpc8_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      T404_RPC8_DISPOSABLE: 'YES'
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: t404_rpc8_ci
      PGUSER: postgres
      PGPASSWORD: rpc10_ephemeral_synthetic_only
      PGOPTIONS: '-c tien404.rpc8_ephemeral=RPC8_DISPOSABLE'
    steps:
      - uses: actions/checkout@v4
      - name: Refuse any unguarded SQL path in RPC10
        run: |
          grep -F -q "RPC10_REFUSES_HOSTED" qa/v152-rpc10/pg17-six-surface-atomic-cutover-disposable-only.sql
          grep -F -q "RPC10_DISPOSABLE_ONLY" qa/v152-rpc10/pg17-six-surface-fixture.sql
          grep -F -q "t404_rpc8_ci" qa/v152-rpc10/ci-pg17-six-surface-rehearsal.sh
          bash -n qa/v152-rpc10/ci-pg17-six-surface-rehearsal.sh
      - name: Actual PostgreSQL 17 six Commerce surfaces, atomic rollback and cross-store denial
        run: |
          bash qa/v152-rpc10/ci-pg17-six-surface-rehearsal.sh

  rpc10-concurrent-reader-blackout:
    name: PG17 concurrent reader lock / COMMIT / ROLLBACK (disposable only)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: postgres:17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rpc10_concurrent_synthetic_only
          POSTGRES_DB: t404_rpc8_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d t404_rpc8_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      T404_RPC8_DISPOSABLE: 'YES'
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: t404_rpc8_ci
      PGUSER: postgres
      PGPASSWORD: rpc10_concurrent_synthetic_only
      PGOPTIONS: '-c tien404.rpc8_ephemeral=RPC8_DISPOSABLE'
    steps:
      - uses: actions/checkout@v4
      - name: Strict no-hosted guard and Bash syntax
        run: |
          grep -F -q "RPC10_CONCURRENT_DISPOSABLE_ONLY" qa/v152-rpc10/ci-pg17-concurrent-reader-blackout.sh
          grep -F -q "t404_rpc8_ci" qa/v152-rpc10/ci-pg17-concurrent-reader-blackout.sh
          bash -n qa/v152-rpc10/ci-pg17-concurrent-reader-blackout.sh
      - name: Real concurrent PG17 readers must wait and see only transaction-consistent policy
        run: |
          bash qa/v152-rpc10/ci-pg17-concurrent-reader-blackout.sh
,no_comments,re.I)
          assert not re.search(r'\b(INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|TRUNCATE|GRANT|REVOKE|CALL|COPY|VACUUM)\s',no_comments,re.I)
          assert 'jsonb_build_object' in no_comments
          for forbidden in ['request_sha256','request_key','customer_name','phone','auth.users']:
              assert not re.search(r'(?i)\b'+re.escape(forbidden)+r'\b',no_comments),forbidden
          js=Path('qa/v152-rpc10/g02-provenance-readiness.cjs').read_text()
          for forbidden in [r'\bfetch\s*\(',r'\bchild_process\b',r'\bcreateClient\s*\(',r'\bprocess\.env\b']:
              assert not re.search(forbidden,js),forbidden
          for gate in ('canAssignStore:false','canMigrate:false','canRelease:false','originalMerchantEvidenceAuthenticatedHere:false'):
              assert gate in js,gate
          print('G0.2 read-only aggregates and hard HOSTED OWNER NO-GO enforced')
          PY
      - name: RPC10 G0.3 published Commerce/store contracts fail closed
        run: |
          node --check qa/v152-rpc10/g03-published-caller-readiness.cjs
          node --test qa/v152-rpc10/g03-published-caller-readiness.test.cjs
          node - <<'NODE'
          const base=require('./qa/v152-rpc10/g03-published-caller-sanitized.json');
          const {audit}=require('./qa/v152-rpc10/g03-published-caller-readiness.cjs');
          const status=audit(base,'2026-11-17T02:39:00Z');
          if(status.status!=='PUBLISHED_COMMERCE_STORE_CUTOVER_NO_GO' ||
             status.canMigrate || status.canPublish || status.canReadHostedCommerce ||
             status.realCustomerRowsAccessed !== 0 || status.blockers.length<10)
             throw Error('RPC10_G03_UNSAFE_CUTOVER_GATE');
          console.log(JSON.stringify({status:status.status,blockerTypes:status.blockers.length,canMigrate:false}));
          NODE
          python3 - <<'PY'
          from pathlib import Path
          import re
          module=Path('qa/v152-rpc10/g03-published-caller-readiness.cjs').read_text()
          for pattern in [r'\bfetch\s*\(',r'\bchild_process\b',r'\bcreateClient\s*\(',
                          r'\bprocess\.env\b',r'\bhttps?\.request\s*\(']:
              assert not re.search(pattern,module),pattern
          for marker in ['canMigrate:false','canReadHostedCommerce:false','canPublish:false','canSendProvider:false']:
              assert marker in module,marker
          print('G0.3 metadata-only, all hosted Commerce actions hard-denied')
          PY
      - name: Assert current baseline is denied, never connected or authorized
        run: |
          node - <<'NODE'
          const base=require('./qa/v152-rpc10/hosted-baseline-sanitized.json');
          const gate=require('./qa/v152-rpc10/store-gate.cjs');
          const r=gate.inspect(base);
          if(r.status!=='HOSTED_NO_GO'||r.canMigrate||r.canBackfill||r.canReplaceRls||r.canRelease)
            throw Error('RPC10_UNSAFE_RELEASE');
          if(r.blockers.length<40)throw Error('RPC10_BASELINE_COVERAGE_REGRESSION');
          console.log(JSON.stringify({status:r.status,blockers:r.blockers.length,canMigrate:r.canMigrate}));
          NODE
      - name: Static ban on any hosted I/O or migration executor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('qa/v152-rpc10/store-gate.cjs').read_text()
          for pattern in [r'\bfetch\s*\(',r'\bchild_process\b',r'\bprocess\.env\b',
                          r'\bhttps?\.request\s*\(',r'\bexec\s*\(',r'\bcreateClient\s*\(']:
            assert not re.search(pattern,p),pattern
          assert 'canMigrate:false' in p and 'canReplaceRls:false' in p
          assert "STRUCTURAL_SELF_REPORT_REQUIRES_EXTERNAL_ATTESTATION" in p
          print('PASS: offline-only and immutable HOSTED NO-GO')
          PY


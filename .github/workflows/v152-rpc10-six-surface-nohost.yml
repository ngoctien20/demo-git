          grep -F -q "RPC10_DISPOSABLE_ONLY" qa/v152-rpc10/pg17-six-surface-fixture.sql
          grep -F -q "t404_rpc8_ci" qa/v152-rpc10/ci-pg17-six-surface-rehearsal.sh
          bash -n qa/v152-rpc10/ci-pg17-six-surface-rehearsal.sh
      - name: Actual PostgreSQL 17 six Commerce surfaces, atomic rollback and cross-store denial
        run: |
          bash qa/v152-rpc10/ci-pg17-six-surface-rehearsal.sh


name: TIEN404 V17.1O Published V17.17 Intent Security Regression NO SEND
on:
  push:
    branches:
      - work/v171o-v1717-exact-classifier-owner-jwt-provider-security-20261117
  pull_request:
    paths:
      - 'qa/v171o-bot-security/**'
      - 'docs/ai-handoff/V17_1O_*'
      - '.github/workflows/v171o-v1717-exact-regression-nosend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-published-source-qa:
    name: V17.1O exact published V17.17 classifier 57 tests plus 687 inherited
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 'Replay exact published V17.17 classifier and shadow security override'
        run: node --test qa/v171o-bot-security/v171o-source-regression.test.cjs
      - name: 'Preserve V17.1N 57 signed-shaped Messenger/Core shadow tests'
        run: node --test qa/v171n-bot-security/v171n-shadow.test.cjs
      - name: 'Preserve V17.1M 48 same-Tenant Store A/B tests'
        run: node --test qa/v171m-bot-security/v171m-snapshot.test.cjs
      - name: 'Preserve V17.1L 120 ingress/store tool security and audit tests'
        run: |
          node --test qa/v171l-bot-security/zero-trust-bot-boundary.test.cjs
          node --test qa/v171l-bot-security/safe-audit-and-quota.test.cjs
      - name: 'Install test-only Pillow decoder for earlier image security QA'
        run: |
          python -m pip install --disable-pip-version-check --no-deps 'Pillow==12.3.0'
          python -c "from PIL import features; assert features.check('jpg') and features.check('webp')"
      - name: 'Preserve V17.1K-S1 67 malicious image and link cases'
        run: |
          python -m unittest discover -s qa/v171k-security -p 'test_*.py' -v
          node --test qa/v171k-security/zero-trust-media-review.test.cjs
      - name: 'Preserve V17.1K staff intake 45 tests'
        run: node --test qa/v171k-commerce/v171k.test.cjs
      - name: 'Preserve V17.1J 76 merchant image evidence and no-send tests'
        run: |
          node --test qa/v171j-commerce/merchant-evidence-pilot.test.cjs
          node --test qa/v171j-commerce/no-send-channel-uat.test.cjs
      - name: 'Preserve V17.1I 82 safe image acquisition tests'
        run: python -m unittest discover -s qa/v171i-commerce -p 'test_*.py' -v
      - name: 'Preserve V17.1H 40 encoded raster tests'
        run: python -m unittest discover -s qa/v171h-commerce -p 'test_*.py' -v
      - name: 'Preserve V17.1G 40 DNS/TLS security tests'
        run: node --test qa/v171g-commerce/pinned-dns-media-gateway.test.cjs
      - name: 'Preserve V17.1F 32 media registry tests'
        run: node --test qa/v171f-commerce/shop-media-source-registry.test.cjs
      - name: 'Preserve V17.1E 28 corpus receipt tests'
        run: node --test qa/v171e-commerce/v171e-contract.test.cjs
      - name: 'Preserve V17.1D 52 identity and media tests'
        run: |
          node --test qa/v171d-commerce/png-media-intake.test.cjs
          node --test qa/v171d-commerce/two-step-link-readonly.test.cjs
          node --test qa/v171d-commerce/cross-channel-image-order-uat.test.cjs
      - name: 'Verify no-n8n-live-change, exact source copy and no hosted IO'
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          d=json.loads(Path('qa/v171o-bot-security/v171o-v1717-source-snapshot.json').read_text())
          assert d['publishedMessenger']['activeVersionId']=='1064b1b3-d3f1-4a6b-a367-2414ba691522'
          assert len(d['publishedMessenger']['publishedNodeNamesV1715'])==4
          qa=d['shadow']
          assert qa['workflowId']=='2cBUCxHzFxvQX5Ix'
          assert qa['versionId']=='af68bb64-ec76-473a-919c-bde2ae728212'
          assert qa['active'] is False and qa['activeVersionId'] is None
          assert qa['callerPolicy']=='none' and qa['noCredentials']
          assert qa['expectedTotal']==132 and qa['expectedPassed']==132
          assert qa['expectedDenied']==124 and qa['expectedReadPlans']==8
          assert qa['semanticMisroutesDetected']==2
          src=d['publishedMessenger']['sourceNodeJsCode']
          prefix=src[:src.index('const result=classify(')]
          assert qa['stages'][1]['jsCode'].startswith(prefix)
          assert len(qa['nodeTypes'])==5
          assert {n['type'] for n in qa['nodeTypes']}=={'n8n-nodes-base.manualTrigger','n8n-nodes-base.code'}
          for n in qa['stages']:
            for bad in (r'\bfetch\s*\(',r'\bprocess\.env\b',
              r'\bhttps?\.request\s*\(',r'\baxios\b',r'\bchild_process\b',
              r'\bservice_role\b'):
              assert not re.search(bad,n['jsCode'],re.I),(n['name'],bad)
          assert d['liveWorkflowEditedByThisMilestone'] is False
          assert d['release']=='HOSTED_NO_GO'
          print('V171O_PUBLISHED_SOURCE_EXACT_COPY_NO_SEND_NO_DB_NO_MODEL_PASS')
          PY
  disposable-postgres17-rls:
    name: V17.1O independent PG17 same-Tenant A B RLS fixture rerun
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa_disposable_only_pass
          POSTGRES_DB: tien404_qa_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tien404_qa_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: 'Install postgres disposable QA client'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: 'Create only local QA authenticated role, no live users or JWTs'
        env:
          PGPASSWORD: qa_disposable_only_pass
        run: psql -h localhost -U postgres -d tien404_qa_disposable -X -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN;"
      - name: 'Re-run verified Store A/B temporary table RLS and ROLLBACK'
        env:
          PGPASSWORD: qa_disposable_only_pass
        run: |
          psql -h localhost -U postgres -d tien404_qa_disposable -X -v ON_ERROR_STOP=1 -f qa/v171n-bot-security/disposable_pg17_store_rls_rollback.sql
          test "$(psql -h localhost -U postgres -d tien404_qa_disposable -X -At -c "SELECT count(*) FROM pg_catalog.pg_class WHERE relname='t404_v171n_disposable_store_rls'")" = "0"
          echo "V171O_DISPOSABLE_PG17_RLS_PASS_NO_REAL_JWT"
  independent-real-provider-ownership-gate:
    name: V17.1O real Meta Zalo provider + Auth JWT store owner + Published guard NO GO
    needs: [exact-published-source-qa,disposable-postgres17-rls]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 'Fail-closed real native provider, store JWT and commerce tool authority'
        run: |
          echo "::error::V171O_HOSTED_NO_GO_REQUIRES_PROVIDER_SIGNED_QA_OWNER_AUTHENTICATED_JWT_STORE_A_B_COMMERCE_TOOL_GATE"
          exit 3

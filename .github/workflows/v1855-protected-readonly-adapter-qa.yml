name: TIEN404 V18.5.5 — Protected Read-Only Commerce Adapter QA
on:
  push:
    branches:
      - work/v1855-protected-readonly-commerce-adapter-20261118
    paths:
      - 'qa/channel-v1855/**'
      - 'qa/channel-v1854/cloudflare-access-context-gate.mjs'
      - 'qa/channel-v1854/cloudflare-access-context-gate.test.mjs'
      - '.github/workflows/v1855-protected-readonly-adapter-qa.yml'
      - 'docs/ai-handoff/T404_V1855_*'
  pull_request:
    paths:
      - 'qa/channel-v1855/**'
      - 'qa/channel-v1854/cloudflare-access-context-gate.mjs'
      - 'qa/channel-v1854/cloudflare-access-context-gate.test.mjs'
      - '.github/workflows/v1855-protected-readonly-adapter-qa.yml'
      - 'docs/ai-handoff/T404_V1855_*'
permissions:
  contents: read
jobs:
  protected-readonly-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax check Worker candidate and tests
        run: |
          node --check qa/channel-v1854/cloudflare-access-context-gate.mjs
          node --check qa/channel-v1855/worker-v1855-readonly-adapter-candidate.mjs
          node --check qa/channel-v1855/worker-v1855-readonly-adapter.test.mjs
          node --check qa/channel-v1855/read-admission-policy.mjs
          node --check qa/channel-v1855/t404-read-admission-do.mjs
          node --check qa/channel-v1855/worker-v1855-hosted-entry.mjs
          node --check qa/channel-v1855/read-admission-policy.test.mjs
          node --check qa/channel-v1855/t404-read-admission-do.test.mjs
          node --check qa/channel-v1855/isolated-do-owner-candidate.mjs
      - name: Run inherited security regression and V18.5.5 Worker tests
        run: |
          node --test \
            qa/channel-v1854/cloudflare-access-context-gate.test.mjs \
            qa/channel-v1853/access-jwt-verifier.test.cjs \
            qa/channel-v1852/published-core-readonly-admission.test.cjs \
            qa/channel-v1851/protected-http-gateway.test.cjs \
            qa/channel-v185/shared-core-bridge.test.cjs \
            qa/channel-v144/secure-widget-preview.test.mjs \
            qa/channel-v143/channel-core.test.mjs \
            qa/channel-v1855/worker-v1855-readonly-adapter.test.mjs \
            qa/channel-v1855/read-admission-policy.test.mjs \
            qa/channel-v1855/t404-read-admission-do.test.mjs \
            qa/channel-v1855/n8n/ingress-contract-offline.test.cjs
      - name: Verify actual n8n adapter evidence and release gates
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const e = JSON.parse(fs.readFileSync('qa/channel-v1855/n8n-adapter-qa-evidence.json', 'utf8'));
          const worker = fs.readFileSync('qa/channel-v1855/worker-v1855-readonly-adapter-candidate.mjs', 'utf8');
          const adapter = fs.readFileSync('qa/channel-v1855/n8n/protected-readonly-commerce-adapter.workflow.js', 'utf8');
          const qa = fs.readFileSync('qa/channel-v1855/n8n/protected-readonly-adapter-qa.workflow.js', 'utf8');
          assert.equal(e.status, 'INTERNAL_READONLY_ADAPTER_AND_HEADER_AUTH_INGRESS_IMPLEMENTED_PIN_QA_5_OF_5_NO_HOSTED_WEBHOOK');
          assert.equal(e.n8n.adapter.active, false);
          assert.equal(e.n8n.adapter.published, false);
          assert.equal(e.n8n.adapter.webhookTrigger, false);
          assert.equal(e.n8n.adapter.credentials, 0);
          assert.equal(e.n8n.adapter.aiAgent, false);
          assert.equal(e.n8n.adapter.callerPolicy, 'workflowsFromAList');
          assert.deepEqual(e.n8n.adapter.allowedCallerIds, [e.n8n.qa.workflowId, e.n8n.ingress.workflowId]);
          assert.equal(e.n8n.qa.active, false);
          assert.equal(e.n8n.qa.published, false);
          assert.equal(e.n8n.qa.executionId, '5360');
          assert.equal(e.n8n.qa.status, 'success');
          assert.equal(e.n8n.qa.assertions, 12);
          assert.equal(e.n8n.qa.passed, 12);
          assert.equal(e.n8n.qa.failed, 0);
          assert.equal(e.n8n.publishedChildren.length, 3);
          assert(e.n8n.publishedChildren.every(x => ['success','invoked_successfully_by_catalog_and_cart'].includes(x.status) && x.storageOperation === 'DataTable row.get'));
          assert.equal(e.n8n.sideEffects.orderWrites, 0);
          assert.equal(e.n8n.sideEffects.stockWrites, 0);
          assert.equal(e.n8n.sideEffects.providerSends, 0);
          assert.equal(e.n8n.sideEffects.customerOrderReads, 0);
          assert.equal(e.n8n.sideEffects.customerPiiReads, 0);
          assert.equal(e.n8n.sideEffects.aiCalls, 0);
          assert(e.n8n.cases.length === 12 && e.n8n.cases.every(x => x.pass === true));
          assert.equal(e.n8n.authorityLimitations.storeLevelRls, 'NOT_VERIFIED');
          assert.equal(e.n8n.ingress.workflowId, 'JZL4p8tLb65eU3aB');
          assert.equal(e.n8n.ingress.active, false);
          assert.equal(e.n8n.ingress.published, false);
          assert.equal(e.n8n.ingress.webhook.authentication, 'headerAuth');
          assert.equal(e.n8n.ingress.webhook.credentialId, 'IS2XrqEFUDv7aGsh');
          assert.equal(e.n8n.ingress.webhook.secretValueInspected, false);
          assert.equal(e.n8n.ingress.settings.saveDataSuccessExecution, 'none');
          assert.equal(e.n8n.ingress.settings.saveDataErrorExecution, 'none');
          assert.equal(e.n8n.ingress.pinTests.passed, 5);
          assert.equal(e.n8n.ingress.pinTests.httpHeaderAuthRealNetworkTested, false);
          assert.equal(e.worker.deployed, false);
          assert.equal(e.worker.exactUpstreamPath, '/webhook/t404-v1855-protected-readonly-commerce-staging');
          assert.equal(e.worker.requiredDurableAdmissionBinding, 'T404_READ_ADMISSION');
          assert.equal(e.worker.ratePolicy.sourceOnly, true);
          assert.equal(e.worker.ratePolicy.namespaceCreated, false);
          assert.equal(e.worker.ratePolicy.bindingConfigured, false);
          assert.equal(e.worker.ratePolicy.deployed, false);
          assert.equal(e.worker.ratePolicy.limitPer60SecondsPerSandboxInstallation, 20);
          assert.equal(e.securityGates.costApprovalReceived, false);
          assert.equal(e.securityGates.cloudflareDeploymentApproved, false);
          assert.equal(e.securityGates.exactUpstreamWebhookPathLockedInSource, true);
          assert.equal(e.worker.newBindingsCreated, 0);
          assert.equal(e.worker.n8nWebhookConfigured, false);
          assert.equal(e.worker.secretsSet, false);
          assert.equal(e.securityGates.secondIdentityDenial, 'PENDING_FROM_V18.5.4');
          assert.equal(e.securityGates.productionRelease, false);
          const migration=JSON.parse(fs.readFileSync('qa/channel-v1855/isolated-do-provisioning-gate.json','utf8'));
          const ownerCode=fs.readFileSync('qa/channel-v1855/isolated-do-owner-candidate.mjs','utf8');
          assert.equal(migration.approvalInterpretation.result,'BLOCKED_NO_CLOUD_DEPLOY_ALLOWED');
          assert.equal(migration.proposedOwnerWorker.status,'NOT_CREATED');
          assert.equal(migration.proposedOwnerWorker.publicRoute,'NONE');
          assert.equal(migration.proposedOwnerWorker.workersDev,'DISABLED');
          assert.equal(migration.proposedOwnerWorker.previewUrls,'DISABLED');
          assert.equal(migration.verifiedAccount.noCostAssurance,false);
          assert.equal(migration.localWorkerdQa.actualCloudflareAccountResourcesCreated,0);
          assert(ownerCode.includes("export { T404ReadAdmission }"));
          assert(ownerCode.includes("status: 404"));
          assert(!ownerCode.includes('fetch('+'\'https://'));

          assert(worker.includes('verifyPrivateAccess(ctx, env)'));
          assert(worker.includes("const N8N_HOST = 'ngoctien20.app.n8n.cloud'"));
          assert(worker.includes("const N8N_READ_PATH = '/webhook/t404-v1855-protected-readonly-commerce-staging'"));
          assert(worker.includes('READ_ADMISSION_NOT_CONFIGURED'));
          assert(worker.includes('stub.authorizeRead('));
          const dos=fs.readFileSync('qa/channel-v1855/t404-read-admission-do.mjs','utf8');
          assert(dos.includes('transactionSync('));
          assert(dos.includes("this.ctx.id?.name !== ('t404-v1855:' + input?.installationId)"));
          assert(dos.includes('ADMISSION_STATE_CORRUPTED'));
          assert(!dos.includes('async fetch('));
          assert(dos.includes("this.ctx.id?.name !== ('t404-v1855:' + input?.installationId)"));
          assert(worker.includes("'x-t404-adapter-token'"));
          assert(worker.includes("['catalog.search', 'cart.preview']"));
          assert(!worker.includes('Access-Control-Allow-Origin'));
          assert(adapter.includes('oOOXicKXGkBskKqh'));
          assert(adapter.includes('igPOsSbEgd4NgtRA'));
          assert(adapter.includes('caller_authority_fields_forbidden'));
          assert(qa.includes('order.read'));
          assert(qa.includes('order.create'));
          console.log('V1855_REAL_N8N_READONLY_UAT_12_OF_12_PASS_WORKER_CANDIDATE_NOT_DEPLOYED');
          JS
      - name: Production and public Widget remain disabled
        run: echo 'INACTIVE HEADER-AUTH WEBHOOK DRAFT ONLY. Dedicated credential linked, secret not retrieved. No published webhook, no Worker binding/deployment, no Store RLS claim, no order/stock writes, no customer order/PII reads, no provider sends, no production.'

  offline-workerd-sqlite:
    name: SQLite Durable Object in isolated workerd (NO CLOUD DEPLOY)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Cloudflare Workers Vitest integration
        working-directory: qa/channel-v1855/runtime-qa
        run: yarn install --no-lockfile --non-interactive
      - name: Exercise SQLite Durable Object in actual workerd runtime, offline
        working-directory: qa/channel-v1855/runtime-qa
        run: yarn test
      - name: Confirm no Cloudflare deployment performed
        run: echo 'WORKERD_LOCAL_QA_ONLY. No API token, no namespace, no binding, no deployed Worker, no secrets, no n8n traffic.'

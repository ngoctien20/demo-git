name: TIEN404 V18.7 Industry Offline Contract QA
on:
  push:
    branches: ['work/v1876-protected-admission-offline']
  pull_request:
    branches: [gh-pages, 'work/v187-industry-profiles-contract-staging']
    paths:
      - 'experiments/v18-7-industry/**'
      - '.github/workflows/v187-industry-offline-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-node-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: No-provider / no-network Industry QA
        run: node --test experiments/v18-7-industry/tests/*.test.cjs

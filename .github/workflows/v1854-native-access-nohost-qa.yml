          assert(e.n8n.cases.length===12&&e.n8n.cases.every(x=>x.pass===true));
          assert.equal(e.n8n.sideEffects.orderWrites,0);
          assert.equal(e.n8n.sideEffects.stockWrites,0);
          assert.equal(e.n8n.sideEffects.providerSends,0);
          assert.equal(e.n8n.sideEffects.customerOrderReads,0);

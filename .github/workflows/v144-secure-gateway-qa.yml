name: TIEN404 V14.4 Secure Widget + Unified Channel Gates (OFFLINE NO SEND)
on:
  push:
    branches:
      - work/v144-secure-gateway-release-preflight-20261115
    paths:
      - 'qa/channel-v144/**'
      - '.github/workflows/v144-secure-gateway-qa.yml'
  pull_request:
    paths:
      - 'qa/channel-v144/**'
      - '.github/workflows/v144-secure-gateway-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New source contract syntax and 35 security negative/positive cases
        run: |
          node --check qa/channel-v144/secure-widget-preview.cjs
          node --check qa/channel-v144/secure-widget-preview.test.cjs
          node --test qa/channel-v144/secure-widget-preview.test.cjs
      - name: Existing V14.3 shared channel core / widget / renderer regression
        run: |
          node --test qa/channel-v143/channel-core.test.cjs
      - name: Inherited canonical Messenger rich UI replay regressions
        run: |
          find qa/messenger-rich-v136m* -name '*.test.cjs' ! -name 'preview.test.cjs' -print0 | xargs -0 -r node --test
      - name: Confirm V14.4 cannot dispatch, create HTTP server or use credentials
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const c=fs.readFileSync('qa/channel-v144/secure-widget-preview.cjs','utf8');
          const dangerous=[
            /require\(['"](?:http|https|net|pg|postgres|axios)['"]\)/,
            /\bfetch\s*\(/,
            /\blisten\s*\(/,
            /process\.env\.[A-Z0-9_]*(?:TOKEN|KEY|SECRET|PASSWORD)/,
            /(?:PAGE_ACCESS_TOKEN|SUPABASE_SERVICE_ROLE_KEY)\s*=/,
          ];
          if(dangerous.some(re=>re.test(c)))throw Error('UNSAFE_V14_4_SOURCE');
          if(!c.includes('OFFLINE_SYNTHETIC_QA')||!c.includes('previewOnly:true'))
            throw Error('V14_4_GATE_MUST_REMAIN_OFFLINE');
          console.log('PASS — V14.4 adapter remains source-only, no network/credential/provider send');
          JS
  widget-browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA-only Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Run inherited V14.3 six synthetic browser integration scenarios
        run: |
          python3 -m http.server 8080 >/tmp/v144-http.log 2>&1 &
          sleep 2
          node qa/channel-v143/browser.test.cjs
      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tien404-v144-widget-browser-synthetic-only
          path: qa-artifacts-v143/
          if-no-files-found: ignore

name: TIEN404 V19.0-B7 - Protected Local Canary and PostgreSQL17 Store RLS QA

on:
  push:
    branches:
      - qa/v19-b7-protected-canary-store-rls-rehearsal-20261118
    paths:
      - qa/v19-webhook/**
      - .github/workflows/v19-b7-protected-canary-pg17-rls-offline-qa.yml
  pull_request:
    paths:
      - qa/v19-webhook/**
      - .github/workflows/v19-b7-protected-canary-pg17-rls-offline-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b7-synthetic-qa:
    name: B7 isolated workerd D1 and disposable PG17 RLS, never hosted
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CI: "true"
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: b7_disposable
      PGUSER: postgres
      PGPASSWORD: b7-only-disposable-synthetic
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: b7_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: b7-only-disposable-synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d b7_disposable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Checkout source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve exact deployed B2 source
        run: |
          test "$(git hash-object qa/v19-webhook/source-snapshot/v1723u-worker-deployed.mjs)" = "11affa7658b46ae7c411eed7877d7ccdce61bbad"
      - name: B7 source syntax
        run: |
          node --check qa/v19-webhook/b7/protected-private-canary.mjs
          node --check qa/v19-webhook/b7/tests/local-private-canary-worker.mjs
          node --check qa/v19-webhook/b7/tests/protected-private-canary.test.mjs
      - name: Miniflare pinned local-only runtime
        run: |
          npm install --no-save --no-audit --no-fund --prefix qa/v19-webhook/b7/tests miniflare@3.20250718.3
          node -p "require('./qa/v19-webhook/b7/tests/node_modules/miniflare/package.json').version"
      - name: B7 local workerd/private service caller D1 tests
        run: node --test qa/v19-webhook/b7/tests/protected-private-canary.test.mjs
      - name: B7 disposable PostgreSQL 17 restrictive RLS regression
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -f qa/v19-webhook/b7/tests/pg17_store_rls_rehearsal.sql
      - name: B6 encrypted recovery and Store preflight regressions
        run: |
          npm install --no-save --no-audit --no-fund --prefix qa/v19-webhook/b6/tests miniflare@3.20250718.3
          node --test qa/v19-webhook/b6/tests/recoverable-inbox-binding.test.mjs
      - name: B5 local Worker Binding regressions
        run: |
          npm install --no-save --no-audit --no-fund --prefix qa/v19-webhook/b5/tests miniflare@3.20250718.3
          node --test qa/v19-webhook/b5/tests/miniflare-d1-binding.test.mjs
          python3 qa/v19-webhook/b5/tests/inbox_sqlite_contract_test.py
      - name: B4 registry regressions
        run: |
          node --test qa/v19-webhook/b4/tests/trusted-installation-gate.test.mjs
          python3 qa/v19-webhook/b4/tests/registry_sqlite_contract_test.py
      - name: B3 body, rate and replay regressions
        run: |
          node --test qa/v19-webhook/b3/tests/ingress-candidate.test.mjs
          python3 qa/v19-webhook/b3/tests/sqlite_semantics_test.py
      - name: B2 source snapshot regression
        run: node --test qa/v19-webhook/tests/*.test.mjs
      - name: Block hosted deploy and any published webhook integration
        run: |
          test ! -e qa/v19-webhook/b7/.env
          test ! -e qa/v19-webhook/b7/wrangler.toml
          test ! -e qa/v19-webhook/b7/wrangler.jsonc
          grep -q "status:423" qa/v19-webhook/b7/protected-private-canary.mjs
          echo "All tests isolated in GitHub Actions. No Cloudflare hosted Worker, D1 or real Supabase changed."

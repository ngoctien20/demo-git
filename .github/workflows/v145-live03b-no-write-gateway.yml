name: TIEN404 V14.5 LIVE03B Trusted No-Write Gateway QA
on:
  push:
    branches:
      - work/v145-live03b-trusted-no-write-dispatch-gate-20261116
    paths:
      - 'qa/messenger-live03b/**'
      - 'docs/ai-handoff/V14_5_LIVE03B_*'
      - '.github/workflows/v145-live03b-no-write-gateway.yml'
  pull_request:
    paths:
      - 'qa/messenger-live03b/**'
      - 'docs/ai-handoff/V14_5_LIVE03B_*'
      - '.github/workflows/v145-live03b-no-write-gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-gateway:
    name: Verify 63 signed, scoped and no-write tool dispatcher scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and tests
        run: |
          node --check qa/messenger-live03b/write-denial-gateway.cjs
          node --check qa/messenger-live03b/write-denial-gateway.test.cjs
      - name: Run LIVE03B deterministic write-denial acceptance suite
        run: node --test qa/messenger-live03b/write-denial-gateway.test.cjs
      - name: Run 9 exact-source n8n manual QA contract checks
        run: node --test qa/messenger-live03b/live03b-n8n-manual-lab.test.cjs
      - name: Guard against external write, provider send and real token access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('qa/messenger-live03b/write-denial-gateway.cjs').read_text()
          for literal in ('axios(', 'fetch(', 'process.env.', 'graph.facebook.com',
                          '.app.n8n.cloud/', 'pg.connect(', 'createClient(',
                          'executeWorkflow(', 'googleSheets.append('):
              assert literal not in src, 'Forbidden external integration: '+literal
          assert 'require(' in src and "trusted-webhook-qa.cjs" in src
          assert "'OFFLINE_NO_WRITE_QA'" in src
          assert "providerSends:0" in src
          assert "actualOrderWrites:0" in src
          print('PASS: no external transport, database writes or real credentials')
          PY
  regression:
    name: Messenger LIVE03/14.5 previously accepted offline regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Previous LIVE03 dry-run, trusted raw HMAC and four-flow tests
        run: |
          node --test qa/messenger-live03/live03-dryrun-source.test.cjs
          node --test qa/messenger-live-gate-v145/trusted-webhook-qa.test.cjs
          node --test qa/messenger-sales-v1448/messenger-four-flow-offline.test.cjs

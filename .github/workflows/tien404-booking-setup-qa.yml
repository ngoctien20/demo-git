name: "TIEN404 Booking + Setup draft (offline)"
on:
  pull_request:
    paths:
      - "booking/**"
      - "setup/**"
      - ".github/workflows/tien404-booking-setup-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refuse hosted credentials
        run: test -z "${ANTHROPIC_API_KEY:-}${N8N_API_KEY:-}${META_PAGE_ACCESS_TOKEN:-}${ZALO_BOT_TOKEN:-}${CLOUDFLARE_API_TOKEN:-}"
      - name: Offline tests (no network, no keys)
        run: node --test booking/test/*.test.mjs setup/test/*.test.mjs
      - name: Generated n8n nodes have no network primitives
        run: |
          for n in validate payment reminders; do
            node booking/n8n/build-nodes.mjs $n > /tmp/$n.js
            if grep -Eq 'httpRequest|fetch[(]|require[(]|process[.]' /tmp/$n.js; then echo "network primitive in $n"; exit 1; fi
          done
      - name: Worker bundle builds with the pinned SDK
        working-directory: setup
        run: npm ci --no-audit --no-fund && npm run bundle

name: TIEN404 V17.22 Messenger-Zalo Order Ownership QA NO SEND
on:
  pull_request:
    paths:
      - 'qa/v1722-cross-channel-order/**'
      - '.github/workflows/v1722-cross-channel-commerce-ownership-nosend.yml'
permissions:
  contents: read
jobs:
  cross-channel-owner-gate:
    name: Dual-channel OTP, Store Isolation, Order Access and Replay (NO SEND)
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Node contract and security acceptance
        run: |
          node --check qa/v1722-cross-channel-order/cross-channel-qa-core.mjs
          node --check qa/v1722-cross-channel-order/cross-channel-qa-core.test.mjs
          node --test qa/v1722-cross-channel-order/cross-channel-qa-core.test.mjs
      - name: No provider send, no Commerce write, no external secret/static gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('qa/v1722-cross-channel-order/cross-channel-qa-core.mjs').read_text()
          assert 'SYNTHETIC_LOCAL_NO_SEND_NO_COMMERCE_WRITES' in src
          assert 'PROVIDER_SEND_DISABLED' in src
          assert 'COMMERCE_WRITE_DISABLED' in src
          assert 'NATIVE_PROVIDER_AUTH_REQUIRED' in src
          assert 'createHmac' in src and 'timingSafeEqual' in src
          for p in [r'\bfetch\s*\(',r'\bprocess\.env\b',r'\bXMLHttpRequest\b',r'\baxios\b',
                    r'\bhttp\.request\s*\(',r'\bconsole\.log\s*\(',r'(?i)sk-[a-z0-9_-]{16,}']:
            assert not re.search(p,src),p
          print('SOURCE ONLY: mock signed providers and in-memory QA Commerce; NO LIVE SEND/ORDER.')
          PY
  live-provider-order-cutover:
    name: Live Messenger and Zalo bot opt-in integration / Commerce write — REQUIRE OWNER APPROVAL
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Disabled until real Store A/B auth, native provider, two-person UAT and independent QA gate'

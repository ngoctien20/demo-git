name: TIEN404 V11 · independent public staging health (read-only)
on:
  workflow_dispatch:
  push:
    branches: [docs/v11-continuation-verification-20261112]
    paths:
      - 'qa/staging/verify_v11_public_health.py'
      - 'qa/staging/tests/**'
      - '.github/workflows/v11-public-staging-health.yml'
  pull_request:
    branches: [docs/cto-coordination-v2]
    paths:
      - 'qa/staging/verify_v11_public_health.py'
      - 'qa/staging/tests/**'
      - '.github/workflows/v11-public-staging-health.yml'
permissions:
  contents: read
jobs:
  public-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixture unit tests (no network)
        run: python -m unittest discover -s qa/staging/tests -p 'test_v11_public_health.py' -v
      - name: Live read-only canonical websites and Render anonymous security boundary
        run: python qa/staging/verify_v11_public_health.py

name: TIEN404 V18.7.6C-M Messenger Webhook Inspector Offline QA
on:
  push:
    branches:
      - work/v1876cm-messenger-event-inspector-no-send
  pull_request:
    branches:
      - work/v1876b-rpc-dryrun-owner-ab-staging
    paths:
      - 'experiments/v1876cm-meta-inspector/**'
      - '.github/workflows/v1876cm-messenger-inspector-offline-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only-no-send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Offline Meta signed event classification regression
        run: node --test experiments/v1876cm-meta-inspector/tests/*.test.cjs

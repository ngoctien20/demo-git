name: Shop-owned bot sandbox
on:
  push:
    branches: [work/v12-r1-shop-owned]
    paths:
      - 'qa/shop_owned/**'
      - 'qa/notification/format_alert.py'
      - '.github/workflows/v12-r1-shop-owned.yml'
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B -m unittest -v test_shop
        working-directory: qa/shop_owned

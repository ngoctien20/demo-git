name: TIEN404 V19.0-B3 - Webhook Timeout Scoped Dedupe Rate Offline QA

on:
  push:
    branches:
      - qa/v19-b3-bounded-replay-rate-limit-20261118
    paths:
      - qa/v19-webhook/**
      - .github/workflows/v19-b3-worker-offline-qa.yml
  pull_request:
    paths:
      - qa/v19-webhook/**
      - .github/workflows/v19-b3-worker-offline-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b3-offline-qa:
    name: B3 Synthetic Node and Native SQLite concurrency (NO HOST)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve verified Cloudflare B2 snapshot
        run: |
          actual="$(git hash-object qa/v19-webhook/source-snapshot/v1723u-worker-deployed.mjs)"
          expected="11affa7658b46ae7c411eed7877d7ccdce61bbad"
          test "$actual" = "$expected"
          echo "Source snapshot immutable: $actual"
      - name: Candidate syntax
        run: |
          node --check qa/v19-webhook/b3/ingress-candidate.mjs
          node --check qa/v19-webhook/b3/tests/ingress-candidate.test.mjs
      - name: B3 offline Node synthetic ingress, timeout and dedupe
        run: node --test qa/v19-webhook/b3/tests/ingress-candidate.test.mjs
      - name: SQLite D1 SQL contract offline concurrency
        run: python3 qa/v19-webhook/b3/tests/sqlite_semantics_test.py
      - name: Full B2 regression
        run: node --test qa/v19-webhook/tests/*.test.mjs
      - name: Source-only release guard
        run: |
          test ! -e qa/v19-webhook/b3/.env
          test ! -e qa/v19-webhook/b3/wrangler.toml
          test ! -e qa/v19-webhook/b3/wrangler.jsonc
          grep -q "return response(423)" qa/v19-webhook/b3/ingress-candidate.mjs
          echo "No remote D1 query, no webhook registration, no provider calls, no production deployment"

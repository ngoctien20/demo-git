name: TIEN404 V16.9 Owner Proof and Private Intake Synthetic QA (NO SEND)
on:
  push:
    branches:
      - work/v169-owner-proof-private-intake-nosend-20261116
  pull_request:
    paths:
      - 'qa/v169-security/**'
      - 'qa/v1610-disposable/**'
      - 'qa/v1611-hosted-gates/**'
      - 'qa/v1611p-private/**'
      - 'qa/v1611p1-operator/**'
      - 'qa/v1611p2-authority/**'
      - 'docs/ai-handoff/V16_11P2_*'
      - 'docs/ai-handoff/V16_11P1_*'
      - 'docs/ai-handoff/V16_11P_*'
      - 'docs/ai-handoff/V16_11_*'
      - 'docs/ai-handoff/V16_10_*'
      - 'docs/ai-handoff/V16_9_*'
      - '.github/workflows/v169-onboarding-security-nosend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-security:
    name: 590 V16.11P.2A scoped-app archive quote and inherited Node QA (NO SEND)
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check source and browser files
        run: |
          node --check qa/v169-security/owner-evidence.mjs
          node --check qa/v169-security/private-import-readiness.mjs
          node --check qa/v169-security/readiness-ui.mjs
          node --check qa/v169-security/browser.test.cjs
          node --check qa/v169-security/v169-security.test.mjs
      - name: V16.11P.2 source and browser syntax
        run: |
          node --check qa/v1611p2-authority/approval-gate.mjs
          node --check qa/v1611p2-authority/approval-gate.test.mjs
          node --check qa/v1611p2-authority/operator-ui.mjs
          node --check qa/v1611p2-authority/browser.test.cjs
      - name: V16.11P.2A selected application-only backup scope and quoted Free plan guards (18)
        run: node --test qa/v1611p2-authority/app-scope-and-quote-receipt.test.mjs
      - name: V16.11P.2 fifty confidential assignment, cost quote and one-action gate tests
        run: node --test qa/v1611p2-authority/approval-gate.test.mjs
      - name: V16.11P.2 source-only, quote not queried, no secret, no hosted change
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          base=Path('qa/v1611p2-authority')
          d=json.loads(Path('docs/ai-handoff/V16_11P2_CONFIDENTIAL_QUOTE_ONE_ACTION_PACKET.json').read_text())
          assert d['release_decision']=='NO_GO'
          assert d['one_action']['organization_confirmation']=='PENDING_USER_CONFIRMATION'
          assert d['one_action']['actual_provider_query_status']=='NOT_RUN'
          assert d['one_action']['new_project_create'] is False
          assert d['one_action']['branch_create'] is False
          assert d['one_action']['hosted_backup'] is False
          assert d['one_action']['hosted_restore'] is False
          assert d['one_action']['payment_authorized'] is False
          assert d['written_authorization']['status']=='DRAFT_UNSIGNED'
          assert len(d['confidential_operator_roles'])==6
          assert all(x['private_signed_attestation_locator'] is None for x in d['confidential_operator_roles'])
          assert len(d['account_specific_quotes'])==2
          assert all(x['get_cost_called'] is False and x['provider_cost'] is None for x in d['account_specific_quotes'])
          assert len(re.findall(r"test\('",(base/'approval-gate.test.mjs').read_text()))==50
          html=(base/'index.html').read_text()
          assert "connect-src 'none'" in html and "script-src 'self'" in html
          for path in [base/'approval-gate.mjs',base/'operator-ui.mjs']:
            t=path.read_text()
            for pattern in [r'\bfetch\s*\(',r'\bXMLHttpRequest\b',r'\blocalStorage\b',
              r'\bsessionStorage\b',r'\bprocess\.env\b',r'\bcreateClient\s*\(',
              r'graph\.facebook\.com',r'api\.openai\.com']:
              assert not re.search(pattern,t),(path,pattern)
          print('V16.11P.2 PUBLIC PROOF ABSENT / ORG NOT CONFIRMED / NO PRICE API / NO HOSTED ACTION: PASS')
          PY
      - name: V16.11P.1 source/QA/UI syntax
        run: |
          node --check qa/v1611p1-operator/quote-gate.mjs
          node --check qa/v1611p1-operator/quote-gate.test.mjs
          node --check qa/v1611p1-operator/quote-ui.mjs
          node --check qa/v1611p1-operator/browser.test.cjs
      - name: V16.11P.1 62 operator assignment / quote-only / unsigned approval tests
        run: node --test qa/v1611p1-operator/quote-gate.test.mjs
      - name: V16.11P.1 no-cost no-hosted source boundary and unsigned approval
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('qa/v1611p1-operator')
          packet=json.loads(Path('docs/ai-handoff/V16_11P1_OPERATOR_ASSIGNMENT_QUOTE_ONLY_PACKET.json').read_text())
          assert packet['release_decision']=='NO_GO'
          assert packet['real_evidence_count']==0
          assert packet['quote_basis']['current_org_specific_quote'] is None
          assert packet['approval_scope']['signed_written_permission'] is False
          assert packet['approval_scope']['create_paid_resource'] is False
          assert packet['approval_scope']['execute_backup_hosted'] is False
          assert packet['approval_scope']['execute_restore_hosted'] is False
          assert packet['approval_scope']['use_real_merchant_data'] is False
          assert all(x['real_actor_id'] is None and x['private_attestation_ref'] is None
                     for x in packet['actor_assignments'])
          assert len(re.findall(r"test\('",(root/'quote-gate.test.mjs').read_text()))==62
          html=(root/'index.html').read_text()
          assert "connect-src 'none'" in html and "script-src 'self'" in html
          for path in (root/'quote-gate.mjs',root/'quote-ui.mjs'):
            text=path.read_text()
            for banned in [r'\bfetch\s*\(',r'\bXMLHttpRequest\b',r'\bprocess\.env\b',
                           r'\blocalStorage\b',r'\bsessionStorage\b',r'\bcreateClient\s*\(',
                           r'graph\.facebook\.com',r'api\.openai\.com']:
              assert not re.search(banned,text),(path,banned)
          print('V16.11P1 SOURCE-ONLY QUOTE REFERENCE / ALL REAL OPERATOR APPROVALS MISSING: PASS')
          PY
      - name: Syntax check V16.11P request and browser fixture
        run: |
          node --check qa/v1611p-private/operator-intake.mjs
          node --check qa/v1611p-private/operator-intake.test.mjs
          node --check qa/v1611p-private/operator-ui.mjs
          node --check qa/v1611p-private/browser.test.cjs
      - name: V16.11P 68 new private request / recovery gate tests
        run: node --test qa/v1611p-private/operator-intake.test.mjs
      - name: V16.11P NO REAL HOSTED AUTH / NO BILLING / NO PRIVATE PROOF gate
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('qa/v1611p-private')
          packet=json.loads(Path('docs/ai-handoff/V16_11P_PRIVATE_OPERATOR_REQUEST_PACKET.json').read_text())
          source=(root/'operator-intake.mjs').read_text()
          ui=(root/'operator-ui.mjs').read_text()
          test=(root/'operator-intake.test.mjs').read_text()
          html=(root/'index.html').read_text()
          assert packet['release']=='NO_GO'
          assert len(packet['evidence_specs'])==18 and len(packet['action_requests'])==9
          assert packet['budget']['quote_received'] is False
          assert packet['budget']['payment_incurred'] is False
          assert packet['budget']['user_approved_max_vnd'] is None
          assert all(v is False for v in packet['approvals'].values())
          assert all(x['state'] in ('NOT_AUTHORIZED','DO_NOT_APPLY') for x in packet['action_requests'])
          assert len(re.findall(r"test\('",test))==68
          assert "connect-src 'none'" in html and "script-src 'self'" in html
          for f in (source,ui):
            for p in [r'\bfetch\s*\(',r'\bXMLHttpRequest\b',r'\blocalStorage\b',
                      r'\bsessionStorage\b',r'\bprocess\.env\b',r'\bcreateClient\s*\(',
                      r'graph\.facebook\.com',r'api\.openai\.com']:
              assert not re.search(p,f),p
          assert not list(root.glob('wrangler.*'))
          print('V16.11P SOURCE-ONLY / PRIVATE EVIDENCE MISSING / NO AUTH / NO HOSTED RESTORE / NO SEND: PASS')
          PY
      - name: V16.11 new private hosted authority / recovery acceptance contract tests (58)
        run: node --test qa/v1611-hosted-gates/v1611-gate.test.mjs
      - name: V16.11 source-only no-secrets / verified baseline / NOT-AUTHORIZED gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          d=json.loads(Path('docs/ai-handoff/V16_11_HOSTED_READ_ONLY_BASELINE.json').read_text())
          a=json.loads(Path('docs/ai-handoff/V16_11_PRIVATE_OPERATOR_APPROVAL_PACKET.json').read_text())
          js=Path('qa/v1611-hosted-gates/authority-gate.mjs').read_text()
          tests=Path('qa/v1611-hosted-gates/v1611-gate.test.mjs').read_text()
          sql=Path('docs/ai-handoff/V16_11_READ_ONLY_HOSTED_METADATA_QUERIES.sql').read_text()
          assert d['recommendation']=='NO_GO' and not d['hosted_sql_modified'] and not d['hosted_backup_created']
          assert not d['verified_schema']['stores'] and not d['verified_schema']['store_memberships']
          assert a['release_decision']=='NO_GO'
          assert not a['approval']['explicit_user_hosted_backup_approval']
          assert not a['approval']['cost_approved']
          assert not a['approval']['security_reviewer_signed']
          assert not a['approval']['merchant_owner_verified']
          assert len(re.findall(r"test\('",tests))==58
          assert 'BEGIN TRANSACTION READ ONLY;' in sql and 'ROLLBACK;' in sql
          noncomments='\n'.join(l for l in sql.splitlines() if not l.lstrip().startswith('--'))
          assert not re.search(r'\b(?:insert|update|delete|alter|drop|create|truncate|copy|grant|revoke)\b\s+(?:into|table|function|on|from)',noncomments,re.I)
          assert not any(re.search(p,js) for p in [
             r'\bfetch\s*\(',r'\bXMLHttpRequest\b',r'\bprocess\.env\b',r'\bcreateClient\s*\(',
             r'graph\.facebook\.com',r'api\.openai\.com',r'\bservice_role\s*='])
          print('V16.11 SECURITY SOURCE ONLY / NO REAL AUTH / NO HOSTED CHANGE / NO SEND: PASS')
          PY
      - name: V16.10 new source-only evidence preflight (24 cases)
        run: node --test qa/v1610-disposable/preflight.test.mjs
      - name: NEW 75 source-only ownership and private-intake security tests
        run: node --test qa/v169-security/v169-security.test.mjs
      - name: INHERITED V16.8 synthetic import/Hybrid tests
        run: node --test qa/v168-merchant/v168-merchant.test.mjs
      - name: INHERITED V16.7 Merchant Registry tests
        run: node --test qa/v167-merchant/merchant-registry.test.mjs
      - name: INHERITED V16.0/V16.1 Hybrid Core tests
        run: node --test qa/v16-hybrid/hybrid-core.test.mjs
      - name: INHERITED V16.3 Studios tests
        run: node --test qa/v163-studios/v163-studios.test.mjs
      - name: Source-only security boundary and no real data gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('qa/v169-security')
          assert len(re.findall(r"test\('",(root/'v169-security.test.mjs').read_text()))==75
          html=(root/'index.html').read_text()
          assert "connect-src 'none'" in html and "script-src 'self'" in html
          for name in ['owner-evidence.mjs','private-import-readiness.mjs','readiness-ui.mjs']:
            code=(root/name).read_text()
            for banned in [
              r'\bfetch\s*\(',r'\bXMLHttpRequest\b',r'\blocalStorage\b',
              r'\bsessionStorage\b',r'\bprocess\.env\b',r'\bcreateClient\s*\(',
              r'graph\.facebook\.com',r'api\.openai\.com',r'generativelanguage\.googleapis\.com',
              r'\bservice_role\s*=']:
              assert not re.search(banned,code),(name,banned)
          assert 'LIVE_CATALOG_COMMIT_FORBIDDEN' in (root/'private-import-readiness.mjs').read_text()
          assert 'HOSTED_IDENTITY_AND_INDEPENDENT_APPROVAL_REQUIRED' in (root/'owner-evidence.mjs').read_text()
          assert not list(root.glob('wrangler.*'))
          handoff=json.loads(Path('docs/ai-handoff/V16_9_PRIVATE_OWNER_OPERATOR_HANDOFF_TEMPLATE.json').read_text())
          assert handoff['final_release_status']=='NO_GO'
          assert len(handoff['evidence_request'])==9
          assert all(i['status']=='MISSING' and i['private_evidence_ref'] is None for i in handoff['evidence_request'])
          assert handoff['private_file_controls']['uploaded_bytes_allowed_now'] is False
          prior=Path('docs/ai-handoff/V16_8_STORE_JWT_RLS_MIGRATION_DO_NOT_APPLY.sql').read_text()
          assert all(not l.strip() or l.startswith('--') for l in prior.splitlines())
          print('V16.9 SOURCE ONLY / NO SQL / NO UPLOAD / NO TOKEN / NO SEND / NO PAID MODEL: PASS')
          PY
      - name: No keys and no real endpoints
        run: |
          if grep -RniE 'BEGIN PRIVATE KEY|sk-[A-Za-z0-9]{20}|Bearer [A-Za-z0-9]{20}' qa/v169-security; then
            echo "Potential secret detected"; exit 3
          fi
          echo "Synthetic metadata and fixed QA identities only. No externally-verified proof."
  browser-no-send:
    name: Chromium local Owner metadata and private-intake readiness QA (4 viewports)
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned QA-only Chromium Playwright
        run: |
          npm install --no-save --prefix qa/v169-security playwright@1.56.1
          cd qa/v169-security && npx playwright install --with-deps chromium
      - name: Serve source-only QA on localhost
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/v169-local.log 2>&1 &
          sleep 2
      - name: Run browser acceptance with network and overflow assertions
        run: node qa/v169-security/browser.test.cjs
      - name: V16.11P private operator Chromium localhost-only UAT (72 checks)
        run: node qa/v1611p-private/browser.test.cjs
      - name: V16.11P.1 quote and authorization Chromium QA (72 checks)
        run: node qa/v1611p1-operator/browser.test.cjs
      - name: V16.11P.2 localhost Chromium 68 checks
        run: node qa/v1611p2-authority/browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v169-private-owner-synthetic-readiness-screenshots
          path: |
            qa-artifacts-v169/
            qa-artifacts-v1611p/
            qa-artifacts-v1611p1/
            qa-artifacts-v1611p2/
          if-no-files-found: ignore

  v1610-disposable-postgres:
    name: V16.10 PG17 disposable RLS & synthetic restore (stacked fallback CI)
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: T404_SYNTHETIC_RUNNER_ONLY_20261116
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: T404_SYNTHETIC_RUNNER_ONLY_20261116
      T404_DISPOSABLE_QA_ONLY: "YES"
    steps:
      - uses: actions/checkout@v4
      - name: Guard syntax, repo and localhost before any synthetic SQL
        run: |
          bash -n qa/v1610-disposable/run-disposable.sh
          test "$GITHUB_REPOSITORY" = "ngoctien20/demo-git"
          test "$PGHOST" = "127.0.0.1"
          ! grep -RiE 'supabase\.co|postgresql://|PGHOST=.*\.cloud' qa/v1610-disposable/postgres-fixture.sql qa/v1610-disposable/test-store-rls.sql qa/v1610-disposable/run-disposable.sh
      - name: PG17 NOBYPASSRLS A/B isolation and local pg_dump restore verification
        run: bash qa/v1610-disposable/run-disposable.sh
      - name: Confirm no hosted data or real signed JWT in test
        run: echo "Synthetic PG17 only. No hosted backup/restore or Supabase Owner JWT verification."

name: TIEN404 V18.7.6C-M2 Meta Ingress Offline QA
on:
  push:
    branches:
      - work/v1876cm2-isolated-meta-ingress-no-deploy
  pull_request:
    branches:
      - work/v1876cm-messenger-event-inspector-no-send
    paths:
      - 'experiments/v1876cm2-meta-ingress/**'
      - '.github/workflows/v1876cm2-meta-ingress-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-deploy-worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Assert no deployment configuration
        run: |
          test ! -f experiments/v1876cm2-meta-ingress/wrangler.toml
          test ! -f experiments/v1876cm2-meta-ingress/wrangler.jsonc
          test ! -f experiments/v1876cm2-meta-ingress/.env
      - name: Run isolated signed Meta raw-body offline test suite
        run: node --test experiments/v1876cm2-meta-ingress/tests/*.test.mjs

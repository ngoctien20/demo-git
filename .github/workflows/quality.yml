name: TIEN404 AI · Static QA and Sass build
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript syntax
        run: node --check assets/site.js && node --check assets/site-config.js
      - name: Generated pages are in sync with site-src
        run: node scripts/build-site.mjs && git diff --exit-code -- '*.html' sitemap.xml
      - name: Static QA
        run: python qa_static.py
      - name: V23 site contract
        run: python -m unittest discover -s tests -p 'test_v23_*.py' -v

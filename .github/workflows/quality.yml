name: TIEN404 AI · Static QA and Sass build
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sass
        run: npm install --no-audit --no-fund
      - name: Build stylesheet from SCSS
        run: npm run build:css
      - name: Validate JavaScript syntax
        run: node --check assets/app.js && node --check assets/saas.js
      - name: Static QA
        run: python qa_static.py
      - name: Verify motion contracts
        run: python -m unittest discover -s tests -p test_motion_contract.py -v
      - name: Install SaaS contract test dependency
        run: python -m pip install beautifulsoup4
      - name: Verify SaaS experience
        run: python -m unittest discover -s tests -p test_saas_contract.py -v
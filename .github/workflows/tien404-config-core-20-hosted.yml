name: "TIEN404 Config Core step 20 (anon menu read) — restore-test, then backup + apply staging + bind demo Page"
# Owner-approved 2026-11-22 07:23 UTC (decision card "Hàm chỉ-đọc cho anon").
# restore-test: apply 20 -> hosted UAT 20 (rolled back) -> rollback 80 (fingerprint = pre) -> re-apply 20.
# staging (only if restore-test passed): guard -> encrypted backup artifact -> apply 20 -> hosted UAT 20
# (rolled back) -> bind demo Page to a QA Shop A assistant (environment demo) -> anon read check.
# On failure: automatic rollback 80 (+ unbind). One new function only. No n8n, no provider sends.
# Logs print tags and hashes only (this repository is public).
on:
  push:
    branches: [claude/project-thread-xv1r63]
    paths:
      - .github/workflows/tien404-config-core-20-hosted.yml
permissions:
  contents: read
concurrency:
  group: supabase-backup
  cancel-in-progress: false
env:
  RESTORE_REF: cunxxzxaboazbszsfneo
  STAGING_REF: ifxlvrhyjhbzbrkdsida
jobs:
  restore-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build restore-test connection (masked)
        env:
          RESTORE_DB_PASSWORD: ${{ secrets.RESTORE_DB_PASSWORD }}
        run: |
          [ -n "$RESTORE_DB_PASSWORD" ] || { echo "::error::missing RESTORE_DB_PASSWORD"; exit 1; }
          echo "::add-mask::$RESTORE_DB_PASSWORD"
          url=$(python3 -c 'import os,urllib.parse as u;print("postgresql://postgres.%s:%s@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"%(os.environ["RESTORE_REF"],u.quote(os.environ["RESTORE_DB_PASSWORD"],safe="")))')
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Guard (restore-test marker, 10 applied, 20 not yet)
        run: |
          [ "$(psql "$DB_URL" -X -At -c "select to_regclass('restore_test_guard.marker') is not null" 2>/dev/null)" = t ] || { echo "::error::not restore-test"; exit 1; }
          [ "$(psql "$DB_URL" -X -At -c "select to_regclass('public.assistants') is not null" 2>/dev/null)" = t ] || { echo "::error::step 10 missing"; exit 1; }
          st=$(psql "$DB_URL" -X -At -c "select (to_regprocedure('public.get_channel_menu(text,text)') is null)::text" 2>/dev/null)
          echo "NOT_APPLIED=$st"; echo "NOT_APPLIED=$st" >> "$GITHUB_ENV"
      - name: Fingerprint before
        run: |
          fp=$(psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1)
          [ -n "$fp" ] || exit 1; echo "PRE_FP=$fp" | tee -a "$GITHUB_ENV"
          [ "$NOT_APPLIED" = true ] || echo "(already applied: PRE_FP is the post state)"
      - name: Apply 20
        if: env.NOT_APPLIED == 'true'
        run: |
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f db/config-core/20_channel_menu_read.sql > out.txt 2>&1 \
            || { grep -o 'T404_[A-Z0-9_]*' out.txt | head -1; rm -f out.txt; echo "::error::apply failed (rolled back)"; exit 1; }
          grep -o 'T404_CC20_CHANNEL_MENU_READ_OK' out.txt || { rm -f out.txt; exit 1; }; rm -f out.txt
          fp=$(psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1)
          echo "POST_FP=$fp" | tee -a "$GITHUB_ENV"
      - name: Hosted UAT (all rows rolled back)
        run: |
          psql "$DB_URL" -X -q -f qa/config-core/hosted/hosted-uat-20.sql > out.txt 2>&1 || true
          r=$(grep -o 'T404_CC20_HOSTED_[A-Z_]*\( pass=[0-9]* fail=\[[A-Z0-9_ ]*\]\)\?' out.txt | head -1); rm -f out.txt
          echo "$r"; [ "$r" = "T404_CC20_HOSTED_UAT pass=9 fail=[]" ] || { echo "::error::hosted UAT failed"; exit 1; }
      - name: Rollback 80 -> fingerprint must equal pre -> re-apply 20
        if: env.NOT_APPLIED == 'true'
        run: |
          run(){ psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$1" > out.txt 2>&1 || { grep -o 'T404_[A-Z0-9_]*' out.txt | head -1; rm -f out.txt; echo "::error::$1 failed"; exit 1; }; grep -o "$2" out.txt; rm -f out.txt; }
          fp(){ psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1; }
          run db/config-core/80_channel_menu_read_rollback.sql T404_CC20_ROLLBACK_OK
          [ "$(fp)" = "$PRE_FP" ] && echo PASS_HOSTED_ROLLBACK_FP_EQUALS_PRE || { echo "::error::rollback fp mismatch"; exit 1; }
          run db/config-core/20_channel_menu_read.sql T404_CC20_CHANNEL_MENU_READ_OK
          [ "$(fp)" = "$POST_FP" ] && echo PASS_HOSTED_REAPPLY_FP_EQUALS_POST || { echo "::error::reapply fp mismatch"; exit 1; }
      - name: Side effects
        if: always()
        run: echo "TARGET=restore-test FINAL=config-core-20-applied STAGING_TOUCHED=0 N8N=0 PROVIDER_SENDS=0"

  staging:
    needs: restore-test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build staging connection (masked)
        env:
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$STAGING_DB_PASSWORD" ] || { echo "::error::missing STAGING_DB_PASSWORD"; exit 1; }
          [ "${#BACKUP_PASSPHRASE}" -ge 20 ] || { echo "::error::missing BACKUP_PASSPHRASE"; exit 1; }
          echo "::add-mask::$STAGING_DB_PASSWORD"
          url=$(python3 -c 'import os,urllib.parse as u;print("postgresql://postgres.%s:%s@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"%(os.environ["STAGING_REF"],u.quote(os.environ["STAGING_DB_PASSWORD"],safe="")))')
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Login + guard (staging, 10 applied, 20 not yet)
        run: |
          psql "$DB_URL" -X -At -c 'select 1' > /dev/null 2>&1 || { echo "::error::login failed"; exit 1; }
          [ "$(psql "$DB_URL" -X -At -c "select to_regclass('restore_test_guard.marker') is null" 2>/dev/null)" = t ] || { echo "::error::this is not staging"; exit 1; }
          [ "$(psql "$DB_URL" -X -At -c "select to_regclass('public.assistants') is not null" 2>/dev/null)" = t ] || { echo "::error::step 10 missing"; exit 1; }
          st=$(psql "$DB_URL" -X -At -c "select (to_regprocedure('public.get_channel_menu(text,text)') is null)::text" 2>/dev/null)
          echo "NOT_APPLIED=$st"; echo "NOT_APPLIED=$st" >> "$GITHUB_ENV"
          fp=$(psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1)
          echo "PRE_FP=$fp" | tee -a "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        if: env.NOT_APPLIED == 'true'
        with:
          version: latest
      - name: Backup staging immediately before apply (encrypted)
        if: env.NOT_APPLIED == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          mkdir -p backup
          supabase db dump --db-url "$DB_URL" -f backup/roles.sql --role-only > /dev/null 2>&1 || { echo "::error::roles dump failed"; exit 1; }
          supabase db dump --db-url "$DB_URL" -f backup/schema.sql > /dev/null 2>&1 || { echo "::error::schema dump failed"; exit 1; }
          supabase db dump --db-url "$DB_URL" -f backup/data.sql --use-copy --data-only > /dev/null 2>&1 || { echo "::error::data dump failed"; exit 1; }
          for f in backup/*.sql; do echo "$(basename $f) $(wc -c < $f) bytes"; done
          [ "$(wc -c < backup/schema.sql)" -gt 10000 ] || { echo "::error::schema dump too small"; exit 1; }
          stamp=$(date -u +%Y-%m-%dT%H%MZ); echo "STAMP=$stamp" >> "$GITHUB_ENV"
          tar -czf - backup | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            -o "tien404-staging-pre-cc20-$stamp.tar.gz.gpg" 3<<<"$BACKUP_PASSPHRASE"
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 -d "tien404-staging-pre-cc20-$stamp.tar.gz.gpg" 3<<<"$BACKUP_PASSPHRASE" 2>/dev/null | tar -tzf - > /dev/null || { echo "::error::backup does not decrypt"; exit 1; }
          sha256sum "tien404-staging-pre-cc20-$stamp.tar.gz.gpg" | tee "tien404-staging-pre-cc20-$stamp.sha256"
          rm -rf backup
          echo "BACKUP_OK"
      - uses: actions/upload-artifact@v4
        if: env.NOT_APPLIED == 'true'
        with:
          name: tien404-staging-pre-cc20-${{ env.STAMP }}
          path: |
            tien404-staging-pre-cc20-*.tar.gz.gpg
            tien404-staging-pre-cc20-*.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Apply 20
        if: env.NOT_APPLIED == 'true'
        run: |
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f db/config-core/20_channel_menu_read.sql > out.txt 2>&1 \
            || { grep -o 'T404_[A-Z0-9_]*' out.txt | head -1; rm -f out.txt; echo "::error::apply failed (rolled back)"; exit 1; }
          grep -o 'T404_CC20_CHANNEL_MENU_READ_OK' out.txt || { rm -f out.txt; exit 1; }; rm -f out.txt
          echo "APPLIED=1" >> "$GITHUB_ENV"
          fp=$(psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1)
          echo "POST_FP=$fp"
      - name: Hosted UAT (all rows rolled back)
        run: |
          psql "$DB_URL" -X -q -f qa/config-core/hosted/hosted-uat-20.sql > out.txt 2>&1 || true
          r=$(grep -o 'T404_CC20_HOSTED_[A-Z_]*\( pass=[0-9]* fail=\[[A-Z0-9_ ]*\]\)\?' out.txt | head -1); rm -f out.txt
          echo "$r"; [ "$r" = "T404_CC20_HOSTED_UAT pass=9 fail=[]" ] || { echo "::error::hosted UAT failed"; exit 1; }
          n=$(psql "$DB_URL" -X -At -c "select count(*) from public.channel_connections where external_account_id like 'uat-cc20%'" 2>/dev/null)
          [ "$n" = "0" ] && echo PASS_NO_UAT_ROWS_LEFT || { echo "::error::rows left $n"; exit 1; }
      - name: Bind demo Page (environment demo, QA Shop A) + anon read check
        run: |
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f qa/config-core/hosted/bind-demo-page.sql > out.txt 2>&1 \
            || { grep -o 'T404_[A-Z0-9_]*' out.txt | head -1; rm -f out.txt; echo "::error::bind failed (rolled back)"; exit 1; }
          grep -o 'T404_CC20_DEMO_[A-Z_]*' out.txt | sort -u; rm -f out.txt
          echo "BOUND=1" >> "$GITHUB_ENV"
          r=$(psql "$DB_URL" -X -At -c "set role anon; select (m->>'version_no')||':'||(select string_agg(i->>'id',',') from jsonb_array_elements(m->'menu') i)||':'||(m::text ~ '9c8c524c|tenant|store_id|assistant_id')::text from (select public.get_channel_menu('messenger','2379295362359912') m) x" 2>/dev/null | tail -1)
          echo "DEMO_MENU=$r"; case "$r" in *:catalog,order_lookup,handoff:false) echo PASS_DEMO_PAGE_MENU_READ;; *) echo "::error::demo read failed"; exit 1;; esac
      - name: Automatic rollback on failure (unbind + 80, fingerprint check)
        if: failure() && env.APPLIED == '1'
        run: |
          [ "${BOUND:-0}" = 1 ] && psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f qa/config-core/hosted/unbind-demo-page.sql > /dev/null 2>&1
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f db/config-core/80_channel_menu_read_rollback.sql > /dev/null 2>&1 || { echo "::error::rollback failed, restore from backup artifact"; exit 1; }
          fp=$(psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f qa/v20-store-authority/hosted/fingerprint.sql 2>/dev/null | tail -1 | cut -d'|' -f1)
          [ "$fp" = "$PRE_FP" ] && echo "ROLLED_BACK_TO_PRE" || echo "::error::rollback fingerprint mismatch, restore from backup artifact"
      - name: Side effects
        if: always()
        run: echo "TARGET=staging APPLIED=${APPLIED:-0} DEMO_BOUND=${BOUND:-0} N8N=0 PROVIDER_SENDS=0 META_CHANGES=0"

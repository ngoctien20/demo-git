name: TIEN404 Zalo Shop B Rich Text QA Gate — 3 cases max
on:
  push:
    branches: [work/v135-zalo-shopb-3message-gate-staging]
    paths:
      - "qa/zalo-control-text/**"
      - ".github/workflows/v135-zalo-shopb-3case-qa.yml"
  pull_request:
    paths:
      - "qa/zalo-control-text/**"
      - ".github/workflows/v135-zalo-shopb-3case-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker syntax and no-send regression
        run: |
          node --check qa/zalo-control-text/worker-qa-richtext-route.mjs
          node --test qa/zalo-control-text/worker-qa-richtext-route.test.mjs
          node --test qa/zalo-control-text/zalo-payloads.test.cjs
          node --test qa/sales-lite/v133/*.test.cjs

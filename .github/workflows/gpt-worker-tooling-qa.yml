name: GPT Worker tooling QA (offline, no Codex call)

on:
  pull_request:
    paths:
      - 'tools/gpt_worker.py'
      - 'tests/test_gpt_worker.py'
      - '.github/workflows/gpt-worker-tooling-qa.yml'
  push:
    branches: [develop]
    paths:
      - 'tools/gpt_worker.py'
      - 'tests/test_gpt_worker.py'
      - '.github/workflows/gpt-worker-tooling-qa.yml'

permissions:
  contents: read

jobs:
  offline-safety-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: GPT Worker file-guard and sandbox-argument tests (mocked Codex)
        run: python -m unittest discover -s tests -p test_gpt_worker.py -v

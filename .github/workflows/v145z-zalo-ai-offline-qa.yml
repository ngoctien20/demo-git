name: TIEN404 V14.5Z Zalo Real AI Offline Pilot QA
on:
  pull_request:
    paths:
      - 'qa/zalo-live-v145z/**'
      - '.github/workflows/v145z-zalo-ai-offline-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check (no provider/model credentials)
        run: |
          node --check qa/zalo-live-v145z/ai-pilot.cjs
          node --check qa/zalo-live-v145z/ai-pilot.test.cjs
          node --check qa/zalo-live-v145z/live01-preflight.cjs
          node --check qa/zalo-live-v145z/live01-preflight.test.cjs
      - name: Standalone Zalo AI offline negative QA
        run: node --test qa/zalo-live-v145z/ai-pilot.test.cjs
      - name: V14.5Z LIVE01 approval preflight negative QA
        run: node --test qa/zalo-live-v145z/live01-preflight.test.cjs
      - name: LIVE01 isolated D1 atomic replay CAS quota regression
        run: python3 qa/zalo-live-v145z/test_live01_d1_atomic.py
      - name: LIVE02 signed no-send Worker contract tests
        run: node --test qa/zalo-live-v145z/live02-nosend-worker.test.mjs
      - name: LIVE03 signed identity and n8n budget certification negative QA
        run: node --test qa/zalo-live-v145z/live03-identity-budget-gate.test.cjs
      - name: LIVE03B exact n8n price row and fail-closed monetary QA
        run: node --test qa/zalo-live-v145z/live03b-price-reconciliation.test.cjs
      - name: LIVE03C signed budget HTTP Worker contract QA
        run: node --test qa/zalo-live-v145z/live03c-budget-worker.test.mjs
      - name: LIVE03D provider immutable Bot ID, Shop and Owner strict no-send QA
        run: node --test qa/zalo-live-v145z/live03d-trusted-identity-preflight.test.cjs
      - name: LIVE03E server-only getMe digest attestation test
        run: node --test qa/zalo-live-v145z/live03e-readonly-provider-id-attestation.test.cjs
      - name: LIVE03E trial expiry and private backup continuity gate test
        run: node --test qa/zalo-live-v145z/live03e-trial-continuity-gate.test.cjs
      - name: LIVE03E local Cloud Console JSON/ZIP backup verification QA
        run: python3 qa/zalo-live-v145z/live03e_verify_n8n_export.test.py
      - name: UAT01 hosted synthetic storefront and browser UI no-send regression tests
        run: node --test qa/zalo-live-v145z/live04-uat-worker.test.mjs
      - name: G2 trusted Zalo Bot Shop B Owner private 4-root no-send gate QA
        run: node --test qa/zalo-live-v145z/g2-trusted-bot-shop-owner-gate.test.cjs
      - name: G2 signed getMe WebCrypto provider attestor compatibility QA
        run: node --test qa/zalo-live-v145z/g2-provider-identity-attestor.test.mjs
      - name: G2.1 private read-only getMe attestor endpoint 30 no-send negative QA
        run: node --test qa/zalo-live-v145z/g21-provider-attestor-route.test.mjs
      - name: Existing V13.8 handoff regression
        run: node --test qa/conversation-v138/conversation-core.test.cjs
      - name: No live outbound or DB mutation in candidate modules
        run: |
          ! grep -E 'https?://|fetch\(|axios|sendMessage\(|ZALO_SEND_ENABLED *= *true|INSERT INTO|UPDATE public\.orders|DELETE FROM' qa/zalo-live-v145z/ai-pilot.cjs qa/zalo-live-v145z/live01-preflight.cjs

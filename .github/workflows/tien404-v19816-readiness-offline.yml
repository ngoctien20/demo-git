name: "TIEN404 V19.8.16 Canonical Store Migration Preview and RPC Gate"
on:
  pull_request:
    paths:
      - "qa/channel-v19816/**"
      - ".github/workflows/tien404-v19816-readiness-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source admission tests only
        run: node --test qa/channel-v19816/hosted-readiness.test.mjs
      - name: Confirm no hosted migration or provider operations
        run: |
          test ! -e qa/channel-v19816/hosted-migration.sql
          test ! -e qa/channel-v19816/.env
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${ZALO_BOT_TOKEN:-}"
          echo "MIGRATIONS_APPLIED=0 RPC_MUTATIONS=0 PROVIDER_SEND=0 ORDER_WRITE=0 HOSTED_NO_GO"

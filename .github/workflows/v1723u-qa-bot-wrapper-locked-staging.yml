name: TIEN404 V17.23U QA Bot Wrapper and Locked Staging NO REAL SEND
on:
  pull_request:
    paths:
      - 'qa/v1723u/**'
      - 'qa/v1723s/isolated-qa-webhook.mjs'
      - '.github/workflows/v1723u-qa-bot-wrapper-locked-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked-receiver-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ZALO_BOT_TOKEN: ""
      QA_HEADER_SECRET: ""
      QA_EVENT_PEPPER: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Source-only V17.23S receptor regression
        run: node --test qa/v1723s/isolated-qa-webhook.test.mjs
      - name: Real documented Zalo envelope compatibility synthetic negative QA
        run: node --test qa/v1723u/zalo-bot-event-envelope.test.mjs
      - name: Authenticated rejection diagnostics source-only (never hosted)
        run: node --test qa/v1723u/qa-auth-rejection-diagnostic.test.mjs
      - name: Independent disposable SQLite migration and rollback QA (memory only)
        run: python3 qa/v1723u/qa_d1_disposable_schema_test.py
      - name: All entrypoints fail closed with missing private credentials
        run: |
          node --input-type=module -e "import {handleDedicatedQaWebhook} from './qa/v1723s/isolated-qa-webhook.mjs'; const r=await handleDedicatedQaWebhook(new Request('https://test.invalid/qa/zalo-bot/NO_REAL_BOT_AND_NO_WEBHOOK',{method:'POST',body:'{}'}),{});if(r.status!==404)process.exit(1);console.log('V1723U_SOURCE_ONLY_DEFAULT_404_PRIVATE_ROUTE_AND_D1_NOT_AUTHORIZED');"

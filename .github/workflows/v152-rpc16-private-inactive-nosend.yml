name: TIEN404 RPC16 — Inactive Private Access and R2 Binding (NO SEND)
on:
  pull_request:
    paths:
      - 'qa/v152-rpc16/**'
      - 'docs/ai-handoff/T404_RPC16_*'
      - '.github/workflows/v152-rpc16-private-inactive-nosend.yml'
  push:
    branches:
      - work/v152-rpc16-private-inactive-access-r2-nosend-20261117
permissions:
  contents: read
jobs:
  no-public-worker:
    name: All methods denied, no R2 usage, source integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed source and test 74 negative requests
        shell: bash
        run: |
          set -euo pipefail
          echo '112e72fd840066c8f74016ed84aff43eed5e9decb83c1454a325d4536e63ff59  qa/v152-rpc16/inactive-worker.mjs' | sha256sum -c -
          node --check qa/v152-rpc16/inactive-worker.mjs
          node --test qa/v152-rpc16/inactive-worker.test.mjs
          grep -Eq '"workers_dev"[[:space:]]*:[[:space:]]*false' qa/v152-rpc16/wrangler.jsonc
          grep -Eq '"preview_urls"[[:space:]]*:[[:space:]]*false' qa/v152-rpc16/wrangler.jsonc
  inherited-security:
    name: RPC15/RPC14/RPC13 source regressions, no cloud writes
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run inherited mocks only
        shell: bash
        run: |
          set -euo pipefail
          node --test qa/v152-rpc15/private-r2-quarantine.test.mjs
          node --test qa/v152-rpc14/smoke.test.mjs
          node --test qa/v152-rpc13/secure-identity-and-uat.test.mjs
          node - <<'NODE'
          const p=require('./qa/v152-rpc14/hosted-readiness.cjs').inspect({r2Enabled:true});
          if(p.canDeployUpload||p.canAcceptRealMerchantEvidence||p.canRunRealJwtUat||p.canRelease)throw Error('HOSTED_GATE_MUST_REMAIN_NO_GO');
          console.log('RPC16 HOSTED_NO_GO');
          NODE
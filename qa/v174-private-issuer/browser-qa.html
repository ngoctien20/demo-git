<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TIEN404 V17.4 — Private Website Chat QA</title>
  <style>
    body{margin:0;background:#0c1422;color:#eaf0ff;font:16px system-ui,sans-serif}
    main{max-width:620px;padding:24px;margin:35px auto}
    h1{font-size:23px}p{line-height:1.5;color:#bcc8da}
    #chat{background:#18283d;min-height:180px;border-radius:12px;padding:16px;margin:16px 0;display:flex;flex-direction:column;gap:10px}
    .message{padding:12px;border-radius:10px;background:#243b56;white-space:pre-wrap;overflow-wrap:anywhere}
    .user{background:#263e50;align-self:end}.bot{align-self:start}
    form{display:flex;gap:8px}input{flex:1;border:1px solid #8ea1bb;background:#fff;padding:12px;border-radius:8px;font:inherit}
    button{background:#85d3ee;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
    button:disabled{opacity:.5}#status{font-size:13px;color:#c5d0dc}
    .warning{border:1px solid #b39137;border-radius:8px;padding:12px;background:#312b19;color:#ffe0a1}
  </style>
</head>
<body>
  <main>
    <h1>TIEN404 — Website Chat QA</h1>
    <p class="warning">CHỈ ĐỂ KIỂM THỬ. Sản phẩm, giá và Shop là dữ liệu giả lập. Không gửi tin Messenger/Zalo, không ghi đơn.</p>
    <p id="status" role="status">Phiên QA chưa được cấp.</p>
    <section id="chat" aria-label="Lịch sử chat QA"></section>
    <form id="composer">
      <input id="message" aria-label="Nhập tin nhắn QA" maxlength="500" placeholder="Hỏi giá sản phẩm QA" autocomplete="off" required>
      <button id="send" type="submit">Gửi QA</button>
    </form>
  </main>
  <script type="module" src="/qa-ui.mjs"></script>
</body>
</html>

# Separate Worker for "Tạo trợ lý nhanh". Deploy only with the owner's approval.
# Secret (owner sets it in the Cloudflare dashboard, never in this repo): ANTHROPIC_API_KEY,
# or RELAY_API_KEY when AI_PROVIDER = "relay".
name = "tien404-setup-draft"
main = "worker/index.mjs"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
SETUP_DRAFT_ENABLED = "true"             # switch ON for the relay trial (Tiến 2026-11-24); "false" turns it off
APP_ORIGINS = "https://ngoctien20.github.io"
# AI: "anthropic" (official) or "relay" (OpenAI-compatible relay, TEST ONLY, no real shop data; Tiến 2026-11-24)
AI_PROVIDER = "relay"
AI_BASE_URL = "https://api.xingchiapi.com"
AI_MODEL = "gpt-6.1-sol"
SUPABASE_URL = "https://ifxlvrhyjhbzbrkdsida.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_e7L9qkumVD6Y57RSLaWsaQ_tRjF7OvF"   # public publishable key (same as the App)

[[d1_databases]]
binding = "SETUP_DB"
database_name = "tien404-setup"
database_id = "cb534e8d-d76d-4468-bf0f-fd72e6f244bd"
